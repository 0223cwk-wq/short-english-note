/* ---------- 3분 학습 · 오늘의 발견 · 복습 · 성장 ---------- */
const DAY=86400000;
function dayStr(t){const d=new Date(t);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function addDays(n){return dayStr(Date.now()+n*DAY);}
if(!DB.sr)DB.sr={};if(!DB.days)DB.days={};if(!DB.mini)DB.mini={};if(!DB.disc)DB.disc={};
function shuf(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function pickN(a,n){return shuf(a).slice(0,n);}
const IV=[1,2,4,7,14];
function dayRec(){const d=today();return DB.days[d]||(DB.days[d]={n:0,c:0,m:0,r:0});}
function srMark(key,ok,meta){
  const r=DB.sr[key]||(DB.sr[key]=Object.assign({box:0,right:0,wrong:0},meta||{}));
  if(ok){r.right++;r.box=Math.min(r.box+1,4);r.due=addDays(IV[r.box]);}else{r.wrong++;r.box=0;r.due=addDays(1);}
  r.last=Date.now();const D=dayRec();D.n++;if(ok)D.c++;
}
function srValid(k){const r=DB.sr[k];if(!r)return false;if(r.k==="d")return !!DISC.find(x=>x.id===r.did);return !!P(r.pid);}
function dueKeys(){const t=today();return Object.keys(DB.sr).filter(k=>DB.sr[k].due&&DB.sr[k].due<=t&&srValid(k)).sort((a,b)=>DB.sr[a].box-DB.sr[b].box);}
function weakKeys(){const t=today();return Object.keys(DB.sr).filter(k=>srValid(k)&&DB.sr[k].box<=1&&DB.sr[k].wrong>0&&!(DB.sr[k].due<=t));}
function activeDay(d){const D=DB.days[d];return !!(D&&(D.m>0||D.n>0||D.r>0));}
function streak(){let n=0,t=Date.now();if(!activeDay(dayStr(t)))t-=DAY;while(activeDay(dayStr(t))){n++;t-=DAY;}return n;}
function mastered(k){return Object.keys(DB.sr).filter(x=>(!k||DB.sr[x].k===k)&&DB.sr[x].box>=2&&srValid(x)).length;}
function levelInfo(){const m=mastered();return {lv:Math.floor(m/10)+1,cur:m%10,m};}
function todayDisc(){const n=Math.floor((Date.now()-new Date().getTimezoneOffset()*60000)/DAY);return DISC[((n%DISC.length)+DISC.length)%DISC.length];}
const KDATE=()=>{const d=new Date();return (d.getMonth()+1)+"월 "+d.getDate()+"일 "+["일","월","화","수","목","금","토"][d.getDay()]+"요일";};

/* grammar categories */
const GCAT=[["도치·강조",/도치|강조/],["가주어·가목적어",/가주어|가목적어/],["수일치",/수일치|단수|복수/],["관계사",/관계대명사|관계부사|관계절|선행사|which|whose|whom/],["분사",/분사/],["수동태",/수동|p\.p/],["병렬",/병렬/],["to부정사·동명사",/to부정사|동명사|to V|\+ -ing/]];
function gcat(x){for(const [n,re] of GCAT)if(re.test(x))return n;return "기타 구문";}
let GPOOL=null;
function gpool(){if(GPOOL)return GPOOL;GPOOL=[];ALL.forEach(id=>{const p=P(id);(p.gp||[]).forEach((g,i)=>{if(p.gpLoc[i]>=0)GPOOL.push({pid:id,gi:i,ex:g[1],cat:gcat(g[1])});});});return GPOOL;}
let VPOOL=null;
function vpool(){if(VPOOL)return VPOOL;VPOOL=[];ALL.forEach(id=>(P(id).vo||[]).forEach(v=>VPOOL.push(v[1])));return VPOOL;}

/* card builders */
function vocabQ(pid,w,m){const p=P(pid);let others=[...new Set((p.vo||[]).map(v=>v[1]).filter(x=>x!==m))];if(others.length<3)others=[...new Set(others.concat(vpool().filter(x=>x!==m)))];const o=shuf([m].concat(pickN(others,3)));return {w,m,o,a:o.indexOf(m)};}
function buildVocab(pid){const p=P(pid);const vs=(p.vo||[]).slice();if(vs.length<2)return null;
  const sc=v=>{const r=DB.sr["v|"+pid+"|"+v[0]];return r?r.box*10-r.wrong+Math.random():-5+Math.random();};
  vs.sort((a,b)=>sc(a)-sc(b));return {t:"v",pid,items:vs.slice(0,3).map(v=>vocabQ(pid,v[0],v[1]))};}
function grammarQ(pid,gi){const p=P(pid);const g=p.gp[gi];const cat=gcat(g[1]);const pool=gpool().filter(x=>x.cat!==cat&&x.ex!==g[1]);const o=shuf([g[1]].concat(pickN(pool,2).map(x=>x.ex)));return {t:"g",pid,gi,cat,o,a:o.indexOf(g[1])};}
function buildGrammar(pid){const p=P(pid);const c=(p.gp||[]).map((g,i)=>i).filter(i=>p.gpLoc[i]>=0);if(!c.length)return null;
  c.sort((a,b)=>{const ra=DB.sr["g|"+pid+"|"+a],rb=DB.sr["g|"+pid+"|"+b];return ((ra?ra.box:-1)-(rb?rb.box:-1))||(Math.random()-.5);});return grammarQ(pid,c[0]);}
function readingQ(pid,si){const p=P(pid);const ok=p.ko[si];const o=shuf([ok].concat(pickN(p.ko.filter((x,i)=>i!==si),2)));return {t:"r",pid,si,o,a:o.indexOf(ok)};}
function buildReading(pid){const p=P(pid);if(!p.ko||p.ko.length<3)return null;let idx=p.en.map((s,i)=>i).filter(i=>isKey(p,p.en[i]));if(!idx.length)idx=p.en.map((s,i)=>i);return readingQ(pid,pickN(idx,1)[0]);}
function paraQ(pid,mi){const m=VAR[pid].m[mi];const others=[];ALL.forEach(id=>{if(id!==pid&&VAR[id])VAR[id].m.forEach(x=>others.push(x[1]));});const o=shuf([m[1]].concat(pickN(others,2)));return {t:"q",pid,mi,src:m[0],o,a:o.indexOf(m[1])};}
function buildQuiz(pid){const q=VAR[pid];if(!q||!q.m||!q.m.length)return null;return paraQ(pid,Math.floor(Math.random()*q.m.length));}
function discQ(did){const D=DISC.find(x=>x.id===did);if(!D)return null;const idx=shuf(D.quiz.o.map((x,i)=>i));return {t:"dq",did,o:idx.map(i=>D.quiz.o[i]),a:idx.indexOf(D.quiz.a)};}

function recommendPid(){const sc=id=>(DB.mini[id]?DB.mini[id].n*100:0)+ALL.indexOf(id);return ALL.slice().sort((a,b)=>sc(a)-sc(b))[0];}
function buildMini(pid){
  const cards=[buildVocab(pid),buildGrammar(pid),buildReading(pid),buildQuiz(pid),{t:"d",did:todayDisc().id}].filter(Boolean);
  if(cards.length<2)return false;
  DB.sess={kind:"mini",pid,cards,i:0,ans:{},start:Date.now()};save();return true;
}
function cardFromSR(k){const r=DB.sr[k];if(!r)return null;
  if(r.k==="v")return {t:"v",pid:r.pid,items:[vocabQ(r.pid,r.w,r.m)],rv:1};
  if(r.k==="g")return Object.assign(grammarQ(r.pid,r.gi),{rv:1});
  if(r.k==="r")return Object.assign(readingQ(r.pid,r.si),{rv:1});
  if(r.k==="q")return Object.assign(paraQ(r.pid,r.mi),{rv:1});
  if(r.k==="d"){const c=discQ(r.did);return c?Object.assign(c,{rv:1}):null;}
  return null;}
function buildReview(keys,label){const cards=keys.slice(0,5).map(k=>{try{return cardFromSR(k);}catch(e){return null;}}).filter(Boolean);
  if(!cards.length)return false;DB.sess={kind:"rev",label:label||"오늘의 복습",cards,i:0,ans:{},start:Date.now()};save();return true;}
function buildCatReview(cat){const pool=gpool().filter(x=>x.cat===cat);const ks=pool.slice().sort((a,b)=>{const ra=DB.sr["g|"+a.pid+"|"+a.gi],rb=DB.sr["g|"+b.pid+"|"+b.gi];return ((ra?ra.box:-1)-(rb?rb.box:-1))||(Math.random()-.5);}).slice(0,5);
  const cards=ks.map(x=>Object.assign(grammarQ(x.pid,x.gi),{rv:1}));if(!cards.length)return false;
  DB.sess={kind:"rev",label:cat+" 집중 복습",cards,i:0,ans:{},start:Date.now()};save();return true;}

/* answering */
function cardDone(c,A){if(!A)return false;if(c.t==="v")return (A.p||[]).filter(x=>x!==undefined&&x!==null).length>=c.items.length;if(c.t==="d")return !!A.read;return A.p!==undefined;}
function answer(ci,sub,pk){const s=DB.sess;if(!s)return;const c=s.cards[ci];const A=s.ans[ci]||(s.ans[ci]={});
  if(c.t==="v"){A.p=A.p||[];if(A.p[sub]!==undefined&&A.p[sub]!==null)return;A.p[sub]=pk;A.hold=sub;const it=c.items[sub];const ok=pk===it.a;s.combo=ok?(s.combo||0)+1:0;srMark("v|"+c.pid+"|"+it.w,ok,{k:"v",pid:c.pid,w:it.w,m:it.m});}
  else{if(A.p!==undefined)return;A.p=pk;const ok=pk===c.a;s.combo=ok?(s.combo||0)+1:0;
    if(c.t==="g")srMark("g|"+c.pid+"|"+c.gi,ok,{k:"g",pid:c.pid,gi:c.gi,cat:c.cat});
    else if(c.t==="r")srMark("r|"+c.pid+"|"+c.si,ok,{k:"r",pid:c.pid,si:c.si});
    else if(c.t==="q")srMark("q|"+c.pid+"|"+c.mi,ok,{k:"q",pid:c.pid,mi:c.mi});
    else if(c.t==="dq")srMark("d|"+c.did,ok,{k:"d",did:c.did});}
  if(c.pid)logVisit(c.pid);save();}
function sessScore(s){let n=0,c=0;s.cards.forEach((cd,i)=>{const A=s.ans[i];if(!A)return;if(cd.t==="v")(A.p||[]).forEach((p,j)=>{if(p===undefined||p===null)return;n++;if(p===cd.items[j].a)c++;});else if(cd.t!=="d"&&A.p!==undefined){n++;if(A.p===cd.a)c++;}});return {n,c};}
function finishSess(){const s=DB.sess;if(!s||s.done)return;s.done=true;s.end=Date.now();const D=dayRec();
  st.justDone=true;if(s.kind==="mini"){D.m++;const m=DB.mini[s.pid]||(DB.mini[s.pid]={n:0});m.n++;m.last=Date.now();}else D.r++;
  save();}

function sentWithPhrase(s,phrase){const ns=norm(s),key=keyOf(phrase);const at=ns.indexOf(key);if(at<0)return esc(s);return esc(s.slice(0,at))+'<mark class="mgm">'+esc(s.slice(at,at+key.length))+'</mark>'+esc(s.slice(at+key.length));}
function renderCardBody(c,ci,A){
  A=A||{};let h="";

    const p=A.p||[];const ans=j=>p[j]!==undefined&&p[j]!==null;let cur=c.items.findIndex((x,j)=>!ans(j));const hold=(A.hold!==undefined&&A.hold!==null)?A.hold:-1;

    if(hold>=0){const it=c.items[hold];h+='<div class="vword">'+esc(it.w)+'</div>'+optBtns(ci,hold,it.o,it.a,p[hold],false)+verdict(p[hold]===it.a)+(cur>=0?'<button class="mbtn vnext" data-vnext="'+ci+'">다음 단어</button>':'');}
    else if(cur>=0){const it=c.items[cur];h+='<div class="vword">'+esc(it.w)+'</div>'+optBtns(ci,cur,it.o,it.a,undefined,false);}
  }
  else if(c.t==="g"){const p=P(c.pid);const g=p.gp[c.gi];const s=p.en[p.gpLoc[c.gi]]||g[0];
    h+='<p class="msent">'+sentWithPhrase(s,g[0])+'</p><p class="mq">파란 부분에서 시험에 나올 어법 포인트는?</p>'+optBtns(ci,0,c.o,c.a,A.p,false);
    if(A.p!==undefined){h+=verdict(A.p===c.a)+'<div class="mexp"><span class="mcat">'+esc(c.cat)+'</span>'+(g[2]?'<div class="trap">'+esc(g[2])+'</div>':'')+'</div>';}}
  else if(c.t==="r"){const p=P(c.pid);

  else if(c.t==="q"){

  else if(c.t==="d"){const D=DISC.find(x=>x.id===c.did);if(!D)return '<p class="empty">발견 콘텐츠를 불러오지 못했어. 다음 카드로 넘어가도 돼.</p>';

  else if(c.t==="dq"){const D=DISC.find(x=>x.id===c.did);

    if(A.p!==undefined)h+=verdict(A.p===c.a)+'<div class="mexp">'+esc(D.quiz.x)+'</div>';}
  return h;
}

  const words=mastered("v");

function fsRail(D){const r=DB.disc[D.id]||{};return '<div class="rail"><button class="rb" data-flike="'+D.id+'" aria-pressed="'+!!r.like+'" aria-label="좋아요"><span class="ric heart" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 20.5s-7.5-4.6-9.6-9.2A5.2 5.2 0 0 1 12 6.4a5.2 5.2 0 0 1 9.6 4.9C19.5 15.9 12 20.5 12 20.5z"/></svg></span><small>'+(r.like?"좋아":"좋아요")+'</small></button><button class="rb" data-fpass="'+D.pid+'" aria-label="연결 지문 보기"><span class="ric doc" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4M9.5 12h6M9.5 15.5h6" fill="none"/></svg></span><small>지문</small></button></div>';}
function slidesFor(D,idx,isToday){
  const A=ART[D.id]||{};const r=DB.disc[D.id]||{};let h="";
  h+=fsSlide(D,"hook",'<div class="fs-top"><span class="fs-badge">'+(isToday?"TODAY":"발견 "+(idx+1))+'</span><span class="fs-cat">'+esc(D.cat)+'</span></div><div class="fs-art">'+(A.svg||"")+'</div><h2 class="fs-hook">'+esc(D.q)+'</h2><p class="fs-hint"><span class="up" aria-hidden="true"></span>위로 넘겨서 답 찾기</p>',fsRail(D));
  h+=fsSlide(D,"pass",'<span class="fs-label">지문에 나온 내용 · '+esc(shortOf(D.pid))+'</span><p class="fs-big">'+esc(D.link)+'</p>',fsRail(D));
  h+=fsSlide(D,"deep",'<span class="fs-label ext">더 알아보기 · 지문 밖 정보</span>'+D.deep.map(x=>'<p class="fs-p">'+esc(x)+'</p>').join(""),fsRail(D));
  h+=fsSlide(D,"study",'<span class="fs-label ext">실제 연구</span><div class="fs-num">'+esc(A.big||"")+'</div><p class="fs-numl">'+esc(A.bigl||"")+'</p><p class="fs-p"><b>'+esc(D.study.name)+'</b><br>'+esc(D.study.body)+'</p>',fsRail(D));
  h+=fsSlide(D,"life",'<span class="fs-label">일상에서</span><p class="fs-big">'+esc(D.life)+'</p><div class="fs-think"><span>생각해 볼 질문</span>'+esc(D.think)+'</div>',fsRail(D));
  const qa=r.p;h+=fsSlide(D,"quiz",'<span class="fs-label">기억 확인 퀴즈</span><p class="fs-q">'+esc(D.quiz.q)+'</p><div class="fs-opts">'+D.quiz.o.map((o,k)=>{let c="fo";if(qa!==undefined){if(k===D.quiz.a)c+=" ok";else if(k===qa)c+=" no";}return '<button class="'+c+'" data-fq="'+D.id+'|'+k+'"'+(qa!==undefined?" disabled":"")+'>'+esc(o)+'</button>';}).join("")+'</div><div class="fs-res" aria-live="polite">'+(qa!==undefined?((qa===D.quiz.a?'<b class="g">정답!</b> ':'<b class="b">아깝다!</b> ')+esc(D.quiz.x)):"")+'</div>');
  h+=fsSlide(D,"src",'<span class="fs-label">출처</span><ul class="fs-src">'+D.src.map(s=>'<li><a href="'+esc(s[1])+'" target="_blank" rel="noopener">'+esc(s[0])+'</a></li>').join("")+'</ul><p class="fs-small">지문 밖 정보는 위 출처를 바탕으로 썼어.</p><button class="fs-btn" data-fpass="'+D.pid+'">'+esc(shortOf(D.pid))+' 지문 공부하기</button>');
  return h;
}
function openFeed(start){
  feedLast=document.activeElement;const list=discOrder(start);const tid=todayDisc().id;
  let h='<div class="fbar2"><button class="fclose" data-fclose aria-label="닫기">✕</button><span class="ftitle">오늘의 발견</span><span class="fcount" id="fcount">1 / '+list.length+'</span></div><div class="fscroll" id="fscroll">';
  list.forEach((D,i)=>{h+=slidesFor(D,i,D.id===tid);
    if(i===0)h+='<section class="fs fs-end" style="--bg:#111;--fg:#fff"><div class="fs-in center"><div class="stamp big">DONE</div><h2 class="fs-hook">오늘의 발견 끝!</h2><p class="fs-p">이제 3분만 공부하고 마무리할까?</p><button class="fs-btn" data-fgo="m">3분 공부하러 가기</button><p class="fs-small">더 보고 싶으면 위로 넘겨. 발견은 '+DISC.length+'개가 전부야.</p></div></section>';});
  h+='<section class="fs fs-end" style="--bg:#111;--fg:#fff"><div class="fs-in center"><h2 class="fs-hook">발견을 다 봤어</h2><p class="fs-p">내일 새로운 오늘의 발견이 열려.</p><button class="fs-btn" data-fclose>닫기</button></div></section></div>';
  feedEl.innerHTML=h;feedEl.hidden=false;document.body.classList.add("noscroll");
  const r=DB.disc[list[0].id]||(DB.disc[list[0].id]={});r.read=true;dayRec();save();
  const sc=document.getElementById("fscroll");sc.focus({preventScroll:true});
  if(feedObs)feedObs.disconnect();
  feedObs=new IntersectionObserver(es=>{es.forEach(e=>{if(!e.isIntersecting)return;const did=e.target.dataset.did;if(!did)return;const idx=list.findIndex(x=>x.id===did);const c=document.getElementById("fcount");if(c)c.textContent=(idx+1)+" / "+list.length;
    if(e.target.dataset.kind==="hook"||e.target.dataset.kind==="src"){const rr=DB.disc[did]||(DB.disc[did]={});if(!rr.read){rr.read=true;save();}}});},{root:sc,threshold:.6});
  sc.querySelectorAll(".fs").forEach(s=>feedObs.observe(s));
  const c=feedEl.querySelector(".fclose");if(c)c.focus({preventScroll:true});
}
function closeFeed(){if(feedObs)feedObs.disconnect();feedEl.hidden=true;feedEl.innerHTML="";document.body.classList.remove("noscroll");save();const y=window.scrollY;render();window.scrollTo(0,y);if(feedLast&&feedLast.focus)try{feedLast.focus({preventScroll:true});}catch(e){}}
feedEl.addEventListener("click",e=>{const t=e.target.closest("button");if(!t)return;const d=t.dataset;
  if(d.fclose!==undefined){closeFeed();return;}
  if(d.fgo){closeFeed();go({tab:d.fgo});return;}
  if(d.fpass){closeFeed();logVisit(d.fpass);go({tab:"p",id:d.fpass,set:d.fpass.split("-")[0],sub:"o"});return;}
  if(d.flike){const r=DB.disc[d.flike]||(DB.disc[d.flike]={});r.like=!r.like;save();feedEl.querySelectorAll('[data-flike="'+d.flike+'"]').forEach(b=>{b.setAttribute("aria-pressed",String(!!r.like));b.querySelector("small").textContent=r.like?"좋아":"좋아요";});return;}
  if(d.fq){const [id,k]=d.fq.split("|");const D=DISC.find(x=>x.id===id);const r=DB.disc[id]||(DB.disc[id]={});if(r.p!==undefined)return;r.p=+k;const ok=+k===D.quiz.a;srMark("d|"+id,ok,{k:"d",did:id});save();
    const box=t.closest(".fs");box.querySelectorAll("[data-fq]").forEach((b,i)=>{b.disabled=true;if(i===D.quiz.a)b.classList.add("ok");else if(i===+k)b.classList.add("no");});
    box.querySelector(".fs-res").innerHTML=(ok?'<b class="g">정답!</b> ':'<b class="b">아깝다!</b> ')+esc(D.quiz.x);return;}
});
document.addEventListener("keydown",e=>{if(feedEl.hidden)return;if(e.key==="Escape")closeFeed();
  else if(e.key==="ArrowDown"||e.key==="ArrowUp"){const sc=document.getElementById("fscroll");if(!sc)return;e.preventDefault();sc.scrollBy({top:(e.key==="ArrowDown"?1:-1)*sc.clientHeight,behavior:"smooth"});}});

function render(){

  document.querySelectorAll(".nav button").forEach(b=>{if(b.dataset.tab===navTab)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current");});

  if(d.pair){const i=d.pair;st.open={};go({tab:"e",sty:"cmp"});const el=document.getElementById("pair"+i);if(el)el.scrollIntoView({block:"start"});return;}
  if(d.goto){const el=document.getElementById(d.goto);if(el)el.scrollIntoView({block:"start"});return;}
  if(d.reset!==undefined){if(confirm("진도, 저장한 지문, 변형 문제 기록을 모두 지울까?")){DB.prog={};DB.sr={};DB.days={};DB.mini={};DB.disc={};DB.sess=null;DB.qa={};DB.bm={};DB.log={};DB.last=null;DB.wrong={};DB.rv={};DB.sq={};KEEP.clear();save();render();}return;}
  if(t.matches("mark.gm")){const p=P(st.id);const g=p.gp[+d.g];const w=t.closest(".sent").querySelector(".gwrap");const was=w.dataset.cur===d.g;w.dataset.cur=was?"":d.g;w.innerHTML=was?"":'<div class="gnote">'+esc(g[1])+(g[2]?'<div class="trap">'+esc(g[2])+"</div>":"")+"</div>";return;}
});
app.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.matches("mark.gm,[data-rev][role=button]")){e.preventDefault();e.target.click();}});
const GUIDE=[
{t:"노란 버튼 하나면 끝",d:["홈의 <b>3분 도전 START</b>를 눌러.","카드 5장만 풀면 오늘 공부 성공!"],demo:'<div class="gbig">3분 도전<br>START</div>'},
{t:"맞으면 초록, 틀리면 빨강",d:["답을 누르면 바로 색으로 알려 줘.","틀린 건 <b>복습</b>에 모여서 다음 날 다시 나와."],demo:'<div class="gopts"><span class="fo ok">정답이면 초록</span><span class="fo no">틀리면 빨강</span></div>'},
{t:"오늘의 발견은 위로 넘겨",d:["숏츠처럼 위로 넘기면서 1분 지식을 봐.","지문 주제에서 출발한 진짜 연구 이야기야."],demo:ART.retrieval.svg},
{t:"지문 공부는 지문 탭",d:["문장마다 해석, 쉬운 설명, 문법, 단어가 있어."],demo:'<div class="gbig">지문 48개</div>'},
{t:"기록에서 성장 확인",d:["연속 학습일, 레벨, 정답률이 쌓여."],demo:'<div class="gbig">Lv.1 → Lv.2</div>'}
];
let gi=0;const gEl=document.getElementById("guide");let gLast=null;
function drawGuide(){const s=GUIDE[gi];const last=gi===GUIDE.length-1;
  gEl.innerHTML='<div class="gback" data-gclose></div><div class="gbox" role="dialog" aria-modal="true" aria-labelledby="gtitle"><div class="gtop"><span class="gstep">사용 방법 '+(gi+1)+' / '+GUIDE.length+'</span><button class="gskip" data-gclose>'+(last?"닫기":"건너뛰기")+'</button></div><div class="gdemo" aria-hidden="true">'+s.demo+'</div><h2 id="gtitle" class="gt">'+s.t+'</h2><ul class="gl">'+s.d.map(x=>'<li>'+x+'</li>').join('')+'</ul><div class="gdots" aria-hidden="true">'+GUIDE.map((_,i)=>'<i class="'+(i===gi?'on':'')+'"></i>').join('')+'</div><div class="gnav"><button data-gmove="-1"'+(gi===0?' disabled':'')+'>이전</button><button class="primary gnext" data-gmove="1">'+(last?"공부 시작하기":"다음")+'</button></div></div>';
  const n=gEl.querySelector(".gnext");if(n)n.focus();}
function openGuide(){gLast=document.activeElement;gi=0;gEl.hidden=false;document.body.classList.add("noscroll");drawGuide();}
function closeGuide(){gEl.hidden=true;gEl.innerHTML="";document.body.classList.remove("noscroll");DB.seenGuide=true;DB.seenGuide2=true;save();if(gLast&&gLast.focus)gLast.focus();}
function moveGuide(m){if(gi+m>=GUIDE.length){closeGuide();return;}gi=Math.max(0,gi+m);drawGuide();}
gEl.addEventListener("click",e=>{const t=e.target.closest("[data-gclose],[data-gmove]");if(!t)return;if(t.dataset.gclose!==undefined){closeGuide();return;}moveGuide(+t.dataset.gmove);});
let gx=null;gEl.addEventListener("touchstart",e=>{gx=e.touches[0].clientX;},{passive:true});
gEl.addEventListener("touchend",e=>{if(gx===null)return;const dx=e.changedTouches[0].clientX-gx;gx=null;if(Math.abs(dx)>60){if(dx<0)moveGuide(1);else if(gi>0)moveGuide(-1);}},{passive:true});
document.addEventListener("keydown",e=>{if(gEl.hidden)return;if(e.key==="Escape")closeGuide();else if(e.key==="ArrowRight")moveGuide(1);else if(e.key==="ArrowLeft"&&gi>0)moveGuide(-1);});
app.addEventListener("click",e=>{if(e.target.closest("[data-guide]"))openGuide();});
if(!DB.seenGuide2)setTimeout(openGuide,300);
WIDE.addEventListener("change",()=>render());
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden"){remember();save();}});
render();
})();

</script>
</body>
