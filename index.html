:root{

.wrap{max-width:760px;margin:0 auto;padding:0 18px 120px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--line)}
.top .in{max-width:760px;margin:0 auto;padding:14px 18px 12px;display:flex;align-items:baseline;gap:12px}
.brand{font-weight:700;font-size:19px;letter-spacing:-0.01em}
.brand b{background:linear-gradient(transparent 58%,var(--hl) 58%);font-weight:700}
.sub{color:var(--mute);font-size:13px}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--sheet);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.nav button{background:none;border:0;padding:12px 4px 13px;font-size:14px;color:var(--mute);font-weight:500}
.nav button[aria-current="page"]{color:var(--ink);font-weight:700}
.nav button[aria-current="page"] span{background:linear-gradient(transparent 55%,var(--hl) 55%)}

/* set selector */
.sets{display:flex;gap:6px;margin:18px 0 6px;flex-wrap:wrap}
.sets button{border:1px solid var(--line);background:var(--sheet);padding:6px 11px;border-radius:20px;font-size:13.5px}
.sets button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.hint{color:var(--mute);font-size:13px;margin:8px 0 14px}

/* number grid */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (min-width:560px){.grid{grid-template-columns:repeat(8,1fr)}}
.tile{position:relative;background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:10px 8px 9px;text-align:left;min-height:84px;display:flex;flex-direction:column;justify-content:space-between}
.tile .n{font-family:var(--serif);font-size:26px;line-height:1;font-weight:600}
.tile .t{font-size:11px;color:var(--mute);line-height:1.3;margin-top:6px}
.tile .pen{position:absolute;top:9px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--red)}
.bars{display:flex;gap:3px;margin-top:7px}
.bars i{flex:1;height:3px;border-radius:2px;background:var(--line)}
.bars i.on{background:var(--blue)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin-top:12px}
.legend .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--red);margin-right:5px;vertical-align:1px}

/* passage view */
.phead{padding:16px 0 4px}
.back{background:none;border:0;padding:6px 10px 6px 0;color:var(--blue);font-size:calc(18px*var(--scale,1));font-weight:700;display:inline-flex;align-items:center;gap:4px}
.back .arr{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto;margin-left:-4px}
.ptitle{font-size:22px;font-weight:700;margin:6px 0 2px;letter-spacing:-0.01em}
.ptype{font-size:13px;color:var(--mute)}
.subs{position:sticky;top:calc(env(safe-area-inset-top,0px) + 53px);z-index:15;background:var(--paper);display:flex;gap:6px;overflow-x:auto;padding:10px 0;margin:0 -18px;padding-left:18px;padding-right:18px;scrollbar-width:none;border-bottom:1px solid var(--line)}
.subs::-webkit-scrollbar{display:none}
.subs button{flex:0 0 auto;border:0;background:none;padding:6px 10px;border-radius:8px;font-size:14px;color:var(--mute);font-weight:500}
.subs button[aria-selected="true"]{background:var(--bluesoft);color:var(--blue);font-weight:700}

h2{font-size:15px;margin:26px 0 8px;color:var(--mute);font-weight:500}
.lead{font-size:17px;font-weight:500;margin:0}
.en-title{font-family:var(--serif);font-size:17px;line-height:1.5}
ol.flow{margin:0;padding:0;list-style:none;counter-reset:f}
ol.flow li{counter-increment:f;position:relative;padding:8px 0 8px 34px;border-bottom:1px dashed var(--line)}
ol.flow li:last-child{border-bottom:0}
ol.flow li::before{content:counter(f);position:absolute;left:0;top:8px;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--ink);font-size:12px;font-weight:700;display:grid;place-items:center}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--sheet);border-radius:16px;padding:3px 10px;font-size:13px;line-height:1.6}
a.chip,button.chip{color:var(--blue)}

/* sentences */
.tools{display:flex;gap:8px;align-items:center;margin:16px 0 4px;flex-wrap:wrap}
.toggle{border:1px solid var(--line);background:var(--sheet);border-radius:8px;padding:6px 12px;font-size:13px}
.toggle[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.notice{background:var(--hlsoft);border-radius:10px;padding:12px 14px;font-size:14px;margin:14px 0}
.sent{padding:16px 0;border-bottom:1px solid var(--line)}
.sent .no{font-size:12px;color:var(--mute);font-weight:700;margin-bottom:4px}
.sent .en{font-family:var(--serif);font-size:18px;line-height:1.65;margin:0}
mark.hl{background:linear-gradient(transparent 60%,var(--hl) 60%);color:inherit;padding:0 1px;cursor:pointer;border-radius:2px}
.gnote{margin-top:8px;border-left:3px solid var(--hl);padding:4px 0 4px 10px;font-size:14px}
.ko{margin-top:8px;font-size:15px}
.reveal{background:none;border:1px dashed var(--line);border-radius:8px;padding:6px 10px;font-size:13px;color:var(--mute);margin-top:8px}
dl.ex{margin:10px 0 0;display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:14px}
dl.ex dt{color:var(--mute);white-space:nowrap}
dl.ex dd{margin:0}
.easy{background:var(--sheet);border-radius:8px;padding:8px 10px;margin-top:8px;font-size:15px}

/* vocab */
.vrow{display:grid;grid-template-columns:minmax(120px,40%) 1fr;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);align-items:baseline}
.vrow .w{font-family:var(--serif);font-weight:600;font-size:17px}
.vrow .m.hidden{color:transparent;background:var(--line);border-radius:4px;user-select:none;cursor:pointer}

/* grammar */
.gcard{padding:14px 0;border-bottom:1px solid var(--line)}
.gcard .ph{font-family:var(--serif);font-size:17px}
.gcard .ph mark{background:linear-gradient(transparent 60%,var(--hl) 60%);color:inherit}
.gcard .why{margin-top:6px}
.trap{color:var(--red);font-weight:500;margin-top:4px;font-size:14px}
.trap::before{content:"함정 ";font-weight:700}
.jump{background:none;border:0;color:var(--blue);font-size:13px;padding:4px 0 0;font-weight:500}

/* predictions & essay */
.pitem{padding:14px 0;border-bottom:1px solid var(--line)}
.pitem .k{font-weight:700}
.eitem{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:12px 0;border-left:4px solid var(--red)}
.eitem .k{font-weight:700;font-size:14px;color:var(--red)}
.eitem .q{font-family:var(--serif);font-size:16.5px;margin:8px 0}
.ans{margin-top:8px;padding:8px 10px;background:var(--hlsoft);border-radius:8px;font-size:15px}

/* checks */
.checks{display:flex;gap:8px;flex-wrap:wrap;margin:30px 0 0;padding-top:16px;border-top:2px solid var(--ink)}
.checks button{flex:1 1 30%;min-width:96px;border:1px solid var(--line);background:var(--sheet);border-radius:10px;padding:10px 6px;font-size:14px}
.checks button[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:700}

/* essay hub */
.pair{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:12px 0}
.pair .th{font-weight:700;font-size:16px}
.pair .ab{display:flex;gap:6px;margin:8px 0;flex-wrap:wrap}
.pair .cm{font-size:15px}
.pair .dd{margin-top:10px;font-size:14.5px}
.pair .dd p{margin:6px 0}
.tag{display:inline-block;font-size:12px;font-weight:700;border:1.5px solid currentColor;border-radius:4px;padding:0 5px;margin-right:6px;line-height:1.5}
.form{padding:14px 0;border-bottom:1px solid var(--line)}
.form .ft{font-weight:700}
.form p{margin:4px 0 8px;color:var(--mute);font-size:14px}

/* patterns */
.pat{padding:14px 0;border-bottom:1px solid var(--line)}
.pat .h{font-weight:700}
.pat p{margin:4px 0 0;font-size:15px}
.stat{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.stat div{flex:1 1 140px;background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat b{font-family:var(--serif);font-size:28px;display:block;line-height:1.1}
.stat span{font-size:13px;color:var(--mute)}

/* progress */
.meter{height:10px;border-radius:6px;background:var(--line);overflow:hidden;margin:8px 0 4px}
.meter i{display:block;height:100%;background:var(--blue)}
.reset{margin-top:24px;background:none;border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:13px;color:var(--mute)}
@media (prefers-reduced-motion:no-preference){.sent.flash{animation:fl 1.4s ease}@keyframes fl{0%{background:var(--hlsoft)}100%{background:transparent}}}

.key{background:linear-gradient(transparent 38%,var(--hl) 38%);-webkit-box-decoration-break:clone;box-decoration-break:clone;padding:0 2px}
.sent.is-key .no::after{content:"  핵심 문장";color:var(--ink)}
mark.gm{background:none;color:var(--blue);font-weight:600;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px;cursor:pointer}
.vw{color:var(--red);font-weight:600}
.legend2{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;margin:14px 0 4px;padding:10px 12px;background:var(--sheet);border:1px solid var(--line);border-radius:10px}
.legend2 .k1{background:linear-gradient(transparent 38%,var(--hl) 38%);padding:0 3px}
.legend2 .k2{color:var(--red);font-weight:700}
.legend2 .k3{color:var(--blue);font-weight:700;text-decoration:underline;text-underline-offset:3px}
.lead.key-lead{display:inline;background:linear-gradient(transparent 38%,var(--hl) 38%);-webkit-box-decoration-break:clone;box-decoration-break:clone}
.vrow .w{color:var(--red)}
.gcard .ph mark{background:none!important;color:var(--blue);font-weight:600;text-decoration:underline;text-underline-offset:3px}
:root{--scale:1}
:root[data-fs="1"]{--scale:1.12}
:root[data-fs="2"]{--scale:1.26}
body{font-size:calc(16px*var(--scale))}
.sent .en{font-size:calc(18px*var(--scale))}
.ko,.easy{font-size:calc(15px*var(--scale))}
.nav .in{grid-template-columns:repeat(7,1fr)}
.nav button{font-size:12.5px;line-height:1.25;padding-left:1px;padding-right:1px}
.nav button span{white-space:nowrap;letter-spacing:-0.03em}
@media (max-width:370px){.nav button{font-size:11px}}
@media (min-width:900px){.nav button{font-size:15px}}
.nav button{min-height:52px}
.top[hidden]{display:none}
/* home */
.hero{padding:44px 0 22px;border-bottom:2px solid var(--ink);margin-bottom:22px}
.hero h1{font-size:calc(31px*var(--scale));line-height:1.25;margin:0 0 14px;letter-spacing:-0.02em;font-weight:700}
.hero .range{margin:0;color:var(--mute);font-size:15px;line-height:1.6}
.start{display:grid;gap:10px}
.big{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:1.5px solid var(--ink);background:var(--sheet);border-radius:14px;padding:16px 18px;min-height:72px}
.big.primary{background:var(--ink);color:var(--paper)}
.big .bt{font-weight:700;font-size:18px}
.big .bd{font-size:14px;opacity:.8}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.quick button{border:1px solid var(--line);background:var(--sheet);border-radius:12px;padding:12px 8px;min-height:84px;display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left}
.quick b{font-size:20px;font-family:var(--serif)}
.quick span{font-size:13px;color:var(--mute);line-height:1.35}
.links{margin-top:18px;border-top:1px solid var(--line)}
.linkrow{display:flex;justify-content:space-between;align-items:center;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:14px 2px;min-height:52px;font-size:16px;text-align:left}
.linkrow .arrow{font-size:22px;color:var(--mute)}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--sheet)}
.seg button{border:0;background:none;padding:9px 12px;min-height:44px;font-size:14px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);font-weight:700}
.madeby{text-align:right;font-size:11px;color:var(--mute);letter-spacing:.02em;margin-top:36px}
/* passage header */
.prow{display:flex;justify-content:space-between;align-items:center}
.back{min-height:44px}
.bmbtn{border:1px solid var(--line);background:var(--sheet);border-radius:20px;padding:6px 14px;min-height:40px;font-size:14px}
.bmbtn[aria-pressed="true"]{border-color:var(--ink);font-weight:700}
.tile .star{position:absolute;top:5px;right:22px;font-size:11px}
.tile.small{min-height:60px}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:16px}
.pager button{flex:1;border:1px solid var(--line);background:var(--sheet);border-radius:10px;min-height:48px;font-size:14px}
.subs button{min-height:40px}
/* quiz */
.qprog{display:flex;justify-content:space-between;align-items:baseline;margin-top:6px;font-weight:700}
.qcard{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:16px 16px 18px;margin:14px 0}
.qlabel{font-size:12px;color:var(--mute);font-weight:700}
.qask{font-weight:700;margin:6px 0 10px}
.qtext{font-family:var(--serif);font-size:calc(17.5px*var(--scale));line-height:1.7;margin:0 0 14px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:11px 12px;min-height:48px;font-family:var(--serif);font-size:calc(16px*var(--scale));line-height:1.45}
.opt .cn{font-family:var(--sans);font-weight:700}
.opt:disabled{cursor:default;opacity:1;color:var(--ink)}
.opt.ok{border:2px solid var(--blue);background:var(--bluesoft)}
.opt.no{border:2px solid var(--red)}
.result{margin-top:14px;font-weight:700;font-size:17px}
.result.good{color:var(--blue)}
.result.bad{color:var(--red)}
.xpl{margin:6px 0 0}
.mh{font-size:14px;color:var(--mute);margin:16px 0 6px;font-weight:500}
.mrow{padding:9px 0;border-top:1px dashed var(--line);font-size:14.5px}
.mrow .ml{display:inline-block;font-size:11px;font-weight:700;border:1px solid currentColor;border-radius:4px;padding:0 4px;margin-right:6px}
.mo{font-family:var(--serif);color:var(--mute)}
.mv{font-family:var(--serif);margin-top:3px}
.qbtns{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.qbtns button{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:8px 14px;min-height:44px;font-size:14px}
.qnav{position:sticky;bottom:calc(env(safe-area-inset-bottom,0px) + 60px);display:flex;gap:8px;padding:10px 0;background:var(--paper)}
.qnav button{flex:1;min-height:52px;border:1px solid var(--line);background:var(--sheet);border-radius:12px;font-size:15px;font-weight:500}
.qnav button.primary{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:700}
.qnav button:disabled{opacity:.4;cursor:default}
/* records */
.empty{color:var(--mute);background:var(--sheet);border:1px dashed var(--line);border-radius:10px;padding:14px;font-size:14px;margin:0}
.rrow{display:flex;gap:8px;align-items:stretch;border-bottom:1px solid var(--line)}
.rmain{flex:1;text-align:left;background:none;border:0;padding:12px 0;display:flex;flex-direction:column;gap:2px;min-height:52px}
.rmain span{font-size:14px;color:var(--mute)}
.rx{background:none;border:0;color:var(--red);font-size:14px;padding:0 6px;min-width:52px}
.day{padding:10px 0;border-bottom:1px solid var(--line)}
.dd2{font-weight:700;margin-bottom:6px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 132px);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-size:14px;z-index:40;max-width:calc(100% - 32px);text-align:center}
#toast[hidden]{display:none}
.wrap{padding-bottom:140px}
@media (min-width:700px){.quick button{min-height:72px}}
.hero{position:relative}
.dday{position:absolute;top:12px;right:0;display:flex;flex-direction:column;align-items:flex-end;line-height:1.1}
.dday .dl{font-size:11px;color:var(--mute);font-weight:500}
.dday .dn{font-family:var(--serif);font-size:calc(26px*var(--scale));font-weight:600;color:var(--ink);margin-top:2px}
.dday.soon .dn{color:var(--red)}
.titlerow{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.titlerow h1{margin:0}
.titlerow .madeby{margin:0;font-size:12px;color:var(--mute);letter-spacing:.02em;text-align:left}
.hero .subtitle{margin:8px 0 12px;font-size:calc(18px*var(--scale));font-weight:700}
.hero .rl{display:inline-block;font-size:12px;font-weight:700;border:1px solid currentColor;border-radius:4px;padding:0 5px;margin-right:7px;vertical-align:1px}
.guidebtn{margin-top:16px;border:1px solid var(--ink);background:var(--sheet);border-radius:20px;padding:8px 16px;min-height:44px;font-size:14px;font-weight:700}
#guide{position:fixed;inset:0;z-index:50}
#guide[hidden]{display:none}
.gback{position:absolute;inset:0;background:rgba(0,0,0,.5)}
.gbox{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(440px,calc(100% - 28px));max-height:calc(100% - 48px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow-y:auto;background:var(--sheet);color:var(--ink);border-radius:18px;padding:16px 18px 18px}
.gtop{display:flex;justify-content:space-between;align-items:center}
.gstep{font-size:13px;color:var(--mute);font-weight:700}
.gskip{background:none;border:0;color:var(--mute);font-size:14px;min-height:44px;padding:0 4px}
.gdemo{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px;min-height:140px;display:flex;flex-direction:column;justify-content:center;gap:8px;margin-top:4px}
.gt{font-size:20px;color:var(--ink);font-weight:700;margin:16px 0 8px}
.gl{margin:0;padding-left:18px}
.gl li{margin:4px 0;line-height:1.55}
.gdots{display:flex;justify-content:center;gap:6px;margin:16px 0 12px}
.gdots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.gdots i.on{background:var(--ink);width:18px;border-radius:4px}
.gnav{display:flex;gap:8px}
.gnav button{flex:1;min-height:50px;border:1px solid var(--line);background:var(--paper);border-radius:12px;font-size:15px;font-weight:500}
.gnav button.primary{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:700}
.gnav button:disabled{opacity:.4}
body.noscroll{overflow:hidden}
.mb{border:1px solid var(--line);background:var(--sheet);border-radius:10px;padding:10px 12px;font-size:14px}
.mb.dark{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:700}
.mrowx{display:flex;gap:6px}
.mrowx>*{flex:1;text-align:center}
.mtile{position:relative;border:1px solid var(--line);background:var(--sheet);border-radius:8px;padding:6px 8px;font-family:var(--serif);font-weight:600;font-size:18px;text-align:left}
.mtile .pen{top:6px;right:6px}
.mpill{border-radius:8px;padding:5px 8px;font-size:13px;color:var(--mute);text-align:center}
.mpill.on{background:var(--bluesoft);color:var(--blue);font-weight:700}
.gdemo .en{font-family:var(--serif);font-size:17px;line-height:1.6;margin:0}
.mopt{border:1px solid var(--line);background:var(--sheet);border-radius:8px;padding:7px 10px;font-family:var(--serif);font-size:14px}
.mopt.ok{border:2px solid var(--blue);background:var(--bluesoft)}
.mopt.no{border:2px solid var(--red)}
.start{grid-template-columns:1fr!important}
html.nomarks .sent .key{background:none;padding:0}
html.nomarks .sent .vw{color:inherit;font-weight:inherit}
html.nomarks .sent mark.gm{color:inherit;text-decoration:none;font-weight:inherit;pointer-events:none;cursor:default}
html.nomarks .sent.is-key .no::after{content:none}
html.nomarks .legend2,html.nomarks .gwrap{display:none}
.marksbtn{min-height:44px}
.mnote{font-size:12px;color:var(--mute);text-align:center}
.stypes{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:18px}
@media (min-width:640px){.stypes{grid-template-columns:repeat(5,1fr)}}
