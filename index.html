window.VAR = {"2024-21":{"v":"Picture a friend who is normally tight with money. After swallowing a pill designed to boost generosity, he happily buys you a Christmas gift. You would surely thank him sincerely, and there is something admirable in what he did. Still, something feels missing. The American philosopher Zagzebski would say he has not truly become generous. Calling someone generous, kind, or brave is a judgment about their character, and character is not built from a single act. A virtue is a lasting feature of who a person is, an emotional habit shaped over the course of one's life. A sudden impulse, by contrast, has no such history behind it. This is why goodness cannot be acquired instantly; no medication can turn us into better people overnight.","o":["The difficulty of judging others' generosity fairly","Why virtue cannot be gained instantly but grows from personal history","The role of medicine in shaping moral behavior","How gift-giving strengthens friendships","The danger of praising people's character too quickly"],"a":1,"x":"미덕은 개인의 역사로 형성되므로 즉석에서 얻을 수 없다는 게 주제야. ③은 약(medicine)이 나오긴 하지만 예시일 뿐 핵심이 아니야.","m":[["stingy","tight with money"],["Instant virtue is therefore impossible","goodness cannot be acquired instantly"],["Popping a pill cannot make you a better person","no medication can turn us into better people"]]},"2024-22":{"v":"Finding out how heavy a bowling ball is takes little effort: place it on a scale and compare it against weights whose mass is already known. A faraway star, however, cannot be put on any scale. For a pair of stars orbiting each other, astronomers must first locate the point around which both revolve, measure each star's distance from it, and then combine these figures with the orbital period and Kepler's Third Law. The star's mass is never observed directly; it is derived from other quantities through equations. What we call measurement, then, is not a pure reading of properties that exist on their own. It is a decision about magnitudes made within a framework of theories we already accept.","o":["The limits of telescopes in observing distant stars","Why everyday objects are easier to weigh than stars","Kepler's Third Law as the foundation of modern astronomy","The importance of accuracy in scientific instruments","Measurement as a process that depends on accepted theories"],"a":4,"x":"측정은 이론을 배경으로 한 결정이라는 마지막 문장이 주제야. ②은 볼링공과 별의 대비라는 예시만 잡은 선지야.","m":[["balance","scale"],["unmediated estimation of independently existing properties","a pure reading of properties that exist on their own"],["before the background of a number of accepted theories","within a framework of theories we already accept"]]},"2024-23":{"v":"Brain research has revealed that the same region handles both pleasure and pain. The body is always working to keep its functions in equilibrium, a state known as homeostasis, and it relies on built-in mechanisms that soften extreme ups and downs; without them, survival would be impossible. Think of pleasure and pain as the two pans of a balance: when one goes up, the other has to go down. Psychiatrist Anna Lembke suggests that the old saying 'No pain, no gain' contains real wisdom. In her view, the harder we try to avoid suffering, the more miserable we become, because pain plays a necessary role in keeping us at a neutral point. Accepting it is what brings our inner scale back into balance.","o":["How pleasure-seeking leads to addiction","The brain regions responsible for emotion","Why accepting pain is necessary to restore inner balance","Ways to eliminate pain through homeostasis","The difference between physical and emotional pain"],"a":2,"x":"고통을 받아들여야 균형을 되찾는다는 게 주제야. ④는 고통을 '없애는' 방법이라 원문 방향과 반대야.","m":[["strive for homeostasis","working to keep its functions in equilibrium"],["the two opposite points on a scale","the two pans of a balance"],["allowing it will in turn reset our internal scale back to balance","Accepting it is what brings our inner scale back into balance"]]},"2024-24":{"v":"Companies are skilled at making us question whether the gadgets we own are still good enough. A phone that seemed essential only a year ago suddenly looks outdated, too slow for what we now expect. Before any real need appears, we start longing for an upgrade. The same pattern shows up across consumer electronics, from smart refrigerators to self-driving cars, each promising that the next model will transform our lives. What is remarkable, and perhaps troubling, is how effectively this cycle shapes what we desire. We do not so much want the latest device as we are persuaded that we need it. As the line between wanting and needing fades, our spending shifts toward keeping up with trends, and the pull to upgrade stays strong despite every rational argument against it.","o":["How manufacturers blur the line between wants and needs","The environmental cost of electronic waste","Why consumers make rational purchasing decisions","The benefits of upgrading devices regularly","The rapid technological progress of smartphones"],"a":0,"x":"제조사가 원함과 필요의 경계를 흐린다는 게 주제야. ③는 원문(논리에도 불구하고 유혹이 강함)과 반대야.","m":[["sow seeds of doubt about the adequacy of our current devices","making us question whether the gadgets we own are still good enough"],["a museum piece","looks outdated"],["The distinction between want and need blurs","the line between wanting and needing fades"]]},"2024-29":{"v":"One way scientists discover what animals desire is a method called Conditioned Place Preference. An animal is trained to link one location with a particular experience, such as food or a loud sound, and a second location with nothing at all. The two places are designed to look very different so that the animal can easily connect each with what happened there. Researchers record where the animal prefers to stay before and after these experiences. If it now spends more time in the place linked to the experience, it probably enjoyed it and wants it again; if it starts avoiding that place, the experience was likely unpleasant. In one study, mice with cancer came to favor the place where they had received the painkiller morphine over the place where they got saline, while healthy mice showed no such preference, suggesting that the sick mice wanted the drug.","o":["The ethical problems of animal experiments","The effects of morphine on mice with cancer","How animals remember places through smell","A method of learning what animals want from where they choose to stay","Why animals avoid loud noises"],"a":3,"x":"동물이 머무는 장소로 원하는 것을 알아내는 방법이 주제야. ②은 예시(모르핀 실험)만 잡은 선지야.","m":[["associate one place with an experience","link one location with a particular experience"],["it found the stimulus unpleasant","the experience was likely unpleasant"],["a drug used to relieve pain","the painkiller"]]},"2024-30":{"v":"Close to the equator, numerous bird species reproduce throughout the year. In temperate and polar areas, by contrast, breeding is limited to clearly fixed seasons, which are set off mainly by changing day length. Ideally, chicks are raised when food is most plentiful. Outside these seasons, most birds not only lack the desire to breed but are physically unable to, since their reproductive organs shrink, reducing the weight they must carry in flight. Desert species that wander from place to place are the chief exception: they can begin breeding within days after rain, taking full advantage of a sudden chance. Species also differ in how they use the season. Most seabirds rear just one brood, whereas songbirds in warm climates may raise several in a few months, and in a very good year a pair of House Sparrows can produce brood after brood.","o":["The effect of rain on desert ecosystems","Differences in when and how birds breed across regions and species","The migration patterns of birds near the equator","How birds find food during the breeding season","Why seabirds raise only a single brood"],"a":1,"x":"지역과 종에 따라 번식 시기와 방식이 다르다는 게 주제야. ⑤, ①은 세부 예시만 잡은 선지야.","m":[["sharply defined","clearly fixed"],["They are triggered mainly by changes in day length","set off mainly by changing day length"],["not simply reluctant to breed ... but they are also physically incapable","not only lack the desire to breed but are physically unable to"]]},"2024-31":{"v":"Students' creativity can be blocked when they do not know what resources each learning activity requires. Many students cannot tell what they will need to complete a given task, yet certain resources are essential for particular tasks, and recognizing them makes the work easier. Suppose students want to carry out experiments for a project. Before they begin, someone must check whether they can use a laboratory, the necessary equipment, and the chemicals involved. Preparation, in other words, is key to success, and it may also involve people and money, such as lab technicians and funds for supplies. Even when some resources turn out to be unavailable, knowing about them ahead of time can support creativity, since it may lead students to change their topic or look for alternatives.","o":["The role of teachers in guiding experiments","How lack of money limits student achievement","The high cost of school laboratory equipment","Why students should work in groups on projects","Identifying required resources in advance to support creativity"],"a":4,"x":"필요한 자원을 미리 파악하면 창의성에 도움이 된다는 게 주제야. ②는 돈이라는 일부 자원만 잡았어.","m":[["One factor that may hinder creativity","creativity can be blocked"],["unawareness of the resources required","do not know what resources each learning activity requires"],["identifying them in advance","knowing about them ahead of time"]]},"2024-32":{"v":"No translator works in isolation. Every translator is influenced by the readers the translation is meant for, and every interpretation is reached through exchanges with other people. When Alexander Pope translated Homer's Iliad in the early eighteenth century, he knew Greek well, but he still relied on Greek commentaries, on existing English, Latin, and French versions, and on dictionaries. Translators always make use of several source texts. Even a single person with only a pen, paper, and the original book, or someone interpreting aloud for another person, draws on language knowledge that came from countless other texts and conversations, and his or her sense of what the translation is for is shaped by the expectations of its audience. In both respects, every translation is a collective effort.","o":["Why oral translation is less accurate than written translation","The difficulty of translating ancient Greek poetry","Why every translation is shaped by many people and texts","Alexander Pope's contribution to English literature","The importance of dictionaries in learning languages"],"a":2,"x":"모든 번역은 여러 사람과 텍스트의 영향을 받는 '군중 번역'이라는 게 주제야. ④은 예시 인물만 잡았어.","m":[["in dialogue with other people","through exchanges with other people"],["draw on more than one source text","make use of several source texts"],["a crowd translation","a collective effort"]]},"2024-33":{"v":"Some argue that reading is a single, clearly defined activity that can be neatly separated from anything else people do with books. But is reading really so simple? It is more useful to view reading as a loose group of behaviors connected by what Ludwig Wittgenstein called family resemblances, with no one feature that all of them share. For this reason, attempts to draw a firm line between reading and non-reading are bound to fail, because no one agrees on what counts as reading to begin with. The harder we look for the boundary, the more borderline cases we discover that push it outward. It is therefore worthwhile to gather these unusual forms of reading together, as they reveal how difficult it is to fix where reading starts and stops. Doing so leads us to see reading as a broad spectrum that includes many different activities.","o":["Reading as a broad spectrum rather than one fixed concept","Wittgenstein's influence on modern philosophy","The decline of book reading in the digital age","Why reading skills differ among individuals","Clear rules for distinguishing reading from non-reading"],"a":0,"x":"읽기는 고정된 개념이 아니라 넓은 스펙트럼이라는 게 주제야. ⑤는 원문(구분 시도는 실패한다)과 반대야.","m":[["are destined to fail","are bound to fail"],["edge cases","borderline cases"],["expansive enough to accommodate the distinct reading activities","a broad spectrum that includes many different activities"]]},"2024-34":{"v":"Weber's law describes how we notice the difference between two stimuli. A 1-millimeter gap is easy to see between lines of 2 and 3 millimeters but nearly impossible to see between lines of 466 and 467 millimeters. In the same way, one candle stands out in a dark room, but adding one candle to a room already lit by a hundred hardly makes a difference. In other words, the smallest change we can detect, the just-noticeable difference, grows with the intensity of the signal. With a faint sound, even a slightly louder one is noticeable; with a very loud sound, another must be far louder before we can tell. Thus, the stronger or larger two stimuli are, the harder it becomes to tell them apart.","o":["How the brain processes sound and light differently","The limits of human eyesight in dark rooms","Why loud noises damage our hearing","The stronger the stimulus, the harder it is to notice differences","Methods for measuring the length of lines accurately"],"a":3,"x":"자극이 강할수록 차이를 알아차리기 어렵다는 베버의 법칙이 주제야. ②는 촛불 예시만 잡았어.","m":[["varies as a function of the strength of the signals","grows with the intensity of the signal"],["barely louder","slightly louder"],["harder to distinguish between two samples","the harder it becomes to tell them apart"]]},"2024-35":{"v":"When a new public resource such as an airport or a shopping mall opens, people individually enjoy the benefits of sharing something funded in common, like a city budget. Before long, however, usage outgrows what the shared resource can handle. Congestion, crowding, and overuse reduce the benefits for everyone, which is what is meant by the tragedy of the commons. If the resource cannot be enlarged, the problem cannot be solved by any one user acting alone. Total use and individual use keep rising together, but if heavy use continues for too long, both eventually peak and then fall, ending in collapse. The truly tragic part is this collapse: the shared resource loses its ability to renew itself.","o":["How individuals can solve traffic problems on their own","Overuse that destroys a shared resource's ability to renew itself","The rising cost of maintaining shopping malls","Why cities should build more airports","The benefits of sharing public resources"],"a":1,"x":"과다 사용이 공유 자원의 재생 능력을 파괴한다는 게 주제야. ①은 원문(혼자서는 해결할 수 없다)과 반대야.","m":[["grows too large for the commons to support","usage outgrows what the shared resource can handle"],["leading to a crash","ending in collapse"],["ability to regenerate itself","ability to renew itself"]]},"2024-36":{"v":"In theory, the human brain could record every experience of a lifetime in DVD-level detail. In practice, storing and recalling information costs so much energy that this capacity is canceled out. The brain therefore relies on efficient shortcuts. Consider faces: the image reaching our eyes changes with the angle, the lighting, and the setting, yet we still recognize the same person. Instead of keeping every visual detail, the brain builds and saves general patterns that allow reliable recognition in many different situations. Matching what we see against these stored patterns helps the brain perform well while conserving energy. Because it naturally avoids unnecessary effort, the brain keeps simplifying and generalizing information to make thinking easier.","o":["How lighting affects visual perception","The unlimited storage capacity of human memory","Techniques for improving face recognition skills","Why we forget faces over time","The brain's habit of storing general patterns to save energy"],"a":4,"x":"에너지를 아끼려고 일반 패턴을 저장하는 뇌의 전략이 주제야. ②는 이론상 용량이 실제로는 상쇄된다는 원문과 어긋나.","m":[["this theoretical capacity is offset by the energy demand","costs so much energy that this capacity is canceled out"],["becoming dependent on shortcuts","relies on efficient shortcuts"],["rather than focusing on the details of visualization","Instead of keeping every visual detail"]]},"2024-37":{"v":"We usually expect scientific explanations to stick closely to experimental results and to reveal the regular, predictable aspects of the world. This expectation, however, can hide the fact that theories are full of creative choices that shape how research is designed and how evidence is interpreted. Scientific accounts are more than a timeline of facts; they build frameworks around carefully selected data to make observations coherent and meaningful. These frameworks encourage us to imagine their subjects in certain kinds of relationships, and the stories they produce work better for analyzing some aspects of experience than others. If we ignore this imaginative contribution and treat models as plain facts, or worse, as the whole of reality, we may fail to see a model's limits and misapply it to situations it does not fit.","o":["How imagination slows down scientific progress","Why scientific models describe all of reality","The need to recognize creativity and limits in scientific explanations","Why experiments must be repeated to be reliable","The history of scientific discoveries"],"a":2,"x":"과학적 설명 속 창의성과 한계를 인식해야 한다는 게 주제야. ②는 원문이 경고한 잘못된 생각 그 자체야.","m":[["conceals the fact","can hide the fact"],["relate a chronology of facts","a timeline of facts"],["blind ourselves to the limitations of a given model","fail to see a model's limits"]]},"2024-38":{"v":"People disagree about whether literature leads to action. Some theorists claim that because literature invites quiet, solitary reading and reflection, it draws people away from the social and political activities that could change society; at most it fosters detachment, and at worst passivity and acceptance of things as they are. Others, however, have long regarded literature as dangerous, since it encourages people to question authority and social order. Plato expelled poets from his ideal state, and novels have been blamed for making readers unhappy with their lives and hungry for change. By helping readers identify with people of other classes, genders, and races, books may build a sense of fellowship that weakens struggle, yet they may also awaken a sharp sense of injustice that fuels progress. Uncle Tom's Cabin, for instance, stirred disgust toward slavery that helped lead to the American Civil War.","o":["Two opposing views on literature's role in social action","Plato's reasons for banning poets","The popularity of novels in the nineteenth century","Why reading alone is better than reading in groups","How Uncle Tom's Cabin ended slavery"],"a":0,"x":"문학과 행동에 대한 상반된 두 견해가 주제야. ②, ⑤는 예시만 잡았고, ⑤는 '노예제를 끝냈다'로 과장했어.","m":[["counters the social and political activities","draws people away from the social and political activities"],["promotes the questioning of authority","encourages people to question authority"],["a revulsion against slavery","disgust toward slavery"]]},"2024-39":{"v":"Hobbes held that in the state of nature, humans cannot act morally against their instinct for self-preservation. Morality and moral freedom, he argued, only begin to apply once a sovereign power such as the state appears. Without a common power to keep everyone in check, people live in a condition of war, and life is, in his famous words, 'solitary, poor, nasty, brutish and short.' Since Hobbes did not see human beings as naturally social or political, he believed that without such power they would act antisocially, guided by self-interest. Society, for him, is not a natural phenomenon, and no natural force unites people. What brings them together is not affection for one another but a shared fear of what the present and the future may bring.","o":["The history of the modern nation-state","Hobbes's criticism of war and violence","How morality develops in the state of nature","Hobbes's view that shared fear, not affection, forms society","Why humans are naturally kind to one another"],"a":3,"x":"사회를 만드는 건 애정이 아니라 상호 두려움이라는 홉스의 견해가 주제야. ③는 원문(자연 상태에선 도덕이 적용되지 않는다)과 반대야.","m":[["in spite of his instinct to protect his existence","against their instinct for self-preservation"],["a general power to control them all","a common power to keep everyone in check"],["It is, rather, mutual fear ... that assembles them","What brings them together is not affection ... but a shared fear"]]},"2024-40":{"v":"Our knowledge can change what we actually see. In an experiment by Delk and Fillenbaum, participants were shown cut-out shapes and asked to adjust a background until its color matched the shapes. Some shapes were things typically red, like an apple, lips, or a heart, while others, like a mushroom or a bell, had no link to red. In reality, every shape was cut from the same reddish-orange cardboard. The background could range from dark to light red. To be judged a match, the red-linked shapes needed a redder background than the other shapes did. This suggests that knowing what color an object usually has affects how we perceive its color.","o":["How color affects our emotions","The influence of knowledge about objects on color perception","Why red is the most noticeable color","The difficulty of matching colors accurately","Differences in color vision among individuals"],"a":1,"x":"물체에 대한 지식이 색 지각에 영향을 준다는 게 주제야. ④는 실험 과제만 잡은 선지야.","m":[["cognitive factors influence the phenomenology of the perceived world","Our knowledge can change what we actually see"],["made out of the same red-orange cardboard","cut from the same reddish-orange cardboard"],["required more red in the background","needed a redder background"]]},"2022-21":{"v":"Studies on motivation and top performance suggest that tasks are best matched to our energy levels. Analytical work, for instance, goes most smoothly when we are full of energy, free from interruptions, and able to concentrate. I tend to wake up full of energy, so for years I have made a habit of handling my problems first thing in the morning. I often overthink situations and conversations that have not yet happened, and when I put off calling an unhappy client or answering an unpleasant email, I spend far too much emotional energy all day. The task seems to hang over me, and worrying and talking about it takes longer than simply dealing with it. That is why I always do it first. If mornings are not your best time, plan your hardest work for later in the day.","o":["Why overthinking improves decision-making","Why morning people are more successful","The benefits of eating breakfast every day","How to communicate with unhappy clients","Tackle difficult tasks first when your energy is highest"],"a":4,"x":"에너지가 가장 높을 때 어려운 일을 먼저 처리하라는 게 주제야. ③는 'breakfast'라는 비유를 글자 그대로 받아들인 함정이야.","m":[["procrastinate on talking with an unhappy client","put off calling an unhappy client"],["eating my problems for breakfast","handling my problems first thing in the morning"],["it'll always be the first thing I get done","I always do it first"]]},"2022-22":{"v":"In one experiment, students were more eager to begin pursuing a goal on a date described as a fresh start, such as 'the first day of spring,' than on the same date described as an ordinary day, like 'the third Thursday in March.' Whether the goal was exercising at a gym or cutting down on social media, linking a date to a new beginning made more students want to start changing right away. Another research team later found a similar effect using altered weekly calendars. When the calendar showed the current day, whether Monday or Sunday, as the first day of the week, people said they felt more motivated to make progress on their goals immediately.","o":["Why people often fail to keep their resolutions","Why spring is the best season to start exercising","How 'new beginning' dates boost motivation to pursue goals","The negative effects of social media on students","Differences between Monday and Sunday as start days"],"a":2,"x":"'새로운 시작'으로 여겨지는 날짜가 목표 동기를 높인다는 게 주제야. ②은 예시(봄의 첫날)만 잡았어.","m":[["kick-start goal pursuit","begin pursuing a goal"],["an unremarkable day","an ordinary day"],["modified weekly calendars","altered weekly calendars"]]},"2022-23":{"v":"Before going into battle, Native Americans frequently sang and danced. The emotional and chemical arousal this produced gave them the energy to carry out their attacks. What may have started as a spontaneous, frenzied rush of song and drumming could have turned into a deliberate tactic once the victors witnessed its effect on their enemies. War dances do risk alerting the enemy to an attack, but the excitement and coordination they create among attackers may more than make up for losing the element of surprise. Groups that sang, danced, and marched together may have gained a strong battlefield advantage while frightening those who saw the display. In the nineteenth and twentieth centuries, for example, Germans feared the Scots above all, unsettled by the sheer noise and spectacle of their bagpipes and drums.","o":["The strategic benefits of singing and dancing before battle","How bagpipes became a symbol of Scotland","The psychological damage of war on soldiers","The history of Native American music","Why surprise is essential in warfare"],"a":0,"x":"전투 전 노래와 춤의 전략적 이점이 주제야. ⑤는 원문(기습 상실을 이점이 상쇄한다)과 반대야.","m":[["stamina","energy"],["compensate for the loss of surprise","make up for losing the element of surprise"],["intimidated enemies who witnessed such a spectacle","frightening those who saw the display"]]},"2022-24":{"v":"Cycling as a lifestyle has become a trend, with more active riders and growing club memberships in cities across Europe, America, Australia, and Asia. Along with this, the meaning of the bicycle has changed. For many years it was linked with being poor, but now costly leisure bikes and commuter bikes inspired by them have become objects people aspire to own in cities. Today people cycle partly to display something, to build their identity, to impress others, and to show their social standing. To some degree, cycling has become a sign of wealth. Of course, consumption loaded with values is not unique to cycling, but its connection with identity and showing off is especially clear in this case.","o":["Why cycling clubs are losing members","How poverty affects transportation choices","The environmental advantages of bicycles over cars","Cycling as a new symbol of status and identity in cities","The health benefits of commuting by bicycle"],"a":3,"x":"자전거가 도시에서 지위와 정체성의 상징이 됐다는 게 주제야. ①은 원문(회원이 늘고 있다)과 반대야.","m":[["associated with poverty","linked with being poor"],["aspirational products","objects people aspire to own"],["a symbolic marker of the well-off","a sign of wealth"]]},"2022-29":{"v":"Pre-emption refers to strategies aimed at stopping a rival before it starts a certain activity. Sometimes it is simply a matter of announcing an intention so that rivals are discouraged from doing the same thing. The concept shows that timing can matter a great deal: acting at one moment may pay off far more than acting later. A firm might, for example, increase its advertising just before and while a newcomer enters the market, making it harder for the newcomer's ads to reach potential customers. Another pre-emptive tactic is product proliferation, which means releasing many versions of a product so that almost no market demand is left unmet. If a market is already crowded with product variations, competitors will struggle to find unserved demand.","o":["The importance of honest announcements in business","Ways firms use pre-emption to keep rivals out","Why new companies succeed in crowded markets","The rising cost of advertising","How customers choose among many products"],"a":1,"x":"경쟁자를 막는 선제 조치 전략들이 주제야. ③는 원문(꽉 찬 시장에선 경쟁자가 어려움을 겪는다)과 반대야.","m":[["discourage rivals from doing the same","rivals are discouraged from doing the same thing"],["up-weighting advertising","increase its advertising"],["untapped pockets of market demand","unserved demand"]]},"2022-30":{"v":"Countershading is a form of camouflage that makes animals look visually flat. Light coming from above makes the top of an object brightest, with its color growing gradually darker toward the bottom. This shading creates depth, which lets an observer recognize the object's shape. So an animal that is one even color, even if it exactly matches its surroundings, is easy to spot when lit. Most animals, however, have darker backs than bellies. Under light from above, the dark back is brightened and the pale belly is darkened, so the animal looks like one uniform color and merges with its background. This coloring pattern removes the visual sense of shape, allowing the animal to blend in.","o":["Why most animals are brightly colored","The role of sunlight in animal growth","How animals change color with the seasons","Why predators see better in the dark","How countershading helps animals hide by flattening their appearance"],"a":4,"x":"카운터셰이딩이 동물을 평평하게 보이게 해 숨겨 준다는 게 주제야. 나머지는 원문에 없는 내용이야.","m":[["optical flattening","look visually flat"],["the darker back is lightened","the dark back is brightened"],["destroys the visual impression of shape","removes the visual sense of shape"]]},"2022-31":{"v":"Learning cannot happen without an error signal; creatures learn only when something defies their expectations. Surprise, in other words, lies at the heart of learning. If you hear the same note again and again, AAAAA, your auditory brain responds each time, but the response weakens with every repetition. This process, called adaptation, shows that the brain is learning to predict what comes next. When the note suddenly changes, AAAA#, the primary auditory cortex reacts strongly: adaptation disappears and extra neurons fire actively. Repetition alone does not cause adaptation, though; what matters is predictability. If you hear alternating notes such as ABABA, your brain adjusts and activity again declines, and this time it is an unexpected repeat, ABABB, that sets off surprise.","o":["Why the brain prefers familiar sounds","Why music improves memory","Surprise from broken predictions as the driver of learning","How repetition always leads to boredom","The structure of the auditory cortex"],"a":2,"x":"예측이 깨질 때 생기는 놀람이 학습의 동력이라는 게 주제야. ④은 '반복'만이 원인이 아니라는 원문과 어긋나.","m":[["violate their expectations","defies their expectations"],["progressively decrease","weakens with every repetition"],["triggers a surprise response","sets off surprise"]]},"2022-32":{"v":"Because the world's economies are so closely linked, financial trouble can spread like an illness, passing from borrowers to banks to insurers. Yet this kind of infection has a strange feature: it can spread without any contact. A bank can collapse even if none of its investments has gone bad, because fear and uncertainty can harm markets as much as a chain of bad investments. If everyone woke up believing Bank X would go under, it actually would. In fact, it would be enough for us to worry that others expect it to fail, or simply to fear our shared fear. Even knowing the bank is sound, we would rush to withdraw our money so as not to be the last ones out. In this way, financial crises can fulfill themselves.","o":["Fear as a self-fulfilling force that can bring down banks","Ways to prevent the spread of the flu","The benefits of a connected global economy","How banks invest their customers' money","Why global markets are becoming independent"],"a":0,"x":"두려움이 자기 충족적으로 은행을 무너뜨릴 수 있다는 게 주제야. ②는 '독감' 비유를 글자 그대로 받아들인 함정이야.","m":[["insolvent","go under"],["pull their money out","withdraw our money"],["Financial distress can be self-fulfilling","financial crises can fulfill themselves"]]},"2022-33":{"v":"Negative numbers are far more abstract than positive ones; you cannot see or eat minus four cookies. Still, we must deal with them constantly, from debts to freezing weather to parking garages. Even so, many of us remain uncomfortable with them and have invented clever ways to avoid the dreaded minus sign. Investment reports show losses in red or inside parentheses instead of with a negative sign. History books say Julius Caesar was born in 100 B.C., not in the year -100. Underground parking levels are labeled B1 and B2. Temperature is one of the rare exceptions, though even then many people would rather say '5 below zero' than 'minus 5.' Something about that sign simply feels unpleasant.","o":["Why children struggle to learn abstract numbers","The history of negative numbers in mathematics","Why temperatures are measured below zero","How people find ways to avoid the negative sign","The usefulness of negative numbers in finance"],"a":3,"x":"사람들이 음수 기호를 피하는 방법들이 주제야. ③는 예외로 나온 기온 예시만 잡았어.","m":[["haven't quite made peace with negative numbers","remain uncomfortable with them"],["sidestep the dreaded negative sign","avoid the dreaded minus sign"],["have designations like B1 and B2","are labeled B1 and B2"]]},"2022-34":{"v":"Studies that observe people cannot be properly controlled. Because people live in many different ways and settings, they are too varied to serve as ideal experimental subjects. Such hidden, confounding factors weaken our ability to reach reliable conclusions about cause and effect from population studies. These are variables, known or unknown, that make it hard to separate the effect of the one variable being examined. For instance, since many drinkers also smoke, it is difficult to determine whether alcohol causes cancer. Likewise, the famous Framingham study found a strong link between coffee and heart disease, but most of it vanished once researchers took into account that many coffee drinkers smoked. Known confounders can often be corrected for, but unknown ones make our causal conclusions untrustworthy.","o":["The health risks of drinking coffee","How confounding factors make causal conclusions from human studies unreliable","Why smoking causes cancer","The success of the Framingham study","Why animals are better research subjects than humans"],"a":1,"x":"교란 변수 때문에 인간 관찰 연구의 인과 결론을 믿기 어렵다는 게 주제야. ①은 원문(보정하자 상관이 사라졌다)과 어긋나.","m":[["insufficiently homogeneous","too varied"],["isolate the effects of the specific variable","separate the effect of the one variable"],["undermine the reliability of the causal conclusions","make our causal conclusions untrustworthy"]]},"2022-35":{"v":"Among all human emotions, envy may be the hardest to pin down. It is extremely difficult to recognize when envy is behind someone's actions, and the reason is simple: people hardly ever express their envy openly. Feeling envious means admitting to ourselves that someone else is better than us at something we care about. Admitting such inferiority is painful, and having others notice it is even worse. So almost as soon as envy appears, we hide it even from ourselves, telling ourselves that what we feel is not envy but a sense of unfairness about how rewards or attention are shared, resentment at that unfairness, or even anger.","o":["The difference between envy and jealousy","Ways to overcome feelings of inferiority","Why anger is the most dangerous emotion","Why envy motivates people to work harder","How people disguise envy as other feelings"],"a":4,"x":"사람들이 질투를 다른 감정으로 위장한다는 게 주제야. ③는 위장된 감정 중 하나(분노)만 잡았어.","m":[["elusive","hard to pin down"],["we almost never directly express the envy","people hardly ever express their envy openly"],["disguise it to ourselves","hide it even from ourselves"]]},"2022-36":{"v":"The right to be forgotten differs from, yet is connected to, the right to privacy. Privacy mainly means that information traditionally seen as personal or protected should not be disclosed. The right to be forgotten, by contrast, can cover information that has already been made public. Broadly, it is a person's right not to be permanently defined by information from one moment in time, so that people can move forward without being tied to a single event or period of their lives. Some countries, such as the UK and France, have long accepted that even past criminal records should eventually expire and stop affecting a person's life. Despite these reasons, however, this right can clash with other rights, and official exceptions are sometimes made for security or public health.","o":["Why public health matters more than individual rights","Why criminal records should be public","The right to be forgotten: its meaning, purpose, and limits","How social media threatens privacy","The history of privacy laws in Europe"],"a":2,"x":"잊힐 권리의 개념, 목적, 한계가 주제야. ②은 원문(전과도 결국 소멸되어야 한다)과 반대야.","m":[["not to be revealed","should not be disclosed"],["has been in the public domain","has already been made public"],["come into conflict with other rights","clash with other rights"]]},"2022-37":{"v":"Once an economist understands a person's preferences, explaining changes in behavior by changes in likes and dislikes becomes highly questionable. Claiming, for example, that the baby boom and the following baby bust happened because people's natural desire for children first rose and then fell, rather than because relative prices changed while preferences stayed stable, puts a social scientist on weak ground. It would be like saying mortality rises and falls because people's desire for death changes. To an economist, birth rates respond to income and prices, not to tastes. When incomes increase, people want more children, or more satisfaction from them, even though their underlying desire for children remains unchanged.","o":["Economists' view that income and prices, not tastes, explain behavior","The relationship between mortality and income","Why the baby boom happened","Why birth rates are declining worldwide","How tastes for children change over time"],"a":0,"x":"행동 변화는 취향이 아니라 소득과 가격으로 설명해야 한다는 경제학자의 관점이 주제야. ⑤는 원문이 거부한 설명이야.","m":[["highly problematic","highly questionable"],["places a social scientist in an unsound position","puts a social scientist on weak ground"],["rather than changes in tastes","not to tastes"]]},"2022-38":{"v":"In nature, an animal that eats a plant with enough antinutrients to make it sick will not eat that plant again. Animals also seem to know by instinct to avoid such plants, an inborn wisdom formed by years of evolution and passed-down information. This instinct is not limited to animals. Have you ever wondered why so many children dislike vegetables? According to Dr. Steven Gundry, it is part of our genetic programming. Because many vegetables contain antinutrients, the body tries to keep children away from them while they are still delicate and growing, and it does so by making their taste buds sense these flavors as bad or even disgusting. As children grow and their bodies become strong enough to handle antinutrients, the vegetables no longer taste so bad.","o":["How to make children eat more vegetables","Why vegetables are essential for growth","The way animals learn which foods are safe","Children's dislike of vegetables as a protective instinct","How taste buds change with age"],"a":3,"x":"아이들이 채소를 싫어하는 것은 몸을 지키는 본능이라는 게 주제야. ③은 도입부 동물 예시만 잡았어.","m":[["innate intelligence","inborn wisdom"],["fragile and in development","delicate and growing"],["tolerate these antinutrients","handle antinutrients"]]},"2022-39":{"v":"Because the Moon pulls with different strength on different parts of Earth, it creates a stretching force that slightly elongates our planet along the line toward the Moon and squeezes it along the line at right angles to that. This tidal stretching affects the whole planet, land and sea, inside and out. However, rock is rigid, so land rises and falls far less than water does, which is why we notice only ocean tides. The stretching also explains why there are usually two high tides and two low tides each day. Since Earth is stretched somewhat like a rubber band, the oceans bulge both on the side facing the Moon and on the opposite side. As Earth spins, we pass through both bulges daily, experiencing high tide in each bulge and low tide halfway between.","o":["Why the Moon looks larger near the horizon","How the Moon's stretching force causes two high tides a day","The effects of tides on marine life","Why land does not move during earthquakes","The distance between Earth and the Moon"],"a":1,"x":"달의 늘이는 힘이 하루 두 번의 만조를 만든다는 게 주제야. 나머지는 원문에 없는 내용이야.","m":[["compressed along a line perpendicular to that","squeezes it along the line at right angles to that"],["the rigidity of rock","rock is rigid"],["As Earth rotates","As Earth spins"]]},"2022-40":{"v":"A study examined how much prejudice based on blind assumptions can cost. Danish teenagers were asked to choose one of two strangers to work with. One partner's name suggested a similar ethnic or religious background to the teenager's; the other's suggested a different background. The teenagers were willing to accept about 8 percent less pay on average to work with someone they believed shared their background, and this bias appeared among teenagers with majority names and minority names alike. Without any real information, they guessed their partners' backgrounds, acted on prejudice, and even let it reduce their own earnings, all for a task lasting only 90 minutes.","o":["How names reveal a person's personality","The benefits of diverse workplaces","Why short tasks pay less money","Why teenagers prefer working alone","The economic cost of prejudice based on blind assumptions"],"a":4,"x":"맹목적 가정에서 나온 편견의 경제적 비용이 주제야. ①은 이름이 '성격'을 드러낸다고 바꿨는데 원문은 배경을 추측한 거야.","m":[["prepared to earn an average of 8% less","willing to accept about 8 percent less pay"],["evident among teenagers with ethnic majority names as well as those with ethnic minority names","appeared among teenagers with majority names and minority names alike"],["reduce their own potential income","reduce their own earnings"]]},"2023-21":{"v":"Art and aesthetics connect us emotionally to the whole range of human experience. As Professor Anjan Chatterjee puts it, art can offer much more than sweetness. When a work challenges us and makes us uncomfortable, that discomfort, if we are willing to face it, opens the door to change and transformation, which can itself be a powerful aesthetic experience. Art thus becomes a means of dealing with ideas that would otherwise be too difficult or uncomfortable. In Guernica (1937), Picasso portrayed the cruelty of war and let the world reflect on the suffering of the Spanish Civil War. In A Raisin in the Sun, Lorraine Hansberry told a moving story of a family facing racism and chasing the American dream.","o":["How plays reflect family life","Why art should always be pleasant","The discomfort in art as a source of transformation","Picasso's influence on modern painting","The history of the Spanish Civil War"],"a":2,"x":"예술이 주는 불편함이 변화의 계기가 된다는 게 주제야. ②은 원문(단순한 즐거움 이상)과 반대야.","m":[["more than just sugar on the tongue","much more than sweetness"],["offers the possibility of some change","opens the door to change"],["vehicles to contend with ideas","a means of dealing with ideas"]]},"2023-22":{"v":"Historians have often linked accurate timekeeping to the economic rise of the West. Jacques Le Goff even called the arrival of the public mechanical clock a turning point. Until the late Middle Ages, people used sundials and water clocks, which had little to do with business. Markets opened at sunrise and usually closed at noon. Once public mechanical clocks spread through European cities, however, market hours were fixed by the striking of the hour. These clocks introduced a concept of time that everyone could easily follow, which made trade and commerce run more smoothly. Dealings among consumers, retailers, and wholesalers became more regular, and town meetings followed the clock, so people could plan their time and use resources more efficiently.","o":["How public clocks helped Western economic progress","Why medieval markets closed at noon","The role of historians in studying time","Differences between Eastern and Western calendars","The invention of sundials and water clocks"],"a":0,"x":"공공 기계 시계가 서양 경제 발전을 도왔다는 게 주제야. ⑤, ②은 시계 도입 이전의 배경만 잡았어.","m":[["accurate time measurement","accurate timekeeping"],["did not play any meaningful role in business activities","had little to do with business"],["helped facilitate trade and commerce","made trade and commerce run more smoothly"]]},"2023-23":{"v":"In 1937, Sylvan Goldman introduced his newly invented shopping cart, which let customers buy as much as they liked without tiring or needing help. But despite advertising it again and again, he could not get shoppers to use it. Men avoided it for fear of looking weak, and women would not touch it because it reminded them of a baby carriage. Only a few elderly customers used the carts, which made them even less appealing to everyone else. Then Goldman came up with a plan: he hired models of various ages to push the carts and shop, while a young employee at the entrance told customers, 'Look, everyone is using them.' A handful of disguised helpers achieved what reason and advertising could not, and within weeks shoppers happily accepted the carts.","o":["Why elderly people prefer shopping carts","The history of supermarkets in America","Why advertising is the best way to sell products","How seeing others use a product persuades people to use it","Gender differences in shopping habits"],"a":3,"x":"다른 사람이 쓰는 모습(사회적 증거)이 사람들을 설득한다는 게 주제야. ③는 원문(광고는 실패했다)과 반대야.","m":[["could not persuade his shoppers to use the wheeled carts","could not get shoppers to use it"],["hit upon an idea","came up with a plan"],["A few shills disguised as regular shoppers","A handful of disguised helpers"]]},"2023-24":{"v":"Critics may argue that humanlike care robots pose moral risks for people with dementia. Even if deception is sometimes acceptable for good purposes, should it be used on vulnerable users? Older adults with cognitive impairments, like autistic children with robot companions, may easily be tricked into seeing robots as friends. Professor Alexis Elder calls robots false friends that fall short of true friendship, and Professor John Sullins argues that robots should stay iconic or cartoonlike so that even unsophisticated users can easily tell they are artificial. That way, no one is deceived, and the uncanny valley, the eerie feeling caused by robots that look almost but not quite human, is avoided. Other critics add that making people believe robots truly care crosses a line and violates human dignity.","o":["How robots can replace human caregivers","Why care robots for vulnerable people should clearly look like robots","The technology behind humanlike robots","The benefits of robot companions for children","Why the uncanny valley makes robots popular"],"a":1,"x":"취약한 사용자를 위한 돌봄 로봇은 분명히 로봇처럼 보여야 한다는 게 주제야. ⑤는 불쾌한 골짜기를 장점처럼 바꿨어.","m":[["moral hazards","moral risks"],["easily fooled into thinking of robots as friends","easily be tricked into seeing robots as friends"],["remain iconic or cartoonish","stay iconic or cartoonlike"]]},"2023-29":{"v":"Plants defend themselves with lectins, large proteins that act as an important weapon. When we eat plants, their lectins attach to carbohydrates and also to sugar molecules in our gut, brain, nerve endings, joints, and body fluids. Dr. Steven Gundry says these sticky proteins can disrupt communication between cells and trigger toxic and inflammatory reactions. Brain fog and an upset stomach are among the results. He reports that many of his patients saw problems such as joint pain, dementia, headaches, and infertility disappear after removing lectins from their diets. Dr. Paul Saladino adds that there is growing support for the idea that lectins play a role in Parkinson's disease, as animal studies suggest that eaten lectins may damage the gut and travel to the brain, where they seem toxic to certain neurons.","o":["Treatments for Parkinson's disease","Why proteins are essential in our diet","How plants grow in poor soil","The health benefits of eating vegetables","Lectins as plant defenses that can harm human health"],"a":4,"x":"식물의 방어 물질 렉틴이 인체 건강을 해칠 수 있다는 게 주제야. ④는 원문 방향과 반대야.","m":[["bind to carbohydrates","attach to carbohydrates"],["interrupt messaging between cells","disrupt communication between cells"],["eliminated lectins from their diets","removing lectins from their diets"]]},"2023-30":{"v":"Technology reshapes how people and societies think about privacy. Having a new way to access information or observe others does not make doing so right; instead, technological advances push citizens and lawmakers to think about how privacy protections should grow. When cameras first became widely available, for example, people debated whether laws were needed to stop others from photographing them without permission. That debate reinforced the line between private and public spaces. Most cultures decided that by willingly entering a public space, people automatically agree to be seen and recorded. Some may feel uneasy about the growing number of surveillance cameras, but most societies have accepted that giving up the right not to be watched in public does less damage to the community than having no surveillance at all.","o":["How cameras changed photography as an art","Why surveillance cameras should be banned","Technology and the acceptance of surveillance in public spaces","The history of privacy laws in Europe","Why people feel uncomfortable in public"],"a":2,"x":"기술 발전 속에서 공공장소의 감시를 받아들이게 된 과정이 주제야. ②는 원문 결론과 반대야.","m":[["does not justify doing so","does not make doing so right"],["re-affirmed a distinction between private and public spaces","reinforced the line between private and public spaces"],["causes less harm to the community","does less damage to the community"]]},"2023-31":{"v":"A coincidence that seems statistically impossible strikes us as irrational, and some people call it a miracle. Yet as Montaigne observed, miracles arise from our lack of knowledge about nature, not from nature itself. Many amazing miracles were later explained as natural laws at work or as technologies few people knew about at the time. Goethe likewise said that mysterious things are not yet miracles. To call something a miracle is to assume that a higher power beyond human understanding has stepped in. But miracles can be produced through simple, methodical means, without any divine inspiration. Rather than examining an event and tracing its source, we label it a miracle. A miracle, then, is simply an excuse for those who do not want to think.","o":["Miracles as a label for our ignorance and unwillingness to think","The role of religion in explaining nature","Why coincidences happen so often","Montaigne and Goethe's views on poetry","How technology creates real miracles"],"a":0,"x":"기적은 우리의 무지와 생각하기 싫어함에 붙인 이름표라는 게 주제야. ⑤는 '진짜 기적'이 있다는 쪽이라 원문과 반대야.","m":[["the origin of a miracle is in our ignorance","miracles arise from our lack of knowledge"],["the intervention of a higher power","a higher power ... has stepped in"],["those who are too lazy to think","those who do not want to think"]]},"2023-32":{"v":"What we learn after an event can affect how we later remember it. Outside information easily blends into a witness's memory, particularly when the event was not stored well in the first place or happened long ago, so that time and forgetting have weakened the original memory. When little remains in memory to check whether later misinformation is true, the new information is less likely to be rejected. Especially if it matches the witness's current beliefs and helps build a story that makes sense, it may become part of the original experience. The witness might be aware of this, but more often it happens unconsciously, and over time the witness may not even remember where the information came from. Misleading information can come from anywhere, including other witnesses, online searches, repeated interviews, and even the courtroom.","o":["Why old memories are more accurate","How witnesses can improve their memory","Why courts should not rely on social media","How information received after an event can distort memory","The difference between conscious and unconscious thought"],"a":3,"x":"사건 이후의 정보가 기억을 왜곡한다는 게 주제야. ①는 원문(오래된 기억일수록 더 쉽게 오염된다)과 반대야.","m":[["influence subsequent remembering","affect how we later remember it"],["integrate into a witness's memory","blends into a witness's memory"],["the event was poorly encoded","the event was not stored well"]]},"2023-33":{"v":"Correlations are useful because what they reveal is fairly clear, but that clarity is often lost once we start asking about causes. A used-car dealer once gave data to statisticians to predict which cars at auction were likely to have problems, and the analysis showed that orange cars had far fewer defects. Reading this, we immediately wonder why. Do owners of orange cars love cars and care for them better? Or are orange cars more visible, and so in fewer accidents? Soon we are tangled in rival explanations, and trying to clarify things this way only makes them murkier. Correlations can be proven mathematically, but causal connections cannot be shown so easily. It would therefore be wise to stop trying to explain why correlations exist.","o":["How statistics help car dealers make profits","Accepting correlations without obsessing over their causes","The importance of proving causal links","Why car owners should take better care of their vehicles","Why orange cars are safer than other cars"],"a":1,"x":"상관관계를 받아들이고 원인에 집착하지 말라는 게 주제야. ③는 원문 주장과 반대야.","m":[["covered up when we bring causality back into the picture","lost once we start asking about causes"],["only make them cloudier","only makes them murkier"],["hold off from trying to explain","stop trying to explain"]]},"2023-34":{"v":"In the wild, most mice are killed or die before reaching their two-year life span, not from aging but from outside causes such as disease, hunger, or predators. That is why nature has given mice an average life of no more than two years. This leads to an important principle: how long a species lives, or how fast it ages, depends on how long members of that species can usually survive in the wild. This explains why a bat can live up to 30 years. Unlike mice, bats can fly, so they escape danger far more quickly, travel greater distances, and find food more easily. Because bats are much better than mice at fleeing danger, finding food, and surviving, any past genetic change that let them live longer was useful.","o":["The dangers that predators pose to mice","Why flying animals need more food","Genetic diseases that shorten life span","Why bats are more intelligent than mice","How a species' survival in the wild determines its life span"],"a":4,"x":"야생에서 생존할 수 있는 시간이 수명을 결정한다는 게 주제야. ①은 쥐 예시의 일부만 잡았어.","m":[["external causes","outside causes"],["is determined by the average time that this animal species can survive in the wild","depends on how long members of that species can usually survive in the wild"],["flee from danger","fleeing danger"]]},"2023-35":{"v":"Aristotle believed that moral excellence comes from habit and repetition, though modern science suggests it may also have an inborn, genetic element. If so, moral character would be largely fixed early in life, which makes the question of when to start teaching it very important. Freud claimed that our personality hardly changes after about age five, but here, as in many other matters, he was mistaken. Recent psychological studies show that personality traits settle around age thirty for both men and women, whatever their ethnicity, as the brain keeps developing structurally and cognitively until the mid-twenties. This new understanding allows us to be somewhat more hopeful than Aristotle and Freud about our ability to teach moral excellence.","o":["Freud's contributions to modern psychology","The genetic basis of moral behavior","Hope for teaching moral excellence later in life","How habits are formed in early childhood","Why personality is fixed by age five"],"a":2,"x":"도덕적 탁월함을 늦게까지 가르칠 수 있다는 희망이 주제야. ⑤은 원문이 틀렸다고 한 프로이트의 주장이야.","m":[["an innate, genetic component","an inborn, genetic element"],["Freud was wrong","he was mistaken"],["a bit more optimistic","somewhat more hopeful"]]},"2023-36":{"v":"A species' size is no accident; it reflects a finely balanced relationship between the species and its environment, and over long periods, changes in size have often signaled major environmental changes. Broadly speaking, during the past five hundred million years, animals have tended to grow larger, especially marine animals, whose average size has risen 150 times. Now, however, this trend is reversing. Researchers have found that many animals are getting smaller across all categories worldwide, and rising heat appears to be a leading cause. In the Italian Alps, for example, temperatures have climbed three to four degrees Celsius since the 1980s. To avoid overheating, chamois goats rest more and search for food less, and within a few decades their new generations have become 25 percent smaller.","o":["Rising temperatures causing animals to shrink","The history of animal evolution over 500 million years","Why resting more makes animals healthier","Why marine animals are the largest on Earth","How chamois goats adapt to cold mountains"],"a":0,"x":"기온 상승으로 동물들이 작아지고 있다는 게 주제야. ②는 과거 추세(배경)만 잡았어.","m":[["a fine-tuned interaction","a finely balanced relationship"],["many animals are shrinking","many animals are getting smaller"],["one major cause appears to be the heat","rising heat appears to be a leading cause"]]},"2023-37":{"v":"Random sampling was long a convenient shortcut that made large-scale data analysis possible before the digital age. But just as compressing a digital image or song into a smaller file loses data, sampling also loses information. Having all or nearly all the data gives far more freedom to explore it, to view it from different perspectives, or to examine particular aspects closely. The light-field camera is a good example. Unlike ordinary cameras, which capture a single plane of light, it records about 11 million rays from the entire light field, so photographers can choose later which part of the image to focus on. Since all the information is collected, there is no need to focus in advance, which makes the data more reusable than ordinary photos, where the focus must be chosen before the shutter is pressed.","o":["The history of digital photography","Why random sampling is more accurate than full data","How compressing files improves quality","The freedom that comes from collecting all the data","Why photographers should focus before shooting"],"a":3,"x":"전체 데이터를 모으면 탐구의 자유가 생긴다는 게 주제야. ②는 원문(표본은 정보를 잃는다)과 반대야.","m":[["a good shortcut","a convenient shortcut"],["information is lost when sampling","sampling also loses information"],["the full dataset provides a lot more freedom to explore","all the data gives far more freedom to explore"]]},"2023-38":{"v":"Introverted leaders must fight the widespread belief that extroverts lead better. Although people are split almost evenly between introverts and extroverts, over 96 percent of managers and executives are extroverts, and in a 2006 study, 65 percent of senior executives saw introversion as an obstacle to leadership. This stereotype, however, deserves a second look, since it is not always true. Researchers at Regent University found that a wish to serve others and help them grow, which introverts show more often than extroverts, is a key factor in becoming and remaining a leader. This approach, called servant leadership and rooted in ancient philosophy, holds that a company reaches its goals best by helping workers or customers reach theirs. Such leaders do not seek the spotlight but highlight others' successes; this takes humility, and that humility ultimately pays off.","o":["Why extroverts make better managers","The strengths introverts bring to leadership through serving others","How companies choose their executives","The history of ancient philosophy","Why humility prevents success in business"],"a":1,"x":"섬기는 리더십을 통해 내향적인 사람이 가진 리더십의 강점이 주제야. ①은 원문이 반박한 고정관념이야.","m":[["the strong cultural presumption","the widespread belief"],["a barrier to leadership","an obstacle to leadership"],["We must reexamine this stereotype","This stereotype, however, deserves a second look"]]},"2023-39":{"v":"By the 1800s, France had created a system of exact measurement units for space, time, and more, and had started persuading other countries to adopt them. Only about fifty years later, in the 1920s, quantum mechanics shattered the dream of complete and perfect measurement. Even so, apart from a small group of physicists, engineers and scientists kept striving to measure flawlessly, and in business this drive even grew as mathematics and statistics spread into all areas of commerce. Today, however, unlike in recent decades, accepting imprecision, or messiness, can be an advantage rather than a weakness in many new situations. If we loosen our standards for acceptable errors, we can collect far more data. It is not simply that more is better than some; sometimes, more is greater than better.","o":["Why businesses must measure everything precisely","The dangers of errors in statistics","France's role in creating the metric system","Why quantum mechanics changed physics","The value of accepting messiness to gain more data"],"a":4,"x":"지저분함을 받아들이면 더 많은 데이터를 얻는다는 게 주제야. ①는 원문이 넘어서자고 한 과거의 생각이야.","m":[["forever destroyed the dream","shattered the dream"],["a positive feature, not a shortcoming","an advantage rather than a weakness"],["relaxing the standards of allowable errors","loosen our standards for acceptable errors"]]},"2023-40":{"v":"Many lab studies show that people who cooperate tend to gain social benefits from others. Researchers test this by letting people reward or punish those who contribute. Professor Pat Barclay, for instance, had participants play a game in which they could give money to a shared fund that benefited the whole group, and then let them give money to one another based on reputation. Those who had given more to the group fund were trusted with more money than those who had given less. Other researchers have found similar results: people who contribute to their groups are picked more often as partners, preferred as leaders, rated as better long-term partners, and seen as trustworthy and high in status, while uncooperative people tend to face criticism or harsher punishment.","o":["Why leaders are usually uncooperative","Why people avoid group projects","Social rewards that cooperative people receive","How reputation can be faked","The dangers of sharing money"],"a":2,"x":"협력적인 사람이 받는 사회적 보상이 주제야. ①는 원문(기여자가 리더로 선호된다)과 반대야.","m":[["receive social advantages from others","gain social benefits from others"],["give people the opportunity to act positively or negatively toward contributors","letting people reward or punish those who contribute"],["chosen more often as interaction partners","picked more often as partners"]]}};

study:{name:"전문가 견해 · Lembke의 NPR 인터뷰 (2022)",body:"Lembke는 기대고 있는 즐거움을 30일 동안 끊는 '도파민 단식'을 권해. 처음엔 기분이 더 나빠지지만, 약 2주쯤 지나면 시소의 균형이 돌아오기 시작해서 소소한 즐거움도 다시 느낄 수 있게 된다고 설명해."},
life:"숏폼을 연달아 넘기고 나면 교과서나 책이 유난히 재미없게 느껴질 때가 있지? 지문 표현대로라면 저울이 한쪽으로 쏠려 있는 상태야.",
think:"'그만 봐야지' 하면서도 계속 넘기게 되는 콘텐츠는 뭐야? 다 보고 난 뒤엔 어떤 기분이 들어?",
quiz:{q:"Lembke가 쾌락과 고통의 관계를 비유한 것은?",o:["시소","계단","거울"],a:0,x:"Lembke는 쾌락과 고통을 시소의 양쪽에 비유해. 지문의 '저울(scale)' 비유와 같은 생각이야."},
src:[["NPR (2022) · Addiction: how to break the cycle and find balance","https://www.npr.org/2022/03/31/1090009509/addiction-how-to-break-the-cycle-and-find-balance"]]},

{id:"predict",pid:"2022-31",cat:"뇌과학",
q:"뇌는 왜 '어? 예상이랑 다르네' 할 때 더 많이 배울까?",
link:"오류 신호 없이는 학습이 없고, 생물은 사건이 기대를 깰 때만 배워. 같은 음이 반복되면 반응이 줄다가(적응), 예상 밖의 음이 나오면 뇌가 강하게 놀라.",
deep:["이 생각은 뇌과학에서 '예측 오류(prediction error)'라는 개념으로 연구돼 왔어. 뇌는 늘 다음에 올 것을 예측하고, 예측과 실제가 다를 때 그 차이를 배움의 신호로 써.","특히 보상과 관련된 학습에서 도파민 뉴런이 이 역할을 한다는 연구가 유명해."],
study:{name:"Schultz, Dayan, Montague (1997) · Science 275권",body:"원숭이 중뇌의 도파민 뉴런 활동이 보상 그 자체보다는 '미래 보상에 대한 예측의 변화나 오류'를 신호하는 것처럼 보인다고 보고했어. 연구진은 이 결과를 학습을 설명하는 수학적 이론으로 설명할 수 있다고 봤어."},
life:"이미 아는 문제를 다시 맞힐 때보다, 확신했다가 틀린 문제가 더 오래 기억나는 경험 있지? '내 예측이 틀렸다'는 신호가 강했던 거야.",
think:"최근에 예상과 달라서 놀랐던 일 중에 아직도 또렷하게 기억나는 건 뭐야?",
quiz:{q:"이 연구에 따르면 도파민 뉴런이 신호하는 것으로 보이는 것은?",o:["보상의 크기 그 자체","보상에 대한 예측의 변화나 오류","소리의 크기"],a:1,x:"도파민 뉴런은 예측과 실제의 차이, 즉 예측 오류를 신호하는 것처럼 보였어. 지문의 'error signal'과 같은 개념이야."},
src:[["PubMed · A neural substrate of prediction and reward (Science, 1997)","https://pubmed.ncbi.nlm.nih.gov/9054347/"]]},

{id:"commons",pid:"2024-35",cat:"경제·사회",
q:"'공유지의 비극'은 정말 피할 수 없는 운명일까?",
link:"새로운 공유 자원은 처음엔 모두에게 이익이지만, 사용량이 감당할 수준을 넘으면 혜택이 줄고 결국 스스로 재생하는 능력까지 무너져. 지문은 이걸 '공유지의 비극'이라고 불러.",
deep:["'공유지의 비극'이라는 말은 생물학자 Garrett Hardin이 1968년에 쓴 같은 제목의 글로 널리 알려졌어. 함께 쓰는 자원은 결국 남용될 수밖에 없다는 비관적인 시각이었지.","정치경제학자 Elinor Ostrom은 이 생각에 중요한 단서를 붙였어. 물 관리 시스템처럼 함께 쓰는 자원도, 사용자들이 직접 만든 규칙과 관습이 있으면 남용을 막을 수 있다는 거야."],
study:{name:"Elinor Ostrom · 2009년 노벨 경제학상",body:"오스트롬은 '경제적 거버넌스, 특히 공유지에 대한 분석'으로 2009년 노벨 경제학상을 받았어(Oliver Williamson과 공동 수상). 비공식적이고 관습적인 규칙이 과다 사용과 투자 부족을 줄일 수 있다는 걸 보여 준 공로야."},
life:"반 공용 충전기나 공용 우산은 규칙이 없으면 금방 사라지거나 고장 나. 그런데 반에서 순서와 담당자를 정하면 훨씬 오래 써. 이게 오스트롬이 말한 '사용자가 만든 규칙'이야.",
think:"우리 반이나 학교에서 '공유지의 비극'이 일어나는 건 뭐야? 어떤 규칙을 만들면 막을 수 있을까?",
quiz:{q:"오스트롬의 연구가 보여 준 것은?",o:["공유 자원은 언제나 결국 파괴된다","사용자들이 만든 규칙으로 과다 사용을 줄일 수 있다","공유 자원은 반드시 정부가 소유해야 한다"],a:1,x:"오스트롬은 공동체가 스스로 만든 규칙과 관습이 남용을 막을 수 있다는 걸 보여 줬어. 지문은 비극의 원리를, 오스트롬은 해결 가능성을 보여 준 셈이야."},
src:[["Creative Commons (2009) · Nobel Prize in Economics to Elinor Ostrom","https://creativecommons.org/2009/10/12/nobel-prize-in-economics-to-elinor-ostrom-for-her-analysis-of-economic-governance-especially-the-commons/"]]},

{id:"retrieval",pid:"2024-36",cat:"학습 과학",
q:"시험 직전에 여러 번 다시 읽기 vs 책 덮고 떠올리기, 뭐가 더 오래 남을까?",
link:"뇌는 정보를 저장하고 꺼내는(retrieving) 데 에너지가 많이 들어서, 세부 사항 대신 일반 패턴을 저장하는 지름길을 써.",
deep:["뇌가 에너지를 많이 쓰는 건 사실이야. 성인의 뇌는 몸무게의 약 2%인데, 몸이 쓰는 산소와 칼로리의 약 20%를 써.","그런데 기억을 '꺼내는' 수고는 낭비가 아니야. 심리학에서는 스스로 떠올리는 연습을 인출 연습(retrieval practice)이라고 하는데, 꺼낼수록 기억이 더 단단해진다는 연구가 많아."],
study:{name:"Roediger & Karpicke (2006) · Psychological Science",body:"학생들이 지문을 읽은 뒤 한 번 더 읽거나, 책을 덮고 떠올려 적는 시험을 봤어. 5분 뒤에는 다시 읽은 쪽이 더 많이 기억했어(81% 대 75%). 그런데 2일 뒤엔 54% 대 68%, 1주일 뒤엔 42% 대 56%로 떠올린 쪽이 앞섰어."},
life:"이 노트의 3분 학습이 답을 바로 보여 주지 않고 먼저 고르게 하는 이유가 이거야. 고르는 순간이 바로 인출 연습이거든.",
think:"오늘 공부한 지문의 주제를 책을 안 보고 한 문장으로 말할 수 있어?",
quiz:{q:"Roediger & Karpicke 연구에서 1주일 뒤 더 많이 기억한 쪽은?",o:["여러 번 다시 읽은 쪽","떠올려 적는 시험을 본 쪽","차이가 없었다"],a:1,x:"1주일 뒤엔 시험을 본 쪽이 56%, 다시 읽은 쪽이 42%를 기억했어. 바로 직후에는 다시 읽기가 앞서서 착각하기 쉬워."},
src:[["Roediger & Karpicke (2006) · Test-enhanced learning (PDF)","https://psychology.ecu.edu/wp-content/pv-uploads/sites/216/2019/03/Roediger-Karpicke-2006.pdf"],["Raichle & Gusnard (2002) · Appraising the brain's energy budget (PNAS)","https://pmc.ncbi.nlm.nih.gov/articles/PMC124895"]]},

{id:"banana",pid:"2024-40",cat:"지각 심리",
q:"회색 바나나도 노랗게 보일 수 있을까?",
link:"Delk와 Fillenbaum의 실험에서, 모두 같은 다홍색 판지로 만든 그림인데도 사과·입술·하트처럼 빨간색과 연관된 물체는 배경을 더 빨갛게 맞춰야 같다고 판단했어. 지식이 색 지각을 바꾼다는 거야.",
deep:["이 생각은 40년 뒤 컴퓨터 화면으로 다시 확인됐어. 물체에 대한 기억 속 색을 '기억색(memory color)'이라고 불러."],
study:{name:"Hansen 외 (2006) · Nature Neuroscience",body:"독일 기센 대학교의 Karl Gegenfurtner 연구팀은 참가자에게 과일 사진의 색을 조정해 회색으로 보이게 만들라고 했어. 바나나는 회색보다 살짝 파랗게(노랑의 반대색) 맞췄어. 실제로 회색인 바나나도 약간 노랗게 보였다는 뜻이야. 같은 실험을 단순한 원판으로 하면 효과가 사라졌어."},
life:"흑백 사진 속 딸기나 바나나를 보면 머릿속에서 색이 저절로 떠오르는 느낌이 들지? 그게 기억색이 작동하는 순간이야.",
think:"내가 '당연히 이 색'이라고 믿는 물건은 뭐야? 정말 늘 그 색일까?",
quiz:{q:"실험에서 참가자들이 바나나를 회색으로 맞추려고 할 때 생긴 일은?",o:["살짝 파랗게 만들었다","살짝 빨갛게 만들었다","정확히 회색으로 맞췄다"],a:0,x:"머릿속 바나나의 노란색을 상쇄하려고 반대색인 파란 쪽으로 맞췄어. 지문의 빨간 물체 실험과 같은 원리야."},
src:[["Nature News (2006) · Even black and white bananas look yellow","https://www.nature.com/news/2006/061009/full/news061009-13.html"],["Hansen 외 (2006) 논문 PDF","https://www.mv.helsinki.fi/home/molkkone/files/Hansen-et-al-2006-MemoryModulatesColorAppearance-NN-9-1367.pdf"]]},

{id:"loftus",pid:"2023-32",cat:"기억·법",
q:"질문에 쓴 단어 하나가 내 기억을 바꿀 수 있을까?",
link:"사건 이후에 들은 정보가 목격자의 기억에 섞여 들 수 있고, 목격자는 그 출처조차 모를 수 있어. 법정에서도 이런 오정보가 생길 수 있어.",
deep:["이 분야를 대표하는 연구자가 Elizabeth Loftus야. 질문을 어떻게 하느냐만으로 기억이 달라질 수 있다는 걸 실험으로 보여 줬어."],
study:{name:"Loftus & Palmer (1974) · 자동차 사고 실험",body:"실험 1에서 45명에게 사고 영상을 보여 주고 동사만 바꿔 속도를 물었어. 'smashed(박살 났을 때)' 40.8마일, 'collided' 39.3, 'bumped' 38.1, 'hit' 34.0, 'contacted(접촉했을 때)' 31.8마일로 답이 달라졌어. 실험 2에서는 150명에게 일주일 뒤 '깨진 유리를 봤나'고 물었더니, smashed로 질문받은 그룹은 32%, hit 그룹은 14%, 속도 질문을 안 받은 그룹은 12%가 봤다고 했어."},
life:"친구가 '그때 너 엄청 화났었지?'라고 물으면, 실제보다 더 화났던 것처럼 기억이 바뀌는 느낌이 들 때가 있어.",
think:"내 기억 중에 다른 사람이 해 준 말 때문에 모양이 바뀌었을지도 모르는 장면이 있어?",
quiz:{q:"'smashed'로 질문받은 그룹의 평균 속도 추정은?",o:["31.8마일","34.0마일","40.8마일"],a:2,x:"가장 센 동사인 smashed에서 가장 빠른 속도(40.8마일)가 나왔어. 지문의 '사후 정보' 효과를 단어 하나로 보여 준 실험이야."},
src:[["Simply Psychology · Loftus and Palmer (1974)","https://simplypsychology.org/loftus-palmer.html"]]},

{id:"asch",pid:"2023-23",cat:"사회 심리",
q:"모두가 틀린 답을 말하면, 나도 따라 말하게 될까?",
link:"골드먼은 광고와 설명으로는 쇼핑 카트를 쓰게 할 수 없었지만, 손님처럼 위장한 바람잡이 몇 명이 카트를 쓰자 몇 주 만에 모두가 받아들였어.",
deep:["다른 사람들의 행동에 맞춰 내 판단이나 행동을 바꾸는 걸 '동조(conformity)'라고 해. 이걸 처음 실험으로 보여 준 사람이 심리학자 Solomon Asch야."],
study:{name:"Asch (1951) · 선 길이 실험",body:"선 세 개 중 기준선과 길이가 같은 걸 고르는 쉬운 문제였어. 혼자 판단하면 틀리는 비율이 1%도 안 됐어. 그런데 바람잡이들이 일부러 틀린 답을 말하자, 결정적인 시행에서 평균 약 32%가 따라서 틀린 답을 골랐어. 약 75%는 적어도 한 번 따라갔고, 약 25%는 한 번도 따르지 않았어."},
life:"댓글과 좋아요가 많은 영상은 더 재밌어 보이고, 줄이 긴 가게는 더 맛있어 보이지? 카트 바람잡이와 같은 원리야.",
think:"좋아요나 조회수가 내 판단에 영향을 준 적이 있어? 그때 내 생각은 뭐였어?",
quiz:{q:"Asch 실험에서 혼자 판단했을 때의 오답률은?",o:["1% 미만","약 32%","약 75%"],a:0,x:"혼자서는 거의 틀리지 않는 쉬운 문제였어. 그래서 다른 사람을 따라 틀린 비율(약 32%)이 더 놀라운 거야."},
src:[["Simply Psychology · Asch Conformity Experiment","https://www.simplypsychology.org/asch-conformity.html"]]},

{id:"fresh",pid:"2022-22",cat:"행동경제학",
q:"왜 '월요일부터 할게'라는 말에는 이상한 힘이 있을까?",
link:"연구자들이 어떤 날짜를 '봄의 첫날'처럼 새로운 시작으로 소개하면, '3월 셋째 목요일'처럼 평범하게 소개할 때보다 학생들이 그날 목표를 시작하고 싶어 했어.",
deep:["이 현상을 '새 출발 효과(fresh start effect)'라고 해. 새 주, 새 달, 생일, 새 학기처럼 새로운 시기를 알리는 날짜를 '시간적 이정표'라고 부르는데, 이런 날은 과거의 실패와 지금의 나를 떼어 놓기 쉽게 해 줘."],

const norm=s=>String(s).replace(/[\u2019\u2018]/g,"'").replace(/[\u201C\u201D]/g,'"').replace(/[\u2011\u2010]/g,"-");

function splitSent(t){

  return parts.map(p=>p.replace(/\u0000/g,".").trim()).filter(Boolean);
}

function P(id){

}

/* ---------- highlighting ---------- */
function vkeys(p){
  if(p._vk)return p._vk;const ks=[];
  (p.vo||[]).forEach(v=>{let w=v[0].replace(/\(.*?\)/g,"").split("/")[0].trim();
    w=w.split(/\s(?:A|B|O|~|one's|-ing)(?:\s|$)/)[0].replace(/\s-ing$/,"").trim();
    if(w.length>=3)ks.push(w.toLowerCase());});
  p._vk=ks;return ks;
}
function highlight(s,p,idx){
  const ns=norm(s),low=ns.toLowerCase(),L=s.length;
  const g=new Array(L).fill(-1),v=new Array(L).fill(false);
  (p.gp||[]).forEach((x,gi)=>{if(p.gpLoc[gi]!==idx)return;const key=keyOf(x[0]);const at=ns.indexOf(key);if(at<0)return;for(let i=at;i<at+key.length;i++)if(g[i]<0)g[i]=gi;});
  vkeys(p).forEach(k=>{const re=new RegExp("\\b"+k.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"(?:s|es|d|ed|ing|ly)?\\b","g");let m;while((m=re.exec(low))){for(let i=m.index;i<m.index+m[0].length;i++)v[i]=true;}});
  let out="",i=0;
  while(i<L){let j=i;while(j<L&&g[j]===g[i]&&v[j]===v[i])j++;
    let seg=esc(s.slice(i,j));if(v[i])seg='<span class="vw">'+seg+"</span>";
    if(g[i]>=0)seg='<mark class="gm" data-g="'+g[i]+'" tabindex="0">'+seg+"</mark>";
    out+=seg;i=j;}
  return out;
}
function isKey(p,s){const ks=(KEYS[p.id]||[]).map(norm);const n=norm(s);return ks.some(k=>n.includes(k));}

function shuffleOrd(a,prev){let ord;let tries=0;
  do{ord=[0,1,2,3,4];for(let i=4;i>0;i--){const j=Math.floor(Math.random()*(i+1));[ord[i],ord[j]]=[ord[j],ord[i]];}tries++;}

  return ord;}
