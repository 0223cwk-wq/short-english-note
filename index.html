<script>
window.BASE={"2024": {"21": {"en": ["Imagine that your usually stingy friend delights in buying you a Christmas present after taking a generosity booster.", "How would you feel?", "Undoubtedly, there is something praiseworthy about the action.", "You’d be pleased to receive the gift.", "You’d say ‘thank you’, and mean it.", "But his change of heart is not entirely satisfying.", "According to Zagzebski, an American philosopher, he is not really generous.", "When we praise someone’s character, we use words for various virtues: ‘generous’, ‘kind’, ‘courageous’, etc.", "A person who gives one gift isn’t generous.", "Instead, generosity is a stable part of a person’s ‘moral identity’, an emotional habit that is part of who you are.", "Thus virtues, as opposed to nontypical impulse, are the result of your personal history.", "They are part of who you are, as they are part of how your character was formed.", "Instant virtue is therefore impossible.", "Popping a pill cannot make you a better person."], "ko": ["평소에 인색한 여러분의 친구가 관대함 효능 촉진제를 먹고 난 이후에 여러분에게 크리스마스 선물을 사 주며 매우 기뻐한다고 상상해 보라.", "여러분은 어떻게 느끼겠는가?", "의심할 여지없이, 그 행동에는 칭찬할 만한 점이 있다.", "여러분은 선물을 받아서 기뻐할 것이다.", "여러분은 ‘고마워’라고 말하고, 그것은 진심일 것이다.", "하지만 그의 마음의 변화는 완전히 만족스럽지는 않다.", "미국의 철학자인 Zagzebski에 따르면, 그는 진정으로 관대한 것이 아니다.", "우리가 누군가의 인품을 칭찬할 때 ‘관대한,’ ‘친절한,’ ‘용기 있는’ 등 다양한 미덕에 대한 단어를 사용한다.", "선물을 하나 준 사람이 관대한 것은 아니다.", "대신에, 관대함은 누군가의 ‘도덕적 정체성’의 안정된 일부인데 그것은 여러분의 모습의 일부인 정서적 습관이다.", "따라서 미덕은, 비전형적인 충동과는 달리, 여러분 개인 역사의 결과이다.", "그것들이 여러분의 인품이 형성되었던 방식의 일부이기 때문에 그것들은 여러분의 모습 중 일부이다.", "그러므로 즉각적인 미덕은 있을 수 없다.", "약 한 알을 먹는 것이 여러분을 더 나은 사람으로 만들 수는 없다."]}, "22": {"en": ["To determine the mass of my bowling ball, I might put it onto a balance and compare it with a known mass, such as a number of metal cubes each weighing 1, 10, or 100 grams.", "Things get much more complicated if I want to know the mass of a distant star.", "How do I measure it?", "We can roughly say that measuring the mass of a star involves various theories.", "If we want to measure the mass of a binary star, we first determine a center of mass between the two stars, then their distance from that center which we can then use, together with a value for the period and a certain instance of Kepler’s Third Law, to calculate the mass.", "In other words, in order to “measure” the star mass, we measure other quantities and use those values, together with certain equations, to calculate the mass.", "Measurement is not a simple and unmediated estimation of independently existing properties, but a determination of certain magnitudes before the background of a number of accepted theories."], "ko": ["볼링공 질량을 측정하기 위해, 나는 그것을 저울에 올려놓고 각 1g, 10g, 또는 100g이 나가는 여러 개의 금속 큐브 같은 이미 알고 있는 질량과 그것을 비교할 수 있다.", "만약 내가 먼 별의 질량을 알고 싶다면 상황은 훨씬 더 복잡해진다.", "나는 어떻게 그것을 측정할까?", "우리는 별의 질량을 측정하는 것은 다양한 이론을 포함한다고 대략적으로 말할 수 있다.", "우리가 쌍성의 질량을 측정하기를 원한다면, 질량을 계산하기 위해 우리는 먼저 두 별들 사이의 질량 중심을, 그 다음에 우리가 그제서야 사용할 수 있는 그 중심으로부터 떨어진 그것들의 거리를 공전 주기의 값과 케플러 제3 법칙의 특정한 사례를 가지고 측정한다.", "다시 말해서, 별의 질량을 ‘측정’하기 위해서 우리는 다양한 수치들을 측정하고 그 값들을 특정 방정식들과 함께 사용하여 질량을 계산한다.", "측정은 독립적으로 존재하는 값들의 단순하고 중재되지 않은 측정이 아니라, 이미 정립된 여러 이론들을 바탕으로 특정 크기들을 계산하는 것이다."]}, "23": {"en": ["Based on discoveries in neuroscience, pain and pleasure are formed and processed in the same area of the brain.", "Our bodies constantly strive for homeostasis, which is defined as the balance of bodily functions.", "Without the body’s effective compensatory mechanisms, which may cushion potential highs and lows, we would not be capable of surviving.", "Pleasure and pain are like two sides of the same coin; they seem to work together and are heavily reliant on one another and keep balance.", "If you imagine pleasure and pain as the two opposite points on a scale, you can easily understand that as one of the two points rises, the other must correspondingly fall.", "We’ve all heard the expression, “No pain, no gain.”", "Well, according to psychiatrist Dr. Anna Lembke, there may be some truth to these words.", "She says that our attempts to escape being miserable are in fact making us even more miserable.", "This is because pain is actually an essential component of our ability to maintain a neutral state, and allowing it will in turn reset our internal scale back to balance."], "ko": ["뇌 과학의 발견들에 따르면, 고통과 쾌락은 뇌의 같은 영역에서 형성되고 처리된다.", "우리 몸은 끊임없이 항상성을 추구하는데, 그것은 몸의 기능들의 균형이라고 정의된다.", "잠재적인 변동을 완화시킬 수 있는 몸의 효과적인 보상 기제가 없다면 우리는 생존할 수 없을 것이다.", "쾌락과 고통은 동일한 동전의 두 면과 같아서 그들은 함께 작동하는 것 같으며 서로 상당히 의존하고 있고 균형을 유지한다.", "만약에 여러분이 쾌락과 고통을 저울 위의 두 반대 지점으로 상상한다면, 여러분은 두 지점 중 한 지점이 올라가면 다른 한 지점이 상응하여 틀림없이 내려갈 것임을 쉽게 이해할 수 있을 것이다.", "우리는 ‘고통 없이는, 얻는 것도 없다.’라는 표현을 모두 들어본 적이 있다.", "자, 정신과 의사인 Dr. Anna Lembke에 따르면, 이 말에는 어느 정도의 진실이 있을 수 있다.", "그녀는 우리가 비참함에서 벗어나려는 우리의 시도가 사실 우리를 훨씬 더 비참하게 만들고 있다고 말한다.", "이는 고통이 실제로 중립적인 상태를 유지하기 위한 우리 능력의 필수적인 구성 요소이기 때문이고, 그것을 허용하는 것은 결과적으로 우리의 내부 저울을 균형 상태로 다시 맞출 것이다."]}, "24": {"en": ["Manufacturers masterfully sow seeds of doubt about the adequacy of our current devices.", "Suddenly, the phone that was your lifeline a year ago is now a museum piece, unable to keep pace with your digital demands.", "And thus, the itch to upgrade begins, often before there’s a genuine need.", "This cycle isn’t just confined to our digital companions.", "It spills over into almost every aspect of consumer electronics, from the self‑driving car to the smart fridge.", "Every product seems to be on an unstoppable march towards the next version, the next generation that promises to revolutionize your life.", "What’s fascinating, or perhaps disturbing, is the utter efficacy of this cycle in shaping our desires.", "It’s not so much that we want the newest device; we’re led to believe we need it.", "The distinction between want and need blurs, shifting our financial priorities in favor of staying current with trends.", "For all the logical arguments against this ceaseless upgrading, the temptation remains compelling."], "ko": ["생산자들은 노련하게 우리의 현재 기기들의 적절성에 대한 의심의 씨앗을 뿌린다.", "갑자기, 1년 전의 당신의 목숨줄이었던 휴대폰이 지금은 당신의 디지털 수요를 따라가지 못하는, 시대에 뒤떨어진 것이 되었다.", "그래서 종종 진짜 필요가 있기 이전에 업그레이드에 대한 욕구가 시작된다.", "이러한 순환은 단지 우리의 디지털 용품에 국한되지 않는다.", "이것은 자율 주행 자동차부터 스마트 냉장고에 이르기까지 소비자 전자 기기들의 거의 모든 영역까지 번져나간다.", "모든 제품은 다음 버전, 즉, 당신의 삶에 변혁을 일으키겠다는 약속을 하는 다음 세대를 향한 멈출 수 없는 행진을 하는 것으로 보인다.", "흥미로운 점, 또는 어쩌면 당황스러운 점은 우리의 욕구를 형성하는 이 순환의 절대적인 효과이다.", "우리가 가장 최신 기기를 원하는 것이 아니라, 우리가 그것을 원한다고 믿도록 유도된 것이다.", "최신 트렌드를 유지하는 것을 선호하는 쪽으로 우리의 재정적인 우선순위를 바꾸면서, 원하는 것과 필요한 것 사이의 구분이 흐릿해진다.", "이런 끊임없는 업그레이드를 하는 것에 대한 논리적인 논쟁에도 불구하고, 매력은 여전히 강력하다."]}, "29": {"en": ["Conditioned Place Preference is a way of finding out what animals want.", "Researchers train them to associate one place with an experience such as food or a loud noise and another place with something completely different, usually where nothing happens.", "The two places are made obviously different to make it as easy as possible for the animal to associate each place with what happened to it there.", "The animal’s preference for being in one place or another is measured both before and after its experiences in the two places.", "If there is a shift in where the animal chooses to spend its time for the reward, this suggests that it liked the experience and is trying to repeat it.", "Conversely, if it now avoids the place the stimulus appeared and starts to prefer the place it did not experience it, then this suggests that it found the stimulus unpleasant.", "For example, mice with cancer show a preference for the place where they have been given morphine, a drug used to relieve pain, rather than where they have received saline whereas healthy mice developed no such preference.", "This suggests that the mice with cancer wanted the morphine."], "ko": ["조건부 장소 선호도는 동물들이 무엇을 원하는지 알아내는 하나의 방법이다.", "연구자들은 그것들이 한 장소를 음식이나 시끄러운 소리와 같은 경험과 연관시키고 또 다른 장소를 완벽히 다른 어떤 것과 연관시키도록 훈련시키는데 대개 그곳에서는 아무것도 일어나지 않는다.", "그 두 장소는 그 동물이 각 장소를 거기에서 그것에게 일어난 일과 연관시키는 것을 가능한 한 쉽게 만들기 위해 명백히 다르게 만들어진다.", "한 장소나 다른 장소에 있는 것에 대한 그 동물의 선호도는 두 장소에서 경험하기 전과 후에 모두 측정된다.", "만약 동물이 보상을 위해 어디에서 시간을 보내기로 선택하는지에 변화가 있다면, 이것은 그것이 그 경험을 좋아했고 그것을 반복하려고 노력하는 중이라는 것을 시사한다.", "반대로, 만약 그것이 이제 자극이 나타났던 장소를 피하고 그것이 그것을 경험하지 않았던 장소를 선호하기 시작한다면, 그러면 이것은 그것이 그 자극을 불쾌하게 느꼈다는 것을 시사한다.", "예를 들어, 암에 걸린 쥐가 식염수를 받아 왔었던 곳보다 통증을 완화시키는 데 사용되는 약인 모르핀이 주어졌었던 장소에 대한 선호를 보여 준 반면, 건강한 쥐는 그러한 선호가 생기지 않았다.", "이것은 암에 걸린 쥐가 그 모르핀을 원했음을 시사한다."]}, "30": {"en": ["Near the equator, many species of bird breed all year round.", "But in temperate and polar regions, the breeding seasons of birds are often sharply defined.", "They are triggered mainly by changes in day length.", "If all goes well, the outcome is that birds raise their young when the food supply is at its peak.", "Most birds are not simply reluctant to breed at other times but they are also physically incapable of doing so.", "This is because their reproductive system shrinks, which helps flying birds save weight.", "The main exception to this rule are nomadic desert species.", "These can initiate their breeding cycle within days of rain.", "It’s for making the most of the sudden breeding opportunity.", "Also, different species divide the breeding season up in different ways.", "Most seabirds raise a single brood.", "In warm regions, however, songbirds may raise several families in a few months.", "In an exceptionally good year, a pair of House Sparrows, a kind of songbird, can raise successive broods through a marathon reproductive effort."], "ko": ["적도 근처에서, 새의 많은 종들은 일 년 내내 번식한다.", "하지만 온대와 극지방에서는 새들의 번식기들이 대개 뚜렷하게 정해진다.", "그것들은 주로 낮의 길이의 변화에 의해 촉발된다.", "만약에 모든 것이 잘 진행된다면, 결과는 새들이 먹이 공급이 최고조에 이를 때 새끼들을 기르는 것이다.", "대부분의 새들은 다른 때에 번식하기를 단지 꺼리는 것뿐만 아니라 또한 신체적으로 그렇게 할 수 없는 것이다.", "이것은 왜냐하면 그들의 번식 기관이 줄어들기 때문이고, 이 사실은 나는 새들이 몸무게를 줄일 수 있도록 도와준다.", "유목성 사막 종은 이 규칙의 주요 예외이다.", "이들은 비가 오는 날들에 번식 주기를 시작할 수 있다.", "그것은 갑작스러운 번식 기회를 최대한으로 활용하기 위한 것이다.", "또한, 다른 종들은 번식 기간을 다른 방식으로 나눈다.", "대부분의 바닷새들은 한 무리의 함께 태어난 새끼를 기른다.", "그러나, 따뜻한 지역에서는, 명금(鳴禽)들이 몇 달 안에 여러 자녀들을 기를 수도 있다.", "유난히 좋은 해에는 명금(鳴禽)의 한 종류인 참새 한 쌍은 마라톤과 같은 번식 노력을 통해 잇따라 태어난 여러 무리의 함께 태어난 새끼들을 기를 수 있다."]}, "31": {"en": ["One factor that may hinder creativity is unawareness of the resources required in each activity in students’ learning.", "Often students are unable to identify the resources they need to perform the task required of them.", "Different resources may be compulsory for specific learning tasks, and recognizing them may simplify the activity’s performance.", "For example, it may be that students desire to conduct some experiments in their projects.", "There must be a prior investigation of whether the students will have access to the laboratory, equipment, and chemicals required for the experiment.", "It means preparation is vital for the students to succeed, and it may be about human and financial resources such as laboratory technicians, money to purchase chemicals, and equipment for their learning where applicable.", "Even if some of the resources required for a task may not be available, identifying them in advance may help students’ creativity.", "It may even lead to changing the topic, finding alternative resources, and other means."], "ko": ["창의성을 방해할 수도 있는 한 가지 요소는 학생들의 학습에서 각 활동에 요구되는 자원에 대한 인식이 없다는 것이다.", "종종 학생들은 그들에게 요구되는 과제를 수행하는 데 필요한 자원들을 식별할 수 없다.", "여러 가지의 자원들이 특정 학습 과제들에 대해 필수적일 수 있어서 그것들을 인식하는 것은 활동의 수행을 평이하게 해 줄 수도 있다.", "예를 들어, 학생들이 프로젝트에서 어떤 실험을 수행하기를 원할 수도 있다.", "학생들이 실험에 요구되는 실험실, 장비, 그리고 화학 물질에 접근할 수 있을지 여부에 대한 사전 조사가 있어야 한다.", "그것은 학생들이 성공하기 위해 준비가 필수적이라는 것을 의미하며, 그들의 학습을 위해 적용할 수 있는 경우에 그것은 실험실 기술자, 화학 물질 구입 자금, 그리고 장비와 같은 인적 그리고 재정적 자원에 대한 것일 수도 있다.", "과제에 요구되는 자원들 중 일부가 이용 가능하지 않을 수도 있지만, 사전에 그것들을 식별하는 것은 학생들의 창의성에 도움이 될 수도 있다.", "그것은 심지어 주제 변경, 대체 자원들 찾기, 그리고 다른 방법으로 이어질 수도 있다."]}, "32": {"en": ["All translators feel some pressure from the community of readers for whom they are doing their work.", "And all translators arrive at their interpretations in dialogue with other people.", "The English poet Alexander Pope had pretty good Greek, but when he set about translating Homer’s Iliad in the early 18th century he was not on his own.", "He had Greek commentaries to refer to, and translations that had already been done in English, Latin, and French—and of course he had dictionaries.", "Translators always draw on more than one source text.", "Even when the scene of translation consists of just one person with a pen, paper, and the book that is being translated, or even when it is just one person translating orally for another, that person’s linguistic knowledge arises from lots of other texts and other conversations.", "And then his or her idea of the translation’s purpose will be influenced by the expectations of the person or people it is for.", "In both these senses every translation is a crowd translation."], "ko": ["모든 번역가들은 그들이 대상으로 작업하고 있는 독자들의 공동체로부터 약간의 압박을 느낀다.", "그리고 모든 번역가들은 다른 사람들과의 대화에서 그들의 해석에 도달한다.", "영국의 시인 알렉산더 포프는 그리스어를 꽤 잘했지만, 18세기 초에 호머의 ‘Iliad’를 번역하는 것에 대해 착수했을 때 그는 혼자 한 것이 아니었다.", "그는 참고할 그리스어 해설과 이미 영어, 라틴어, 프랑스어로 된 번역본을 가지고 있었고, 물론 사전도 가지고 있었다.", "번역가들은 항상 한 가지 이상의 원문을 활용한다.", "심지어 번역 현장이 하나의 펜, 종이, 그리고 번역 중인 책을 가진 단 한 사람으로 구성되어 있거나, 한 사람이 다른 사람을 위해 구두로 번역 중일 때에도, 그 사람의 언어적 지식은 많은 다른 텍스트와 다른 대화에서 발생한다.", "그러고 나서 번역의 목적에 대한 그 또는 그녀의 생각은 이것의 대상이 되는 사람 또는 사람들의 기대에 의해 영향을 받는다.", "이 두 가지 의미에서 모든 번역은 군중 번역이다."]}, "33": {"en": ["Some people argue that there is a single, logically consistent concept known as reading that can be neatly set apart from everything else people do with books.", "Is reading really that simple?", "The most productive way to think about reading is as a loosely related set of behaviors that belong together owing to family resemblances, as Ludwig Wittgenstein used the phrase, without having in common a single defining trait.", "Consequently, efforts to distinguish reading from nonreading are destined to fail because there is no agreement on what qualifies as reading in the first place.", "The more one tries to figure out where the border lies between reading and not‑reading, the more edge cases will be found to stretch the term’s flexible boundaries.", "Thus, it is worth attempting to collect together these exceptional forms of reading into a single forum, one highlighting the challenges faced by anyone wishing to establish the boundaries where reading begins and ends.", "The attempt moves toward an understanding of reading as a spectrum that is expansive enough to accommodate the distinct reading activities."], "ko": ["몇몇 사람들은 사람들이 책을 가지고 하는 모든 다른 행동들로부터 깔끔하게 분리될 수 있는, 읽기로 알려진 유일하고 논리적으로 일관성 있는 개념이 있다고 주장한다.", "읽기는 정말로 그렇게 단순할까?", "읽기에 대해 생각하는 가장 생산적인 방식은 하나의 명백한 특성을 공통적으로 가지지 않은 채 Ludwig Wittgenstein이 그 어구를 사용한 것처럼 가족 유사성 때문에 함께 속하게 되는 헐겁게 연결된 행동의 묶음으로서이다.", "결론적으로, 읽기와 읽기가 아닌 것을 구분하려는 노력은 실패로 돌아가는데, 왜냐하면 애초에 무엇이 읽기로서의 자격을 주는가에 대한 동의가 없기 때문이다.", "읽기와 읽기가 아닌 것 사이의 경계가 어디에 있는가를 알려고 하면 할수록, 더욱 많은 특이 사례들이 그 용어의 유연한 경계를 확장하고 있다는 것이 밝혀질 것이다.", "그러므로, 이러한 예외적인 읽기의 형태들을 모두 함께 하나의 토론의 장으로 모으려는 시도는 해 볼 가치가 있으며, 그 토론의 장은 어디서 읽기가 시작되고 끝나는가에 대한 경계를 정하기를 원하는 누구나에 의해 마주하게 될 어려움들을 돋보이게 한다.", "그러한 시도는 별개의 읽기 활동들을 다 수용할 만큼 충분히 광범위한 스펙트럼으로서 읽기를 이해하는 것으로 발전한다."]}, "34": {"en": ["Weber’s law concerns the perception of difference between two stimuli.", "It suggests that we might not be able to detect a 1‑mm difference when we are looking at lines 466 mm and 467 mm in length, but we may be able to detect a 1‑mm difference when we are comparing a line 2 mm long with one 3 mm long.", "Another example of this principle is that we can detect 1 candle when it is lit in an otherwise dark room.", "But when 1 candle is lit in a room in which 100 candles are already burning, we may not notice the light from this candle.", "Therefore, the Just‑noticeable difference (JND) varies as a function of the strength of the signals.", "For example, the JND is greater for very loud noises than it is for much more quiet sounds.", "When a sound is very weak, we can tell that another sound is louder, even if it is barely louder.", "When a sound is very loud, to tell that another sound is even louder, it has to be much louder.", "Thus, Weber’s law means that it is harder to distinguish between two samples when those samples are larger or stronger levels of the stimuli."], "ko": ["베버의 법칙은 두 자극 사이의 차이에 대한 감지에 관한 것이다.", "이것은 우리가 466mm와 467mm 길이인 선들을 볼 때 1mm의 차이를 감지할 수 없지만, 우리가 2mm 길이와 3mm 길이인 선을 비교할 때는 1mm의 차이를 감지할 수 있을지도 모른다는 것을 암시한다.", "이 원리의 또 다른 예는 촛불이 켜지지 않았으면 어두웠을 방안에 하나의 촛불이 켜졌을 때 이것을 감지할 수 있다는 것이다.", "그러나 100개의 촛불이 이미 타고 있는 방에 하나의 촛불이 켜졌을 때, 우리는 이 촛불의 빛을 알아차리지 못할지도 모른다.", "그러므로, 겨우 알아차릴 수 있는 차이(JND)는 신호의 세기에 대한 함수에 의해 달라진다.", "예를 들어, JND는 훨씬 더 작은 소리에 대한 것보다 매우 큰 소음에 대해 더 크다.", "한 소리가 매우 약할 때, 우리는 그것이 간신히 더 클지라도, 또 다른 소리가 더 크다는 것을 구분할 수 있다.", "어떤 소리가 매우 클 때, 다른 소리가 훨씬 더 크다는 것을 구분하기 위해서는, 그 소리는 훨씬 더 커야 한다.", "그러므로, 베버의 법칙은 그 표본들이 자극의 수준이 더 크거나 강할 때 두 표본을 구별하기가 더 어렵다는 것을 의미한다."]}, "35": {"en": ["Any new resource (e.g., a new airport, a new mall) always opens with people benefiting individually by sharing a common resource (e.g., the city or state budget).", "Soon, at some point, the amount of traffic grows too large for the “commons” to support.", "Traffic jams, overcrowding, and overuse lessen the benefits of the common resource for everyone—the tragedy of the commons!", "If the new resource cannot be expanded or provided with additional space, it becomes a problem, and you cannot solve the problem on your own, in isolation from your fellow drivers or walkers or competing users.", "The total activity on this new resource keeps increasing, and so does individual activity; but if the dynamic of common use and overuse continues too long, both begin to fall after a peak, leading to a crash.", "What makes the “tragedy of commons” tragic is the crash dynamic—the destruction or degeneration of the common resource’s ability to regenerate itself."], "ko": ["어떤 새로운 자원(예를 들어, 새로운 공항, 새로운 쇼핑센터)은 항상 공동의 자원(예를 들어, 시 또는 주 예산)을 공유함으로써 사람들이 개별적으로 이익을 얻으면서 시작된다.", "곧, 어느 시점에서, 교통량은 ‘공유지’가 견디기에 너무 커진다.", "교통 체증, 과밀, 그리고 과도한 사용은 모두를 위한 공유 자원의 혜택을 줄이는데, 이것은 즉 공유지의 비극이다!", "만약 새로운 자원이 확장될 수 없거나 추가적인 공간이 제공될 수 없다면, 이것은 문제가 되고, 여러분은 여러분의 동료 운전자나 보행자 또는 경쟁 사용자들로부터 고립된 상태로 혼자서 문제를 해결할 수 없다.", "이 새로운 자원에 대한 총활동은 계속 증가하고, 개인 활동도 증가한다. 그러나 만약 공동 사용과 과도한 사용의 역학이 너무 오래 지속되면, 둘 다 정점 이후에 떨어지기 시작하고, 몰락으로 이어진다.", "‘공유지의 비극’을 더 비극적이게 만드는 것은 몰락 역학, 즉 그 스스로를 재생산할 수 있는 공동 자원의 능력의 파괴 또는 퇴보이다."]}, "36": {"en": ["Theoretically, our brain would have the capacity to store all experiences throughout life, reaching the quality of a DVD.", "However, this theoretical capacity is offset by the energy demand associated with the process of storing and retrieving information in memory.", "As a result, the brain develops efficient strategies, becoming dependent on shortcuts.", "When we observe a face, the visual image captured by the eyes is highly variable, depending on the point of view, lighting conditions and other contextual factors.", "Nevertheless, we are able to recognize the face as the same, maintaining the underlying identity.", "The brain, rather than focusing on the details of visualization, creates and stores general patterns that allow for consistent recognition across diverse circumstances.", "This ability to match what we see with general visual memory patterns serves as an effective mechanism for optimizing brain performance and saving energy.", "The brain, being naturally against unnecessary effort, constantly seeks to simplify and generalize information to facilitate the cognitive process."], "ko": ["이론적으로는 우리의 뇌는 DVD의 품질에 도달할 정도로, 삶의 모든 경험들을 저장할 수 있는 수용력을 가지고 있을 것이다.", "그러나, 이 이론상의 수용력은 기억에 정보를 저장하고 상기하는 과정과 관련된 에너지 수요로 인해 상쇄된다.", "그 결과, 뇌는 효율적인 전략들을 수립하고, 지름길에 의존하게 된다.", "우리가 얼굴을 관찰할 때, 눈에 의해 포착되는 시각적 이미지는 시점, 조명 조건 및 기타 상황적 요인들에 따라 매우 다양하다.", "그럼에도 불구하고, 우리는 근본적인 정체성을 유지하면서 얼굴을 같은 것으로 인식할 수 있다.", "뇌는 시각화의 세부 사항에 집중하기보다 다양한 상황들에서 일관된 인식을 가능하게 하는 일반적인 패턴을 생성하고 저장한다.", "우리가 보는 것과 일반적인 시각 기억 패턴을 일치시키는 이 능력은 뇌의 수행을 최적화하고 에너지를 절약하는 효과적인 기제로 작용한다.", "불필요한 노력에 자연스럽게 대항하는 뇌는 인지 과정을 돕기 위해서 끊임없이 정보를 단순화하고 일반화하는 것을 추구한다."]}, "37": {"en": ["Where scientific research is concerned, explanatory tales are expected to adhere closely to experimental data and to illuminate the regular and predictable features of experience.", "However, this paradigm sometimes conceals the fact that theories are deeply loaded with creative elements that shape the construction of research projects and the interpretations of evidence.", "Scientific explanations do not just relate a chronology of facts.", "They construct frameworks for systematically chosen data in order to provide a consistent and meaningful explanation of what is observed.", "Such constructions lead us to imagine specific kinds of subject matter in particular sorts of relations, and the storylines they inspire will prove more effective for analyzing some features of experience over others.", "When we neglect the creative contributions of such scientific imagination and treat models and interpretive explanations as straightforward facts—even worse, as facts including all of reality—we can blind ourselves to the limitations of a given model and fail to note its potential for misunderstanding a situation to which it ill applies."], "ko": ["과학 연구에 관해서는, 설명하는 이야기들이 실험의 데이터에 엄밀히 충실할 것으로 기대되고 경험의 규칙적이고 예측 가능한 특징들을 밝힐 것으로 기대된다.", "그러나, 이러한 패러다임은 때때로 이론들이 연구 프로젝트의 구성과 증거의 해석을 형성하는 창의적인 요소들로 철저히 채워져 있다는 사실을 감춘다.", "과학적 설명들은 단순히 사실들의 연대기를 말하는 것은 아니다.", "그것들은 관찰된 것에 대한 일관적이고 의미 있는 설명을 제공하기 위해 체계적으로 선택된 데이터에 대한 틀을 구축한다.", "그러한 구성들은 우리가 특정한 유형의 관계에서 구체적인 종류의 주제를 상상하도록 하며, 그것들이 고취하는 줄거리는 다른 것들보다 경험의 일부 특징을 분석하는 데 더 효과적일 것으로 판명될 것이다.", "우리가 그러한 과학적 상상의 창의적 기여를 무시하고 모델과 해석적 설명을 단순한 사실, 훨씬 더 심하게는 현실을 전부 포괄하는 사실로 간주할 때, 우리는 주어진 모델의 한계에 대해 우리 스스로를 눈멀게 하며 그것이 잘못 적용되는 상황에 대해 오해할 가능성을 알아차리지 못할 수 있다."]}, "38": {"en": ["We encounter contrary claims about the relation of literature to action.", "Theorists have maintained that literature encourages solitary reading and reflection as the way to engage with the world and thus counters the social and political activities that might produce social change.", "At best it encourages detachment or appreciation of complexity, and at worst passivity and acceptance of what is.", "But on the other hand, literature has historically been seen as dangerous: it promotes the questioning of authority and social arrangements.", "Plato banned poets from his ideal republic because they could only do harm, and novels have long been credited with making people dissatisfied with their lives and eager for something new.", "By promoting identification across divisions of class, gender, and race, books may promote a fellowship that discourages struggle; but they may also produce a keen sense of injustice that makes progressive struggles possible.", "Historically, works of literature are credited with producing change: Uncle Tom’s Cabin, a best‑seller in its day, helped create a revulsion against slavery that made possible the American Civil War."], "ko": ["우리는 문학과 행동의 관계에 대한 상반된 주장들과 마주한다.", "이론가들은 문학이 세상과 관계를 맺는 방법으로써 고독한 독서와 성찰을 장려하고 따라서 사회 변화를 일으킬 수 있을지도 모르는 사회적이고 정치적인 활동들에 거스른다고 주장해 왔다.", "기껏해야 이것은 단절 또는 복잡성에 대한 인정을, 최악의 경우 수동성과 있는 그대로에 대한 수용을 조장한다.", "그러나 다른 한편으로, 문학은 역사적으로 권위와 사회적 합의에 대한 의문을 제기하는 것을 조장하므로 위험하다고 여겨져 왔다.", "플라톤은 그들이 해를 끼치는 것만 할 수 있기 때문에 그의 이상적인 공화국으로부터 시인들을 추방했고, 소설은 사람들이 그들의 삶에 불만을 품게 만들고 새로운 무언가를 갈망하도록 하는 것으로 오랫동안 믿어져 왔다.", "계급, 성별, 그리고 인종의 경계를 넘어 동일시를 촉진함으로써, 책들은 투쟁을 단념시키는 동료 의식을 장려할 수 있을지 모르지만, 이것들은 또한 진보적인 투쟁들을 가능하게 만드는 강한 불의의 감정을 일으킬 수 있다.", "역사적으로, 문학 작품은 변화를 만드는 것으로 믿어져 왔는데 그 시대의 베스트셀러인 ‘톰 아저씨의 오두막’은 미국 남북 전쟁을 가능하게 만든 노예제에 대한 혐오감을 조성하는 것을 도왔다."]}, "39": {"en": ["According to Hobbes, man is not a being who can act morally in spite of his instinct to protect his existence in the state of nature.", "Hence, the only place where morality and moral liberty will begin to find an application begins in a place where a sovereign power, namely the state, emerges.", "Hobbes thus describes the state of nature as a circumstance in which man’s life is “solitary, poor, nasty, brutish and short”.", "It means when people live without a general power to control them all, they are indeed in a state of war.", "In other words, Hobbes, who accepted that human beings are not social and political beings in the state of nature, believes that without the power human beings in the state of nature are “antisocial and rational based on their selfishness”.", "Moreover, since society is not a natural phenomenon and there is no natural force bringing people together, what will bring them together as a society is not mutual affection according to Hobbes.", "It is, rather, mutual fear of men’s present and future that assembles them, since the cause of fear is a common drive among people in the state of nature."], "ko": ["홉스에 따르면, 인간은 자연 상태에서 자신의 존재를 보호하려는 그의 본능을 무릅쓰고 도덕적으로 행동할 수 있는 존재가 아니다.", "따라서, 도덕과 도덕적 자유가 적용을 찾기 시작하는 유일한 곳은 군림하는 권력, 즉 국가가 출현하는 곳에서 나타난다.", "따라서 홉스는 자연 상태를 인간의 삶이 ‘고독하고, 가난하며, 불결하고, 잔인하고, 짧은’ 상황으로 묘사한다.", "그것은 사람들이 그들 모두를 통제할 일반적인 권력없이 살아갈 때, 그들은 실로 전쟁 상태에 놓여 있는 것임을 의미한다.", "즉 다시 말해, 자연 상태에 있는 인간은 사회적이고 정치적인 존재가 아니라는 것을 인정한 홉스는 그 권력이 없이 자연 상태에 있는 인간은 ‘이기심에 기초해 반사회적이고 이성적’이라고 믿는다.", "게다가, 사회는 자연적인 현상이 아니며 사람들을 하나로 모으는 자연적인 힘도 없기 때문에, 홉스에 따르면 그들을 사회로 함께 모이게 하는 것은 상호 간의 애정이 아니다.", "두려움으로부터의 동기가 자연 상태에 있는 사람들 사이의 공통된 추진력이기 때문에, 오히려, 그들을 모으는 것은 인간의 현재와 미래에 대한 상호 간의 두려움이다."]}, "40": {"en": ["There is research that supports the idea that cognitive factors influence the phenomenology of the perceived world.", "Delk and Fillenbaum asked participants to match the color of figures with the color of their background.", "Some of the figures depicted objects associated with a particular color.", "These included typically red objects such as an apple, lips, and a symbolic heart.", "Other objects were presented that are not usually associated with red, such as a mushroom or a bell.", "However, all the figures were made out of the same red‑orange cardboard.", "Participants then had to match the figure to a background varying from dark to light red.", "They had to make the background color match the color of the figures.", "The researchers found that red‑associated objects required more red in the background to be judged a match than did the objects that are not associated with the color red.", "This implies that the cognitive association of objects to color influences how we perceive that color.", "In one study, participants chose greater redness when asked to match the color of objects that are usually red to a background with the same color, which showed that their knowledge about the colors of objects influenced their perceptual judgment."], "ko": ["인지적 요인들이 지각된 세계의 현상학에 영향을 미친다는 생각을 뒷받침하는 연구가 있다.", "Delk와 Fillenbaum은 참가자들에게 형상들의 색상을 배경 색상과 맞추도록 요청했다.", "몇몇 형상들은 특정 색상과 연관된 물체들을 묘사했다.", "그것들은 사과, 입술, 상징적인 하트 모양과 같이 전형적인 빨간색 물체를 포함했다.", "버섯이나 종과 같이 빨간색과 일반적으로 연관이 되지 않는 다른 물체들도 제시되었다.", "그러나, 모든 형상들은 동일한 다홍색 판지로 만들어졌다.", "그러고 나서 참가자들은 그 형상을 진한 빨간색에서 연한 빨간색까지 다양한 배경색과 맞춰야 했다.", "그들은 배경색이 형상들의 색과 일치하게 해야 했다.", "연구자들은 빨간색과 연관된 물체들이 빨간색과 연관이 없는 물체가 그러한 것보다 배경과 일치한다고 판단되기 위해서 배경에서 더 빨간 색을 요구한다는 것을 발견했다.", "이것은 색과 물체의 인지적 연관성이 우리가 그 색을 어떻게 지각하는가에 영향을 미친다는 것을 함의한다.", "한 연구에서, 참가자들은 일반적으로 빨간색인 물체의 색상과 같은 색상의 배경을 일치시키도록 요청받았을 때, 더 진한 빨강을 선택했는데, 이는 물체들의 색상에 대한 그들의 지식이 그들의 지각적 판단에 영향을 미쳤다는 것을 보여 준다."]}}, "2022": {"21": {"ty": "함축 의미", "text": "Research in the science of peak performance and motivation points to the fact that different tasks should ideally be matched to our energy level. For example, analytical tasks are best accomplished when our energy is high and we are free from distractions and able to focus. I generally wake up energized. Over the years, I have consistently stuck to the habit of “eating my problems for breakfast.” I’m someone who tends to overthink different scenarios and conversations that haven’t happened yet. When I procrastinate on talking with an unhappy client or dealing with an unpleasant email, I find I waste too much emotional energy during the day. It’s as if the task hangs over my head, and I’ll spend more time worrying about it, talking about it, and avoiding it, than it would actually take to just take care of it. So for me, it’ll always be the first thing I get done. If you know you are not a morning person, be strategic about scheduling your difficult work later in the day.", "tp": "에너지 수준에 따른 업무 배치와 어려운 일의 우선 처리", "ti": "Handle the Most Demanding Tasks When Your Energy Is High (에너지가 넘칠 때 가장 까다로운 일을 처리하 라)", "gi": "자신의 에너지 수준에 맞춰 업무를 배분해야 하며, 어려운 과제를 미루면 감정적 에너지가 낭비되므로 에너지가 충만한 시간에 가장 먼저 처리하는 것이 좋다.", "fl": ["[도입 - 원리]: 최고의 성과를 내기 위해서는 과업을 자신의 에너지 수준(energy level)에 맞춰야 함. (예: 분석적 업무 = 고에 너지/집중 가능할 때)", "[개인적 예시]: 필자는 아침에 에너지가 넘침. 따라서 \"아침 식사로 문제를 먹는(eating my problems for breakfast)\" 습관, 즉 어 려운 일을 아침에 제일 먼저 처리하는 습관을 가짐.", "[문제 제기 - 미루기의 폐해]: 불쾌한 일을 미루면(procrastinate), 하루 종일 시나리오를 과도하게 생각하며 감정적 에너지 (emotional energy)를 낭비하게 됨. 실제 처리 시간보다 걱정하는 시간이 더 김.", "[결론 - 조언]: 어려운 일은 에너지가 가장 높은 시간(필자의 경우 아침)에 가장 먼저(the first thing) 끝내라. (아침형 인간이 아니 라면 전략적으로 오후 늦게 배치하라.)"]}, "22": {"ty": "요지", "text": "In one study, when researchers suggested that a date was associated with a new beginning (such as “the first day of spring”), students viewed it as a more attractive time to kick-start goal pursuit than when researchers presented it as an unremarkable day (such as “the third Thursday in March”). Whether it was starting a new gym habit or spending less time on social media, when the date that researchers suggested was associated with a new beginning, more students wanted to begin changes right then. And more recent research by a different team found that similar benefits were achieved by showing goal seekers modified weekly calendars. When calendars depicted the current day (either Monday or Sunday) as the first day of the week, people reported feeling more motivated to make immediate progress on their goals.", "tp": "날짜에 부여된 의미와 목표 추구 동기", "ti": "The Power of \"New Beginning\" Dates in Goal Pursuit (\"새로운 시작\"이라는 날짜의 힘이 목표 추구에 미치는 영 향)", "gi": "날짜가 '새로운 시작'이라는 의미와 연관될 때 사람들은 목표 추구를 시작하려는 동기가 더 강하게 부여된다.", "fl": ["[실험 1 - 날짜의 의미]: '봄의 첫날'처럼 새로운 시작(new beginning)과 연관된 날짜 vs '3월의 세 번째 목요일' 같은 평범한 날(unremarkable day) 비교.", "[결과 1]: 새로운 시작과 연관될 때, 학생들은 운동이나 습관 개선 같은 목표를 바로 그때(right then) 시작하고 싶어 하는 경향이 큼.", "[실험 2 - 달력 조작]: 주간 달력을 수정하여 오늘(월요일 혹은 일요일)을 한 주의 첫날(the first day of the week)로 묘사함.", "[결론]: 사람들이 자신의 목표에 대해 즉각적인 진전(immediate progress)을 이루도록 더 큰 동기를 부여받음."]}, "23": {"ty": "주제", "text": "Native Americans often sang and danced in preparation for launching an attack. The emotional and neurochemical excitement that resulted from this preparatory singing gave them stamina to carry out their attacks. What may have begun as an unconscious, uncontrolled act — rushing their victims with singing and beating drums in a frenzy — could have become a strategy as the victors saw firsthand the effect their actions had on those they were attacking. Although war dances risk warning an enemy of an upcoming attack, the arousal and synchronizing benefits for the attackers may compensate for the loss of surprise. Humans who sang, danced, and marched may have enjoyed a strong advantage on the battlefield as well as intimidated enemies who witnessed such a spectacle. Nineteenth-and twentieth-century Germans feared no one more than the Scots — the bagpipes and drums were disturbing in their sheer loudness and visual spectacle.", "tp": "전쟁에서 소리와 움직임(춤/노래)을 활용하는 것의 이점", "ti": "Why War Dances Work: The Strategic Benefits of Sound and Motion (전쟁 춤은 왜 효과적인가: 소리와 움직임 의 전략적 이점)", "gi": "전투 전의 노래와 춤은 적에게 공격을 경고할 위험이 있지만, 아군에게 주는 정서적 흥분과 단결력, 그리고 적에 게 주는 공포감이 기습의 상실을 상쇄하는 전략적 이점을 제공한다.", "fl": ["[현상]: 북미 원주민들은 공격 전 노래와 춤을 춤. 이는 감정적/신경화학적 흥분(emotional and neurochemical excitement) 을 유발하여 체력(stamina)을 제공함.", "[진화 - 무의식에서 전략으로]: 처음에는 무의식적인 광란(frenzy)이었을 수 있으나, 승리자들이 그 효과를 목격하며 의도적인 전략(strategy)이 되었음.", "[손익 분석]: 적에게 경고를 주는 위험(risk warning)이 있지만, 아군의 각성(arousal)과 동기화(synchronizing) 이점이 기습의 상실 을 보상(compensate)함.", "[추가 효과]: 아군의 이점뿐만 아니라, 그 광경을 목격한 적들을 위협(intimidated)하는 효과도 있음.", "[역사적 예시]: 독일인들이 스코틀랜드군의 백파이프와 드럼 소리/시각적 장관을 가장 두려워했음."]}, "24": {"ty": "제목", "text": "The recent “cycling as a lifestyle” craze has expressed itself in an increase in the number of active cyclists and in growth of cycling club membership in several European, American, Australian and Asian urban areas. It has also been accompanied by a symbolic reinterpretation of the bicycle. After the bicycle had been associated with poverty for many years, expensive recreational bicycles or recreationally-inspired commuting bicycles have suddenly become aspirational products in urban environments. In present times, cycling has become an activity which is also performed for its demonstrative value, its role in identity construction and its effectiveness in impressing others and signaling social status. To a certain extent, cycling has turned into a symbolic marker of the well-off. Obviously, value-laden consumption behavior is by no means limited to cycling. However, the link with identity construction and conspicuous consumption has become particularly manifest in the case of cycling.", "tp": "현대 도시에서 자전거 타기의 변화된 위상과 상징성", "ti": "The Rise of Cycling: A New Status Symbol of City Dwellers (자전거 타기의 부상: 도시 거주자들의 새로운 지위 상징)", "gi": "과거 빈곤과 연관되었던 자전거는 오늘날 도시에서 부와 사회적 지위를 나타내고 정체성을 형성하는 과시적 소비 의 상징이 되었다.", "fl": ["[도입]: 전 세계 도시 지역에서 '라이프스타일로서의 자전거 타기' 열풍과 동호회 성장.", "[전환 - 상징적 재해석]: 과거에는 가난(poverty)과 연관되었으나, 이제는 고가의 자전거가 열망의 상품(aspirational products)이 됨.", "[기능의 변화]: 단순 이동 수단이 아니라 보여주기 가치(demonstrative value), 정체성 형성(identity construction), 사회적 지위 신호(signaling social status)의 역할을 함.", "[결론]: 자전거 타기는 부유한 사람들(the well-off)의 상징적 표시가 되었으며, 과시적 소비(conspicuous consumption) 의 명백한 사례가 됨."]}, "29": {"ty": "어법", "text": "Pre-emption means that a strategy is designed to prevent a rival from starting some particular activity. In some case a pre-emptive move may simply be an announcement of some intent that might discourage rivals from doing the same. The idea of pre-emption implies that timing is sometimes very important — a decision or an action at one point in time might be much more rewarding than doing it at a different time point. Pre-emption may involve up-weighting advertising for a period before and during when a new entrant launches into a market. The intent is to make it more difficult for the new entrant’s advertising to make an impression on potential buyers. Product proliferation is another potential pre-emption strategy. The general idea is to launch a large variety of product variants so that there is very little in the way of market demand that is not accommodated. Arguably, if a market is already filled with product variants it is more difficult for competitors to find untapped pockets of market demand.", "tp": "경쟁자의 진입을 막는 선매 행위(Pre-emption) 전략", "ti": "Pre-emption Strategies: How to Discourage Rivals (선매 행위 전략: 경쟁자를 단념시키는 방법)", "gi": "선매 행위는 의도 공표, 광고 증대, 제품 확산 등의 전략을 통해 경쟁자가 시장에 진입하거나 활동하는 것을 방 지하는 것이다.", "fl": ["[정의]: 선매 행위(Pre-emption)란 경쟁자가 특정 활동을 시작하는 것을 방지하는 전략.", "[전략 1 - 의도 공표]: 경쟁자가 같은 행동을 못 하도록 의도(intent)를 미리 알림. 타이밍(timing)이 핵심(먼저 하는 것이 훨씬 이득).", "[전략 2 - 광고 증대]: 신규 진입자가 시장에 들어올 때 광고 가중치(up-weighting advertising)를 높임 → 신규 진입자의 광 고가 소비자에게 인상 남기기 어렵게 만듦.", "[전략 3 - 제품 확산]: 다양한 제품 변형(product variants)을 출시하여 모든 시장 수요를 충족시킴(is not accommodated).", "[결과]: 시장이 이미 꽉 차 있으면 경쟁자가 점유되지 않은 수요(untapped pockets)를 찾기 어려워짐."]}, "30": {"ty": "어휘", "text": "Countershading is the process of optical flattening that provides camouflage to animals. When sunlight illuminates an object from above, the object will be brightest on top. The color of the object will gradually shade darker toward the bottom. This shading gives the object depth and allows the viewer to distinguish its shape. Thus even if an animal is exactly, but uniformly, the same color as the substrate, it will be easily visible when illuminated. Most animals, however, are darker above than they are below. When they are illuminated from above, the darker back is lightened and the lighter belly is shaded. The animal thus appears to be a single color and easily blends in with the substrate. This pattern of coloration, or countershading, destroys the visual impression of shape in the organism. It allows the animal to blend in with its background.", "tp": "동물의 위장술인 카운터셰이딩(Countershading)의 원리", "ti": "Countershading: Optical Flattening for Camouflage (카운터셰이딩: 위장을 위한 시각적 평평화)", "gi": "동물들은 위쪽이 어둡고 아래쪽이 밝은 배색(카운터셰이딩)을 통해 빛에 의한 자연적인 명암을 상쇄시킴으로써, 시각적으로 평평해 보이고 배경에 섞이게 된다.", "fl": ["[개념 정의]: 카운터셰이딩(Countershading)은 동물을 위장시키는 시각적 평평화(optical flattening) 과정임.", "[빛의 원리]: 위에서 빛을 받으면 물체는 위가 밝고 아래가 어두워짐 → 농도/입체감(depth)이 생겨 모양 식별 가능. (단색 동물 은 눈에 잘 띔)", "[동물의 적응]: 대부분 동물은 위쪽이 어둡고 아래쪽이 밝음.", "[상쇄 효과]: 빛을 받으면 어두운 등은 밝아지고, 밝은 배는 그늘짐 → 단일한 색(single color)처럼 보이게 됨.", "[결과]: 생물체 모양의 시각적 인상을 파괴(destroys)하여 배경과 섞이게(blend in) 함."]}, "31": {"ty": "빈칸", "text": "No learning is possible without an error signal. Organisms only learn when events violate their expectations. In other words, surprise is one of the fundamental drivers of learning. Imagine hearing a series of identical notes, AAAAA. Each note draws out a response in the auditory areas of your brain — but as the notes repeat, those responses progressively decrease. This is called “adaptation,” a deceptively simple phenomenon that shows that your brain is learning to anticipate the next event. Suddenly, the note changes: AAAAA#. Your primary auditory cortex immediately shows a strong surprise reaction: not only does the adaptation fade away, but additional neurons begin to vigorously fire in response to the unexpected sound. And it is not just repetition that leads to adaptation: what matters is whether the notes are predictable. For instance, if you hear an alternating set of notes, such as ABABA, your brain gets used to this alternation, and the activity in your auditory areas again decreases. This time, however, it is an unexpected repetition, such as ABABB, that triggers a surprise response.", "tp": "학습의 근본 동력으로서의 놀람(Surprise)과 예측 가능성", "ti": "Surprise Drives Learning: Why Prediction Errors Matter (놀람이 학습을 이끈다: 왜 예측 오류가 중요한가)", "gi": "학습은 기대가 빗나가는 '오류 신호(놀람)'가 있을 때 발생하며, 뇌는 단순 반복이 아니라 패턴의 예측 가능성에 적응한다.", "fl": ["[전제]:오류 신호(error signal) 없이는 학습 불가능. 기대가 위반될 때(violate expectations) 즉, 놀람(surprise)이 학습의 동 력임.", "[실험 1 - 적응]: 똑같은 음(AAAAA) 반복 → 뇌 반응 감소. 이를 적응(adaptation)이라 하며, 뇌가 다음 사건을 예상하고 있음 을 의미.", "[실험 1 - 놀람]: 음이 바뀜(AAAA#) → 강한 놀람 반응(strong surprise reaction), 뉴런 활성화.", "[심화 - 예측 가능성]: 적응의 핵심은 단순 반복이 아니라 예측 가능한가(predictable)임.", "[실험 2]: 교차 반복(ABABA)도 예측 가능하므로 적응함. 오히려 예상치 못한 반복(ABABB)이 놀람 반응을 유발함."]}, "32": {"ty": "빈칸", "text": "The connectedness of the global economic market makes it vulnerable to potential “infection.” A financial failure can make its way from borrowers to banks to insurers, spreading like a flu. However, there are unexpected characteristics when it comes to such infection in the market. Infection can occur even without any contact. A bank might become insolvent even without having any of its investments fail. Fear and uncertainty can be damaging to financial markets, just as cascading failures due to bad investments. If we all woke up tomorrow and believed that Bank X would be insolvent, then it would become insolvent. In fact, it would be enough for us to fear that others believed that Bank X was going to fail, or just to fear our collective fear! We might all even know that Bank X was well-managed with healthy investments, but if we expected others to pull their money out, then we would fear being the last to pull our money out. Financial distress can be self-fulfilling and is a particularly troublesome aspect of financial markets.", "tp": "금융 시장의 연결성과 두려움에 의한 감염", "ti": "Fear as a Virus: How Uncertainty Infects Financial Markets (바이러스로서의 두려움: 불확실성이 어떻게 금융 시장을 감염시키는가)", "gi": "전 세계 경제 시장의 연결성은 접촉 없이도 두려움과 불확실성만으로도 금융 위기(감염)를 초래할 수 있으며, 이 는 자기 충족적 예언이 될 수 있다.", "fl": ["[상황]: 글로벌 경제의 연결성(connectedness)은 시장을 잠재적 감염(potential infection)에 취약하게 만듦. (독감처럼 퍼 짐)", "[특징 - 비접촉 감염]: 접촉이나 실제 투자 실패 없이도 감염 가능. 원인은 두려움과 불확실성(Fear and uncertainty).", "[가정 상황]: 사람들이 X은행이 망할 것이라고 믿기만 해도(believed) 실제로 파산함.", "[심리 기제]: 은행이 건전해도, 남들이 돈을 뺄 것이라 예상하면 나도 뺌(집단적 두려움).", "[결론]: 재정적 고통은 자기 충족적(self-fulfilling)일 수 있음."]}, "33": {"ty": "빈칸", "text": "Negative numbers are a lot more abstract than positive numbers — you can’t see negative 4 cookies and you certainly can’t eat them — but you can think about them, and you have to, in all aspects of daily life, from debts to contending with freezing temperatures and parking garages. Still, many of us haven’t quite made peace with negative numbers. People have invented all sorts of funny little mental strategies to sidestep the dreaded negative sign. On mutual fund statements, losses (negative numbers) are printed in red or stuck in parentheses with no negative sign to be found. The history books tell us that Julius Caesar was born in 100 B.C., not -100. The underground levels in a parking garage often have designations like B1 and B2. Temperatures are one of the few exceptions: folks do say, especially here in Ithaca, New York, that it’s -5 degrees outside, though even then, many prefer to say 5 below zero. There’s something about that negative sign that just looks so unpleasant.", "tp": "음수(Negative numbers)의 추상성과 기피 현상", "ti": "Avoiding the Negative Sign: Our Uneasy Relationship with Negative Numbers (음수 기호 피하기: 음수와의 불 편한 관계)", "gi": "음수는 추상적이지만 일상에 필수적인데, 사람들은 음수 기호를 불쾌해하여 이를 피하기 위한 다양한 정신적 전 략(빨간색, 괄호, B.C., 지하층 표시 등)을 사용한다.", "fl": ["[속성]: 음수는 양수보다 훨씬 추상적(abstract)임 (볼 수도, 먹을 수도 없음). 하지만 일상(빚, 기온 등)에서 생각해야만 함.", "[반응]: 우리는 여전히 음수와 잘 지내지 못함(haven’t quite made peace).", "[전략]:두려운 음수 기호를 피하기 위해(sidestep the dreaded negative sign) 전략을 만듦. 손실 → 빨간색 인쇄 또는 괄호 () 역사 → -100년이 아니라 기원전(B.C.) 100년 주차장 → -1층이 아니라 B1", "[예외]: 기온은 예외지만, 여전히 '영하 5도(5 below zero)'라고 말하길 선호함. 음수 기호는 불쾌해 보임(looks so unpleasant)."]}, "34": {"ty": "빈칸", "text": "Observational studies of humans cannot be properly controlled. Humans live different lifestyles and in different environments. Thus, they are insufficiently homogeneous to be suitable experimental subjects. These confounding factors undermine our ability to draw sound causal conclusions from human epidemiological surveys. Confounding factors are variables (known or unknown) that make it difficult for epidemiologists to isolate the effects of the specific variable being studied. For example, Taubes argued that since many people who drink also smoke, researchers have difficulty determining the link between alcohol consumption and cancer. Similarly, researchers in the famous Framingham study identified a significant correlation between coffee drinking and coronary heart disease. However, most of this correlation disappeared once researchers corrected for the fact that many coffee drinkers also smoke. If the confounding factors are known, it is often possible to correct for them. However, if they are unknown, they will undermine the reliability of the causal conclusions we draw from epidemiological surveys.", "tp": "인간 관찰 연구의 어려움과 교란 변수(Confounding Factors)", "ti": "Why Human Observational Studies Are Tricky: The Problem of Confounding Factors (인간 관찰 연구가 까다 로운 이유: 교란 변수의 문제)", "gi": "인간은 생활 방식이 다양하여 통제된 실험이 어려우며, 교란 변수(음주와 흡연의 관계 등) 때문에 역학 조사에서 특정 변수의 영향만을 분리해 인과관계를 밝히는 것이 어렵다.", "fl": ["[한계]: 인간 관찰 연구는 통제 불가. 인간은 동질적이지 않음(insufficiently homogeneous).", "[원인]: 교란 변수(confounding factors)가 타당한 인과적 결론 도출을 방해함.", "[정의]: 교란 변수란 연구 중인 특정 변수의 영향을 분리(isolate the effects)하기 어렵게 만드는 변수.", "[예시 1]: 음주와 암의 관계 → 술 마시는 사람이 담배도 피움(교란 변수).", "[예시 2]: 커피와 심장병 → 커피 마시는 사람이 흡연도 함. 이를 수정(corrected)하자 상관관계 사라짐.", "[결론]: 교란 변수를 모르면 역학 조사의 신뢰성(reliability)이 훼손됨."]}, "35": {"ty": "무관한 문장", "text": "Of all the human emotions, none is trickier or more elusive than envy. It is very difficult to actually discern the envy that motivates people’s actions. The reason for this elusiveness is simple: we almost never directly express the envy we are feeling. Envy entails the admission to ourselves that we are inferior to another person in something we value. Not only is it painful to admit this inferiority, but it is even worse for others to see that we are feeling this. And so almost as soon as we experience the initial feelings of envy, we are motivated to disguise it to ourselves — it is not envy we feel but unfairness at the distribution of goods or attention, resentment at this unfairness, even anger.", "tp": "질투(Envy)의 속성과 이를 감추려는 심리", "ti": "The Disguise of Envy: Why We Hide Our Jealousy (질투의 위장: 우리가 질투심을 숨기는 이유)", "gi": "질투는 자신의 열등감을 인정해야 하는 고통스러운 감정이므로, 사람들은 이를 느끼자마자 불공평함이나 분노 같 은 다른 감정으로 위장하여 자신과 타인에게 숨긴다.", "fl": ["[특성]: 질투는 가장 까다롭고 이해하기 어려움(elusive). 행동의 원인으로 식별하기 어려움.", "[이유]: 우리는 질투를 절대 직접적으로 표현하지 않음(never directly express).", "[내면의 고통]: 질투는 열등감(inferiority)의 인정을 수반하며, 이는 고통스럽고 남에게 들키기 싫음.", "[방어 기제]: 질투를 느끼자마자 감추고자 함(disguise). 질투가 아니라 불공평함(unfairness), 분개, 분노라고 자신을 속임."]}, "36": {"ty": "순서 배열", "text": "The right to be forgotten is a right distinct from but related to a right to privacy. The right to privacy is, among other things, the right for information traditionally regarded as protected or personal not to be revealed. The right to be forgotten, in contrast, can be applied to information that has been in the public domain. The right to be forgotten broadly includes the right of an individual not to be forever defined by information from a specific point in time. One motivation for such a right is to allow individuals to move on with their lives and not be defined by a specific event or period in their lives. For example, it has long been recognized in some countries, such as the UK and France, that even past criminal convictions should eventually be “spent” and not continue to affect a person’s life. Despite the reason for supporting the right to be forgotten, the right to be forgotten can sometimes come into conflict with other rights. For example, formal exceptions are sometimes made for security or public health reasons.", "tp": "잊힐 권리(Right to be forgotten)의 개념, 필요성, 그리고 충돌", "ti": "The Right to Be Forgotten: Definition, Motivation, and Conflicts", "gi": "잊힐 권리는 사생활 권리와 달리 공공 영역의 정보에 적용되며, 개인이 과거의 특정 사건에 의해 영원히 정의되 지 않도록 돕지만, 안보나 공공 보건 등 다른 권리와 충돌할 수 있다.", "fl": ["[정의 비교]: 사생활 권리(privacy): 개인적 정보가 드러나지 않을 권리. 잊힐 권리(forgotten): 공공의 영역(public domain)에 있던 정보에 적용. 특정 시점의 정보로 영원히 정의되지 않을 권리.", "[동기]: 개인이 삶을 영위하고 과거에 얽매이지 않도록 함. (예: 범죄 기록도 시간이 지나면 소모(spent)되어야 함).", "[한계/충돌]: 다른 권리와 충돌(conflict)할 수 있음. 예외: 안보(security)나 공공 보건(public health) 이유."]}, "37": {"ty": "순서 배열", "text": "To an economist who succeeds in figuring out a person’s preference structure — understanding whether the satisfaction gained from consuming one good is greater than that of another — explaining behavior in terms of changes in underlying likes and dislikes is usually highly problematic. For instance, to argue that the baby boom and then the baby bust resulted from an increase and then a decrease in the public’s inherent taste for children, rather than a change in relative prices against a background of stable preferences, places a social scientist in an unsound position. In economics, such an argument about birth rates would be equivalent to saying that a rise and fall in mortality could be attributed to an increase in the inherent desire for death. For an economist, changes in income and prices, rather than changes in tastes, affect birth rates. When income rises, for example, people want more children (or, as you will see later, more satisfaction derived from children), even if their inherent desire for children stays the same.", "tp": "경제학자가 인간 행동(출산율 등)을 설명하는 방식", "ti": "Explaining Behavior: Income and Prices vs. Changes in Taste (행동 설명하기: 소득과 가격 대 기호의 변화)", "gi": "경제학자는 행동의 변화를 설명할 때 내재적인 기호(취향)의 변화보다는 소득이나 가격 같은 변수의 변화로 설명 하는 것을 선호한다.", "fl": ["[경제학자의 관점]: 행동을 기호의 변화(changes in underlying likes and dislikes)로 설명하는 것은 문제가 많음.", "[예시 - 출산율]: 베이비 붐/버스트를 아이에 대한 대중의 기호 변화(taste for children) 탓으로 돌리는 것은 불안정함.", "[비유]: 이는 마치 사망률 변화를 죽음에 대한 욕구 변화(desire for death)로 설명하는 것과 같음 (말이 안 됨).", "[경제학적 설명]: 기호보다는 소득과 물가(income and prices)의 변화가 원인임.", "[결론]: 소득이 오르면 내재적 욕구가 그대로여도 아이를 더 원하게 됨."]}, "38": {"ty": "문장 삽입", "text": "In the natural world, if an animal consumes a plant with enough antinutrients to make it feel unwell, it won’t eat that plant again. Intuitively, animals also know to stay away from these plants. Years of evolution and information being passed down created this innate intelligence. This “intuition,” though, is not just seen in animals. Have you ever wondered why most children hate vegetables? Dr. Steven Gundry justifies this as part of our genetic programming, our inner intelligence. Since many vegetables are full of antinutrients, your body tries to keep you away from them while you are still fragile and in development. It does this by making your taste buds perceive these flavors as bad and even disgusting. As you grow and your body becomes stronger enough to tolerate these antinutrients, suddenly they no longer taste as bad as before.", "tp": "아이들이 채소를 싫어하는 진화적/생물학적 이유", "ti": "Why Children Hate Vegetables: A Protective Instinct (아이들이 채소를 싫어하는 이유: 보호 본능)", "gi": "아이들이 채소를 싫어하는 것은 항영양소로부터 연약한 신체를 보호하기 위한 유전적 프로그래밍의 결과이며, 성 장하여 내성이 생기면 맛에 대한 인식이 바뀐다.", "fl": ["[동물의 본능]: 동물은 항영양소(antinutrients)가 있는 식물을 피함. 이는 진화된 타고난 지능(innate intelligence)임.", "[인간의 경우]: 아이들이 채소를 싫어하는 것도 같은 직관(intuition)이자 유전적 프로그래밍임.", "[원인]: 아이들은 연약하고 성장 중(fragile and in development)이라 몸이 항영양소를 피하려 함.", "[방법]: 미뢰(taste buds)가 채소 맛을 나쁘거나 역겹게 인식하게 만듦.", "[변화]: 성장하여 몸이 강해지면(tolerate), 맛이 더 이상 나쁘지 않게 됨."]}, "39": {"ty": "문장 삽입", "text": "The difference in the Moon’s gravitational pull on different parts of our planet effectively creates a “stretching force.” It makes our planet slightly stretched out along the line of sight to the Moon and slightly compressed along a line perpendicular to that. The tidal stretching caused by the Moon’s gravity affects our entire planet, including both land and water, inside and out. However, the rigidity of rock means that land rises and falls with the tides by a much smaller amount than water, which is why we notice only the ocean tides. The stretching also explains why there are generally two high tides (and two low tides) in the ocean each day. Because Earth is stretched much like a rubber band, the oceans bulge out both on the side facing toward the Moon and on the side facing away from the Moon. As Earth rotates, we are carried through both of these tidal bulges each day, so we have high tide when we are in each of the two bulges and low tide at the midpoints in between.", "tp": "조수(Tides)가 발생하는 원리와 매일 두 번의 만조가 생기는 이유", "ti": "The Moon’s Gravity and Tides: Why Two High Tides a Day? (달의 중력과 조수: 왜 하루에 두 번 만조가 올까?)", "gi": "달의 중력 차이가 지구를 잡아당겨 팽창시키는데, 암석과 달리 물은 유동적이어서 조수가 발생하며, 지구가 자전 하면서 하루에 두 번 팽창부(만조)를 통과하게 된다.", "fl": ["[원리]: 달의 중력 차이가 잡아 늘리는 힘(stretching force)을 만듦. 지구가 달 방향으로 늘어남.", "[영향 범위]: 땅과 물 모두 영향을 받음.", "[차이]: 암석은 단단함(rigidity) 때문에 변화가 적지만, 물은 커서 바다 조수만 눈에 띔.", "[현상 - 2번의 만조]: 지구가 고무줄처럼 늘어나 양쪽으로 팽창(bulge out)함 (달 향한 쪽 &반대쪽).", "[결과]: 지구 자전(rotates)으로 인해 우리는 매일 이 두 팽창부를 통과함 → 하루 2번 만조, 그 사이 2번 간조."]}, "40": {"ty": "요약문 완성", "text": "A study investigated the economic cost of prejudice based on blind assumptions. Researchers gave a group of Danish teenagers the choice of working with one of two people. The teenager had never met either of them. One of the people had a name that suggested they were from a similar ethnic or religious background to the teenager. The other had a name that suggested they were from a different ethnic or religious background. The study showed that the teenagers were prepared to earn an average of 8% less if they could work with someone they thought came from the same ethnic or religious background. And this prejudice was evident among teenagers with ethnic majority names as well as those with ethnic minority names. The teenagers were blindly making assumptions about the race of their potential colleagues. They then applied prejudice to those assumptions, to the point where they actually allowed that prejudice to reduce their own potential income. The job required the two teenagers to work together for just 90 minutes.", "tp": "가정에 근거한 선입견이 초래하는 경제적 비용", "ti": "The Cost of Prejudice: Choosing Bias Over Income (선입견의 대가: 소득보다 편향을 선택하다)", "gi": "십 대들은 단지 이름으로 추측된 인종적/종교적 배경이 자신과 비슷한 사람과 일하기 위해 잠재적 소득을 포기 하는 경향을 보였으며, 이는 선입견이 합리적 경제 행위보다 우선할 수 있음을 보여준다.", "fl": ["[실험 설계]: 덴마크 십 대 대상. 이름만 보고 파트너 선택 (유사 배경 vs 다른 배경).", "[결과]: 같은 배경의 사람과 일하기 위해 평균 8% 더 적게 벌 준비(prepared to earn 8% less)가 되어 있었음.", "[보편성]: 다수 인종, 소수 인종 십 대 모두에게서 선입견이 나타남.", "[비합리성]: 90분짜리 일임에도 불구하고, 맹목적인 가정(assumptions)에 근거한 선입견이 자신의 수입을 줄이는(reduce income) 것을 허용함."]}}, "2023": {"21": {"ty": "함축 의미", "text": "The arts and aesthetics offer emotional connection to the full range of human experience. \"The arts can be more than just sugar on the tongue,\" Anjan Chatterjee, a professor at the University of Pennsylvania, says. \"In art, when there's something challenging, which can also be uncomfortable, this discomfort, if we're willing to engage with it, offers the possibility of some change, some transformation. That can also be a powerful aesthetic experience.\" The arts, in this way, become vehicles to contend with ideas and concepts that are difficult and uncomfortable otherwise. When Picasso painted his masterpiece Guernica in 1937, he captured the heartbreaking and cruel nature of war, and offered the world a way to consider the universal suffering caused by the Spanish Civil War. When Lorraine Hansberry wrote her play A Raisin in the Sun, she gave us a powerful story of people struggling with racism, discrimination, and the pursuit of the American dream while also offering a touching portrait of family life.", "tp": "예술이 주는 불편함과 그것이 가져오는 변화의 힘", "ti": "Art: Beyond Pleasure to Transformation (예술: 즐거움을 넘어 변화로)", "gi": "예술은 단순히 달콤한 즐거움만을 주는 것이 아니라, 불편하고 도전적인 경험을 통해 변화와 성장의 기회를 제공 하며 고통스러운 현실을 다루는 매개체가 된다.", "fl": ["[도입]: 예술과 미학은 인간 경험의 전 범위에 정서적 연결을 제공함.", "[주장 - 인용]: 예술은 단순히 혀 위의 설탕(sugar on the tongue), 즉 쾌락 그 이상임. 도전적이고 불편함(discomfort)을 주 더라도, 그것에 참여하면 변화(change/transformation)의 가능성을 제공함.", "[기능]: 예술은 어렵고 불편한 아이디어와 씨름하는 수단(vehicles)이 됨.", "[예시 1 - 피카소]:Guernica를 통해 전쟁의 잔인함과 보편적 고통을 고찰하게 함.", "[예시 2 - 로레인 핸스베리]:A Raisin in the Sun을 통해 인종 차별과 투쟁하는 가족의 이야기를 전달함."]}, "22": {"ty": "요지", "text": "Many historians have pointed to the significance of accurate time measurement to Western economic progress. The French historian Jacques Le Goff called the birth of the public mechanical clock a turning point in Western society. Until the late Middle Ages, people had sun or water clocks, which did not play any meaningful role in business activities. Market openings and activities started with the sunrise and typically ended at noon when the sun was at its peak. But when the first public mechanical clocks were introduced and spread across European cities, market times were set by the stroke of the hour. Public clocks thus greatly contributed to public life and work by providing a new concept of time that was easy for everyone to understand. This, in turn, helped facilitate trade and commerce. Interactions and transactions between consumers, retailers, and wholesalers became less irregular. Important town meetings began to follow the pace of the clock, allowing people to better plan their time and allocate resources in a more efficient manner.", "tp": "공공 기계 시계의 도입과 서양의 경제적 발전", "ti": "How Public Mechanical Clocks Accelerated Western Economy (공공 기계 시계가 어떻게 서양 경제를 가속화했 는가)", "gi": "공공 기계 시계의 도입은 정확한 시간 개념을 제공하여 상업 활동과 거래를 규칙적으로 만들었고, 이는 서양 사 회의 경제적 진보에 크게 기여했다.", "fl": ["[전제]: 정확한 시간 측정(time measurement)은 서양 경제 진보에 중요함.", "[과거 - 부정확성]: 중세 말까지 해시계/물시계 사용 → 사업에 큰 역할 못 함. 시장은 해 뜨면 열고 정오에 닫음.", "[전환 - 기계 시계]:공공 기계 시계(public mechanical clocks) 도입 → 정각(stroke of the hour)에 시장 시간 설정.", "[영향 1 - 명확성]: 모두가 이해하기 쉬운 새로운 시간 개념 제공.", "[영향 2 - 경제 활성화]: 무역과 상업을 촉진(facilitate). 거래가 덜 불규칙적이 됨(less irregular).", "[결과]: 시간을 계획하고 자원을 효율적인 방식(efficient manner)으로 배분하게 됨."]}, "23": {"ty": "주제", "text": "Sylvan Goldman invented the shopping cart and introduced it in his stores in 1937. It was an excellent device that would make it easy for shoppers to buy as much as they wanted without getting tired or seeking others’ help. But Goldman discovered that in spite of his repeated advertisements and explanations, he could not persuade his shoppers to use the wheeled carts. Men were reluctant because they thought they would appear weak if they pushed such carts instead of carrying their shopping. Women wouldn’t touch them because the carts reminded them of baby carriages. It was only a few elderly shoppers who used them. That made the carts even less attractive to the majority of the shoppers. Then Goldman hit upon an idea. He hired several models, men and women, of different ages and asked them to wheel the carts in the store and shop. A young woman employee standing near the entrance told the regular shoppers, \"Look, everyone is using the carts. Why don’t you?\" That was the turning point. A few shills disguised as regular shoppers easily accomplished what logic, explanations, and advertisements failed to do. Within a few weeks shoppers readily accepted those carts.", "tp": "동료 행동(바람잡이)을 통한 쇼핑카트 사용 유도", "ti": "The Power of Social Proof: How Shoppers Accepted Carts (사회적 증거의 힘: 쇼핑객들은 어떻게 카트를 받아들 였는가)", "gi": "쇼핑카트의 편리함에도 불구하고 고객들이 사용을 꺼리자, 골드만은 모델(바람잡이)을 고용하여 타인의 행동을 모 방하려는 심리를 이용해 사용을 이끌어냈다.", "fl": ["[발명]: 1937년 Sylvan Goldman이 쇼핑카트 발명. (편리함: 지치지 않고 많이 구매 가능).", "[문제 - 거부]: 광고에도 불구하고 사용 설득 실패. 남성: 약해 보일까 봐(appear weak). 여성: 유모차(baby carriages)가 연상돼서.", "[악순환]: 노인들만 사용하여 매력이 더 떨어짐.", "[해결책 - 전략]: 다양한 연령대의 모델(shills/바람잡이)을 고용해 카트를 밀게 함. 직원이 \"모두가 쓰고 있다\"고 말함.", "[결과]: 동료 행동(peer behavior)의 설득력이 논리나 광고보다 효과적이었음. 쇼핑객들이 카트를 받아들임."]}, "24": {"ty": "제목", "text": "In response to human-like care robots, critics might charge that human-robot interactions create moral hazards for dementia patients. Even if deception is sometimes allowed when it serves worthy goals, should it be allowed for vulnerable users? Just as children on the autism spectrum with robot companions might be easily fooled into thinking of robots as friends, older adults with cognitive deficits might be. According to Alexis Elder, a professor at UMD, robots are false friends, inferior to true friendship. Reasoning along similar lines, John Sullins, a professor at Sonoma State University, holds that robots should \"remain iconic or cartoonish so that they are easily distinguished as synthetic even by unsophisticated users.\" At least then no one is fooled. Making robots clearly fake also avoids the so-called \"uncanny valley,\" where robots are perceived as scary because they so closely resemble us, but not quite. Other critics of robot deception argue that when care recipients are deceived into thinking that robots care, this crosses a line and violates human dignity.", "tp": "취약 계층을 위한 돌봄 로봇의 외형과 윤리적 문제", "ti": "Why Robots for Vulnerable People Should Look Like Robots (왜 취약 계층을 위한 로봇은 로봇처럼 보여야 하 는가)", "gi": "치매 환자나 자폐 아동 같은 취약한 사용자가 로봇을 친구로 착각하는 도덕적 위험(기만)을 피하기 위해, 로봇은 인간과 구별되는 외형을 가져야 한다.", "fl": ["[문제 제기]: 인간을 닮은 돌봄 로봇은 치매 환자에게 도덕적 위험(moral hazards)을 초래함.", "[핵심 질문]: 취약한 사용자(vulnerable users)를 속이는 것이 허용되는가? (자폐 아동, 인지 결함 노인 등).", "[전문가 의견 1]: Alexis Elder - 로봇은 가짜 친구(false friends)임.", "[전문가 의견 2]: John Sullins - 로봇은 상징적이거나 만화처럼(iconic or cartoonish) 남아야 함. 그래야 합성이란 것을 쉽게 구 별 가능.", "[이점]: 속임을 방지하고 불쾌한 골짜기(uncanny valley) 현상(너무 닮아서 무서운 것)을 피함.", "[윤리적 관점]: 로봇이 감정을 가진 척 속이는 것은 인간의 존엄성(human dignity)을 침해함."]}, "29": {"ty": "어법", "text": "Lectins are large proteins that serve as a crucial weapon that plants use to defend themselves. The lectins in most plants bind to carbohydrates as we consume the plant. They also bind to sugar molecules found in the gut, in the brain, between nerve endings, in joints and in all bodily fluids. According to Dr. Steven Gundry, these sticky proteins can interrupt messaging between cells and cause toxic and inflammatory reactions. Brain fog is just one result of lectins interrupting communication between nerves. An upset stomach is another common symptom of lectin overload. Dr. Gundry lists a wide range of other health problems including aching joints, dementia, headaches and infertility that have been resolved in his patients once they eliminated lectins from their diets. Dr. Paul Saladino writes that the hypothesis that lectins are involved in Parkinson’s disease is also gaining support, with animal studies showing that ‘lectins, once eaten, may be damaging the gut and travelling to the brain, where they appear to be toxic to dopaminergic neurons.’", "tp": "렉틴(Lectins)의 작용과 건강에 미치는 부정적 영향", "ti": "Lectins: Plant Defense Mechanisms Harmful to Humans (렉틴: 인간에게 해로운 식물의 방어 기제)", "gi": "식물의 방어 무기인 렉틴은 인체 내 탄수화물/당 분자와 결합하여 세포 간 통신을 방해하고 염증, 뇌안개, 파킨 슨병 등 다양한 건강 문제를 일으킬 수 있다.", "fl": ["[정의]: 렉틴(Lectins)은 식물이 자신을 방어하는 무기인 거대 단백질.", "[메커니즘]: 섭취 시 탄수화물 및 체내(장, 뇌, 관절 등) 당 분자와 결합(bind to).", "[피해 1 - Gundry 주장]: 세포 간 메시지 전달을 방해(interrupt) → 독성 및 염증 반응(inflammatory reactions) 유발. 증상: 브레인 포그(Brain fog), 위장 장애, 관절통 등. 렉틴 제거 시 해결됨.", "[피해 2 - Saladino 주장]:파킨슨병(Parkinson’s disease) 연관 가설. 렉틴이 장을 손상시키고 뇌로 이동하여 도파민 신경세포에 독성을 띰."]}, "30": {"ty": "어휘", "text": "Technology changes how individuals and societies understand the concept of privacy. The fact that someone has a new ability to access information or watch the actions of another does not justify doing so. Rather, advances in technology require citizens and policy makers to consider how privacy protections should be expanded. For example, when cameras first became available for commercial and private use, nations and citizens struggled over whether new laws should be enacted to protect individuals from being photographed without their permission. The reconsideration of privacy brought about by this new technology re-affirmed a distinction between private and public spaces. It was determined by most cultures that people automatically gave consent to being seen and thus recorded once they voluntarily stepped into a public space. Although some people might be uncomfortable with the spread of surveillance cameras, citizens in most cultures have adjusted to the fact that giving up the right not to be observed in these circumstances causes less harm to the community than failing to have surveillance.", "tp": "기술 발전과 프라이버시 개념의 변화 (공적 공간에서의 감시 수용)", "ti": "Technology and Privacy: Why We Accept Surveillance in Public (기술과 프라이버시: 우리가 공공장소의 감시를 받아들이는 이유)", "gi": "기술(카메라)의 발전으로 프라이버시 개념이 재고되었고, 공공장소에서는 안전을 위해 감시받지 않을 권리를 포기 하는 것이 사회적 해악을 줄인다는 합의에 도달했다.", "fl": ["[전제]: 기술은 프라이버시 개념을 변화시킴. 접근 능력이 있다고 해서 그것이 정당화(justify)되는 건 아님.", "[대응]: 프라이버시 보호가 어떻게 확장되어야 할지 고민 필요.", "[예시 - 카메라]: 카메라 도입 초기, 허가 없는 촬영 금지 법안 논쟁.", "[구분 재확인]: 사적 공간 vs 공적 공간(public spaces)의 구분.", "[합의]: 공적 공간에 자발적으로 들어가는 것은 관찰/녹화에 동의(consent)한 것으로 간주.", "[결론]: 감시 카메라가 불편할 수 있지만, 감시받지 않을 권리를 포기하는 것이 감시가 없는 것보다 지역사회에 더 적은 해(less harm)를 끼친다는 사실에 적응함."]}, "31": {"ty": "빈칸", "text": "Coincidence that is statistically impossible seems to us like an irrational event, and some define it as a miracle. But, as Montaigne has said, \"the origin of a miracle is in our ignorance at the level of our knowledge of nature, and not in nature itself.\" Glorious miracles have been later on discovered to be obedience to the laws of nature or a technological development that was not widely known at the time. As the German poet, Goethe, phrased it: \"Things that are mysterious are not yet miracles.\" The miracle assumes the intervention of a \"higher power\" in its occurrence that is beyond human capability to grasp. Yet there are methodical and simple ways to cause a miracle without divine revelation and inspiration. Instead of checking it out, investigating and finding the source of the event, we define it as a miracle. The miracle, then, is the excuse of those who are too lazy to think.", "tp": "기적의 본질과 인간의 무지", "ti": "Miracles: A Label for Our Ignorance (기적: 우리의 무지에 대한 라벨)", "gi": "우리가 기적이라고 부르는 것은 신의 개입이 아니라, 우리가 아직 자연법칙이나 기술을 이해하지 못했기 때문(무 지)이며, 이는 생각하기를 게을리하는 핑계일 뿐이다.", "fl": ["[통념]: 통계적으로 불가능한 우연(Coincidence) = 비합리적 사건 = 기적(miracle).", "[반박 - 몽테뉴]: 기적의 기원은 자연 그 자체가 아니라, 자연에 대한 우리의 무지(ignorance)에 있음.", "[설명]: 나중에 보면 기적은 자연법칙의 순응이나 알려지지 않은 기술이었음. (괴테: 신비로운 것이 아직 기적은 아님).", "[정의의 문제]: 기적은 인간 능력을 넘어서는 더 높은 힘(higher power)의 개입을 가정함.", "[결론]: 사건의 원인을 조사하지 않고 기적으로 정의하는 것은 생각하기 귀찮아하는 사람들의 핑계(excuse)임."]}, "32": {"ty": "빈칸", "text": "Information encountered after an event can influence subsequent remembering. External information can easily integrate into a witness’s memory, especially if the event was poorly encoded or the memory is from a distant event, in which case time and forgetting have degraded the original memory. With reduced information available in memory with which to confirm the validity of post-event misinformation, it is less likely that this new information will be rejected. Instead, especially when it fits the witness’s current thinking and can be used to create a story that makes sense to him or her, it may be integrated as part of the original experience. This process can be explicit (i.e., the witness knows it is happening), but it is often unconscious. That is, the witness might find himself or herself thinking about the event differently without awareness. Over time, the witness may not even know the source of information that led to the (new) memory. Sources of misinformation in forensic contexts can be encountered anywhere, from discussions with other witnesses to social media searches to multiple interviews with investigators or other legal professionals, and even in court.", "tp": "사후 정보가 기억 왜곡에 미치는 영향", "ti": "How Post-Event Information Distorts Memory (사건 후 정보가 어떻게 기억을 왜곡하는가)", "gi": "사건 후 접한 외부 정보는 특히 원본 기억이 희미할 때 쉽게 기억에 통합되어 왜곡을 일으키며, 목격자는 무의식 적으로 이 새로운 정보를 자신의 경험 일부로 받아들인다.", "fl": ["[현상]: 사건 후 정보가 추후 기억(subsequent remembering)에 영향 미침.", "[조건]: 기억이 잘 입력되지 않았거나(poorly encoded), 오래된 사건이라 희미해졌을 때 외부 정보가 쉽게 통합(integrate)됨.", "[과정]: 잘못된 정보를 확인할 근거가 부족하므로, 새로운 정보가 거부될 가능성이 적음(less likely that this new information will be rejected).", "[통합]: 현재 생각과 맞거나 말이 되는 이야기면 원본 경험의 일부로 통합됨. 이는 종종 무의식적(unconscious)임.", "[결과]: 시간이 지나면 정보의 출처(source)조차 모르게 됨. (법정, SNS, 수사관 등 다양한 곳에서 오염 발생)."]}, "33": {"ty": "빈칸", "text": "Correlations are powerful because the insights they offer are relatively clear. These insights are often covered up when we bring causality back into the picture. For instance, a used car dealer supplied data to statisticians to predict which of the vehicles available for purchase at an auction were likely to have problems. A correlation analysis showed that orange-colored cars were far less likely to have defects. Even as we read this, we already think about why it might be so: Are orange-colored car owners likely to be car enthusiasts and take better care of their vehicles? Or, is it because orange-colored cars are more noticeable on the road and therefore less likely to be in accidents, so they’re in better condition when resold? Quickly we are caught in a web of competing causal hypotheses. But our attempts to illuminate things this way only make them cloudier. Correlations exist; we can show them mathematically. We can’t easily do the same for causal links. So we would do well to hold off from trying to explain the reason behind the correlations.", "tp": "상관관계의 명확성과 인과관계의 복잡성", "ti": "Accept Correlations, Don't Obsess Over Causality (상관관계를 받아들이고, 인과관계에 집착하지 마라)", "gi": "상관관계는 명확한 통찰력을 주지만, 그 이유(인과관계)를 밝히려는 시도는 상황을 더 복잡하게 만들므로, 단순히 상관관계 자체를 활용하는 것이 낫다.", "fl": ["[장점]: 상관관계(Correlations)는 통찰력이 명확함.", "[문제점]: 인과관계(causality)를 끌어들이면 통찰력이 가려짐.", "[예시]: 중고차 경매 데이터 분석 → 주황색 차가 결함이 적음.", "[인과 추론의 함정]: '왜?'를 생각하기 시작함 (애호가라서? 눈에 잘 띄어서?). → 경쟁적인 가설의 거미줄(web of competing causal hypotheses)에 갇힘.", "[결론]: 설명하려는 시도는 상황을 흐리게 만듦(cloudier). 상관관계는 수학적으로 보일 수 있지만 인과관계는 어려움.", "[제언]: 상관관계 뒤의 이유를 설명하려는 것을 보류하는 것(hold off from trying to explain)이 낫다."]}, "34": {"ty": "빈칸", "text": "Most mice in the wild are eaten or die before their life span of two years is over. They die from external causes, such as disease, starvation, or predators, not due to internal causes, such as aging. That is why nature has made mice to live, on average, for no longer than two years. Now we have arrived at an important point: The average life span of an animal species, or the rate at which it ages, is determined by the average time that this animal species can survive in the wild. That explains why a bat can live to be 30 years old. In contrast to mice, bats can fly, which is why they can escape from danger much faster. Thanks to their wings, bats can also cover longer distances and are better able to find food. Every genetic change in the past that made it possible for a bat to live longer was useful, because bats are much better able than mice to flee from danger, find food, and survive.", "tp": "야생 동물의 수명을 결정하는 요인", "ti": "Survival Determines Lifespan: Why Bats Outlive Mice (생존이 수명을 결정한다: 박쥐가 쥐보다 오래 사는 이유)", "gi": "동물의 평균 수명은 야생에서 생존할 수 있는 평균 시간에 의해 결정된다. 위험을 피하고 생존할 확률이 높은 동 물(예: 박쥐)은 더 긴 수명을 갖도록 진화했다.", "fl": ["[관찰 - 쥐]: 야생 쥐는 2년 내 사망(질병, 기아, 포식자 등 외부적 원인). 노화(내부적 원인) 아님. 따라서 자연은 쥐의 수명을 2년으 로 설정.", "[원리 도출]: 동물의 수명(노화 속도)은 야생에서 생존할 수 있는 평균 시간에 의해 결정됨.", "[비교 - 박쥐]: 박쥐는 30년까지 생존. 이유: 날 수 있어서 위험에서 빨리 탈출(escape from danger), 먹이 찾기 유리.", "[진화]: 박쥐는 위험을 피하고 생존하는 능력이 뛰어나므로, 수명을 늘리는 유전적 변화가 유용했음."]}, "35": {"ty": "무관한 문장", "text": "Moral excellence, according to Aristotle, is the result of habit and repetition, though modern science would also suggest that it may have an innate, genetic component. This means that moral excellence will be broadly set early in our lives, which is why the question of how early to teach it is so important. Freud suggested that we don’t change our personality much after age five or thereabouts, but as in many other things, Freud was wrong. Recent psychological research shows that personality traits stabilize around age thirty in both men and women and regardless of ethnicity as the human brain continues to develop, both neuroanatomically and in terms of cognitive skills, until the mid-twenties. The advantage of this new understanding is that we can be a bit more optimistic than Aristotle and Freud about being able to teach moral excellence.", "tp": "도덕적 우수성의 형성 시기와 교육 가능성", "ti": "It's Not Too Late: Teaching Moral Excellence Beyond Childhood (너무 늦지 않았다: 어린 시절 이후의 도덕성 교육)", "gi": "도덕적 우수성은 어린 시절에 정해진다는 과거(아리스토텔레스, 프로이트)의 견해와 달리, 현대 연구는 뇌가 20대 중반까지 발달하고 성격이 30세 즈음 안정화되므로 도덕 교육이 이후에도 가능함을 시사한다.", "fl": ["[기존 견해]: 아리스토텔레스(습관/반복) + 현대 과학(유전) → 도덕성은 삶의 초기에 설정됨.", "[프로이트의 오류]: 5세 이후 성격 안 바뀐다고 주장했으나 틀렸음.", "[현대 연구]: 인간 뇌는 20대 중반까지 발달. 성격 특성은 30세 즈음에 안정화(stabilize around age thirty).", "[결론/이점]: 도덕적 우수성을 가르치는 것에 대해 더 낙관적(optimistic)일 수 있음 (늦게까지 교육 가능)."]}, "36": {"ty": "순서 배열", "text": "The size of a species is not accidental. It’s a fine-tuned interaction between a species and the world it inhabits. Over large periods of time, size fluctuations have often signalled significant changes in the environment. Generally speaking, over the last five hundred million years, the trend has been towards animals getting larger. It’s particularly notable in marine animals, whose average body size has increased 150-fold in this time. But we are beginning to see changes in this trend. Scientists have discovered that many animals are shrinking. Around the world, species in every category have been found to be getting smaller, and one major cause appears to be the heat. Animals living in the Italian Alps, for example, have seen temperatures rise by three to four degrees Celsius since the 1980s. To avoid overheating, chamois goats now spend more of their days resting rather than searching for food, and as a result, in just a few decades, the new generations of chamois are 25 percent smaller.", "tp": "기후 변화(온난화)로 인한 동물 크기의 감소", "ti": "Why Animals Are Shrinking: The Impact of Rising Temperatures (동물들이 줄어드는 이유: 기온 상승의 영향)", "gi": "과거에는 동물들이 커지는 경향이 있었으나, 최근 기온 상승(열)으로 인해 과열을 피하려다 보니 먹이 활동이 줄 어 몸집이 작아지고 있다.", "fl": ["[도입]: 종의 크기는 환경과의 상호작용 결과임. 크기 변동은 환경 변화 신호.", "[과거 추세 (B)]: 지난 5억 년간 동물들은 대형화(getting larger) 경향. (해양 동물 150배 증가).", "[변화 (A)]: 추세가 바뀜. 동물들이 줄어들고 있음(shrinking). 주요 원인은 열(heat).", "[구체적 예시 (C)]: 이탈리아 알프스(기온 상승). 샤모아 염소: 과열 피하려고 휴식 ↑, 먹이 활동 ↓ → 25% 작아짐."]}, "37": {"ty": "순서 배열", "text": "For a long time, random sampling was a good shortcut. It made analysis of large data problems possible in the pre-digital era. But much as converting a digital image or song into a smaller file results in loss of data, information is lost when sampling. Having the full (or close to the full) dataset provides a lot more freedom to explore, to look at the data from different angles or to look closer at certain aspects of it. A fitting example may be the light-field camera, which captures not just a single plane of light, as with conventional cameras, but rays from the entire light field, some 11 million of them. The photographers can decide later which element of an image to focus on in the digital file. There is no need to focus at the beginning, since collecting all the information makes it possible to do that afterwards. Because rays from the entire light field are included, it is closer to all the data. As a result, the information is more \"reuseable\" than ordinary pictures, where the photographer has to decide what to focus on before she presses the shutter.", "tp": "전체 데이터 수집의 이점 (샘플링과의 대조)", "ti": "From Sampling to Full Data: The Freedom of \"All the Data\" (샘플링에서 전체 데이터로: \"모든 데이터\"가 주는 자유)", "gi": "과거의 무작위 샘플링은 정보 손실이 있었지만, 전체 데이터를 수집하면(라이트 필드 카메라의 예처럼) 나중에 초 점을 맞추거나 재사용할 수 있는 자유를 얻는다.", "fl": ["[과거]: 무작위 샘플링(random sampling)은 좋은 지름길이었음.", "[한계 (B)]: 샘플링은 정보 손실(information is lost) 발생. 반면 전체 데이터셋(full dataset)은 탐구의 자유를 줌.", "[예시 (C)]:라이트 필드 카메라(light-field camera). 빛의 전 영역(1,100만 개 광선)을 포착.", "[이점 (A)]: 처음에 초점 맞출 필요 없음(나중에 가능). 정보가 재사용 가능(reuseable)함. (일반 사진과 대조됨)."]}, "38": {"ty": "문장 삽입", "text": "Introverted leaders do have to overcome the strong cultural presumption that extroverts are more effective leaders. Although the population splits into almost equal parts between introverts and extroverts, more than 96 percent of managers and executives are extroverted. In a study done in 2006, 65 percent of senior corporate executives viewed introversion as a barrier to leadership. We must reexamine this stereotype, however, as it doesn’t always hold true. Regent University found that a desire to be of service to others and to empower them to grow, which is more common among introverts than extroverts, is a key factor in becoming a leader and retaining leadership. So-called servant leadership, dating back to ancient philosophical literature, adheres to the belief that a company’s goals are best achieved by helping workers or customers achieve their goals. Such leaders do not seek attention but rather want to shine a light on others’ wins and achievements; servant leadership requires humility, but that humility ultimately pays off.", "tp": "내향적인 리더의 강점 (서번트 리더십)", "ti": "The Power of Introverted Leaders: Servant Leadership (내향적 리더의 힘: 서번트 리더십)", "gi": "외향적인 사람이 리더에 적합하다는 고정관념이 있지만, 내향적인 사람들의 '섬김(servant)'과 '겸손'은 훌륭한 리 더십의 핵심 요소가 된다.", "fl": ["[통념]: 외향적인 사람이 리더에 적합하다는 문화적 추정(presumption). 경영진의 96%가 외향적.", "[반전]: 이 고정관념을 재검토해야 함.", "[연구 결과]: 섬기려는 욕구(desire to be of service)가 리더십의 핵심 요인 (내향적인 사람에게 더 흔함).", "[개념]:서번트 리더십(servant leadership). 직원/고객의 목표 달성을 도움으로써 회사의 목표 달성.", "[특징]: 관심을 구하지 않고 타인을 빛내줌. 겸손(humility)이 결국 성과를 냄(pays off)."]}, "39": {"ty": "문장 삽입", "text": "By the nineteenth century, France had developed a system of precisely defined units of measurement to capture space, time, and more, and had begun to get other nations to adopt the same standards. Just half a century later, in the 1920s, the discoveries of quantum mechanics forever destroyed the dream of comprehensive and perfect measurement. And yet, outside a relatively small circle of physicists, the mindset of humankind’s drive to flawlessly measure continued among engineers and scientists. In the world of business it even expanded, as the precision-oriented sciences of mathematics and statistics began to influence all areas of commerce. However, contrary to the trend of the past several decades, in many new situations that are occurring today, allowing for imprecision - for messiness may be a positive feature, not a shortcoming. As a tradeoff for relaxing the standards of allowable errors, one can get a hold of much more data. It isn’t just that \"more is better than some,\" but that, in fact, sometimes \"more is greater than better.\"", "tp": "정밀성보다 대량의 데이터(불확실성/지저분함) 허용이 주는 이점", "ti": "Embracing Messiness: When More Data Beats Precision (지저분함을 포용하기: 더 많은 데이터가 정밀함을 이길 때)", "gi": "과거에는 완벽한 정밀함을 추구했으나, 현대에는 불확실성과 지저분함(imprecision/messiness)을 허용함으로써 훨씬 더 많은 데이터를 얻는 것이 긍정적인 특징이 될 수 있다.", "fl": ["[과거 - 정밀함 추구]: 19세기 프랑스의 정밀한 측정 단위 시스템.", "[충격]: 양자 역학이 완벽한 측정의 꿈을 깸.", "[지속]: 그럼에도 공학, 과학, 비즈니스에서는 정밀함에 대한 집착이 계속됨.", "[전환]: 오늘날 새로운 상황에서는 부정확함/지저분함(messiness)을 허용하는 것이 긍정적임.", "[이유 - 트레이드오프]: 오류 허용 기준을 완화하면 훨씬 더 많은 데이터(much more data)를 얻을 수 있음.", "[결론]: \"더 많은 것이 단지 더 좋은 것보다 낫다(More is greater than better).\""]}, "40": {"ty": "요약문 완성", "text": "Multiple laboratory studies show that cooperative people tend to receive social advantages from others. One way to demonstrate this is to give people the opportunity to act positively or negatively toward contributors. For example, Pat Barclay, a professor at the University of Guelph, had participants play a cooperative game where people could contribute money toward a group fund which helped all group members, and then allowed participants to give money to other participants based on their reputations. People who contributed more to the group fund were given responsibility for more money than people who contributed less. Similar results have been found by other researchers. People who contribute toward their groups are also chosen more often as interaction partners, preferred as leaders, rated as more desirable partners for long-term relationships, and are perceived to be trustworthy and have high social status. Uncooperative people tend to receive verbal criticism or even more severe punishment.", "tp": "협력적인 사람들이 얻는 사회적 이점", "ti": "", "gi": "집단에 기여하고 관대하게 행동하는 사람들은 평판이 좋아져서 파트너나 리더로 선택되는 등 사회적 혜택을 받는 다.", "fl": ["[전제]: 협력적인 사람(cooperative people)은 사회적 이점(social advantages)을 얻음.", "[실험]: 그룹 기금에 기여하고 평판에 따라 돈을 주는 게임.", "[결과]: 더 많이 기여한 사람이 더 많은 돈을 책임지게 됨.", "[확장]: 기여자는 파트너, 리더로 선호되며 신뢰할 수 있고 높은 지위를 가진 것으로 인식됨.", "[반대]: 비협조적인 사람은 비판이나 처벌을 받음."]}}};

21: {
ty: "함축 의미",
ti: "Virtue Can't Be Swallowed: Character Takes a Lifetime (미덕은 삼킬 수 없다: 인품은 평생에 걸쳐 만들어진다)",
tp: "미덕은 즉석에서 얻을 수 없고, 개인의 역사 속에서 형성되는 안정된 정체성의 일부라는 것",
